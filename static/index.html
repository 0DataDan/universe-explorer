    // === COSMIC PERSPECTIVE & DEPTH SHELL RESCALER ===
    function applyCosmicDepthProportions(item) {
      if (!item || !item.position || item.position.length < 3) return;
      const id = (item.id || '').toLowerCase();
      const type = (item.type || '').toLowerCase();
      const tier = item.tier || 1;

      // Keep Solar System (Tier 1: Sun, Planets, Moons, Asteroid Belt) untouched at the core
      const solarSystemIds = [
        'sun', 'sol', 'mercury', 'venus', 'earth', 'moon', 'mars',
        'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'ceres', 'halley'
      ];
      if (tier === 1 || solarSystemIds.includes(id) || type.includes('planet') || type === 'moon') {
        return;
      }

      let x = item.position[0], y = item.position[1], z = item.position[2];
      let currentDist = Math.sqrt(x * x + y * y + z * z);
      if (currentDist < 0.001) currentDist = 1.0;

      // Unit direction vector from Sol Core (0,0,0)
      const ux = x / currentDist;
      const uy = y / currentDist;
      const uz = z / currentDist;

      // Assign target radial distance shell based on astrophysical category/tier
      let targetDist = currentDist;
      if (['el-gordo', 'shapley-supercluster', 'great-attractor', 'smacs-0723', 'gn-z11', 'ton-618', 'bootes-void'].includes(id) || tier === 4) {
        // Tier 4: Deep Cosmological Web & Quasars (950 - 1,650 units out)
        targetDist = 950 + (currentDist * 4.5);
      } else if (['andromeda', 'sombrero-galaxy', 'centaurus-a', 'messier-87', 'lmc', 'smc', 'triangulum'].includes(id) || type.includes('galaxy') || tier === 3) {
        // Tier 3: Galaxies & Local Group (450 - 820 units out)
        targetDist = 450 + (currentDist * 3.2);
      } else if (['eagle-nebula', 'crab-nebula', 'orion-nebula', 'pillars-of-creation'].includes(id) || type.includes('nebula')) {
        // Tier 2B: Galactic Nebulae & Supernova Remnants (220 - 380 units out)
        targetDist = 220 + (currentDist * 2.2);
      } else {
        // Tier 2A: Stellar Neighbors, Pulsars, Stellar Black Holes (120 - 210 units out)
        targetDist = 120 + (currentDist * 1.6);
      }

      // Add vertical (Y-axis) 3D dispersion so objects don't sit on a flat pancake plane
      const hash = id.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      const verticalSpread = Math.sin(hash * 1.37) * 0.38;
      const ny = uy + verticalSpread;
      const norm = Math.sqrt(ux * ux + ny * ny + uz * uz) || 1.0;

      item.position[0] = (ux / norm) * targetDist;
      item.position[1] = (ny / norm) * targetDist;
      item.position[2] = (uz / norm) * targetDist;
    }

          varying vec3 vPosition;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;
          uniform float uTime;

            p += dot(p, p.yzx + 33.33);
            return fract((p.x + p.y) * p.z);
          }
          float vNoise(vec3 x) {

          #include <logdepthbuf_pars_fragment>

          varying vec3 vPosition;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;
          uniform float uTime;

          float hash(vec3 p) {
            p = fract(p * vec3(443.897, 441.423, 437.195));
            p += dot(p, p.yzx + 19.19);
            return fract((p.x + p.y) * p.z);
          }

          float noise3D(vec3 p) {
            vec3 i = floor(p);
            vec3 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                  mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
              mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                  mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z
            );
          }

          // Multi-octave fBm plasma turbulence
          float fbm(vec3 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
              v += a * noise3D(p);
              p = p * 2.08 + vec3(13.7, -9.2, 17.4);

          // Sharp cellular ridge noise for bubbling Bénard solar convection cells
          float granulationCells(vec3 p) {
            float n1 = 1.0 - abs(noise3D(p) * 2.0 - 1.0);
            float n2 = 1.0 - abs(noise3D(p * 2.12 + vec3(7.3, -4.1, 11.8)) * 2.0 - 1.0);
            float n3 = 1.0 - abs(noise3D(p * 4.25 - vec3(3.7, 9.4, -6.2)) * 2.0 - 1.0);
            return pow(n1 * 0.52 + n2 * 0.33 + n3 * 0.15, 1.45);

          void main() {
            #include <logdepthbuf_fragment>
            float t = uTime * 0.72;
            vec3 p = normalize(vPosition);

            vec3 warp = vec3(
              fbm(p * 5.0 + vec3(t * 0.55, -t * 0.42, t * 0.25)),
              fbm(p * 5.0 + vec3(-t * 0.48, t * 0.52, 8.3 - t * 0.3)),
              fbm(p * 5.0 + vec3(4.1 + t * 0.35, -t * 0.5, t * 0.45))
            );

            float fineCells = granulationCells(p * 28.0 + warp * 2.8 + vec3(t * 1.15, -t * 0.95, t * 1.05));
            float medCells  = granulationCells(p * 13.0 + warp * 2.0 - vec3(t * 0.75, t * 0.65, -t * 0.8));
            float macroFlow = fbm(p * 4.2 + warp * 1.1 + vec3(0.0, t * 0.3, 0.0));

            float latBelt = exp(-pow((abs(p.y) - 0.26) * 4.5, 2.0));
            float activeField = fbm(p * 6.0 + warp * 0.55 + vec3(t * 0.16, 0.0, -t * 0.14));
            float spotMetric = activeField * (0.68 + 0.42 * latBelt);
            float umbra    = smoothstep(0.67, 0.77, spotMetric);
            float penumbra = smoothstep(0.56, 0.68, spotMetric);

            float filamentNoise = granulationCells(p * 34.0 - warp * 3.2 + vec3(t * 1.4));
            float faculae = smoothstep(0.47, 0.60, spotMetric) * (1.0 - penumbra) * pow(filamentNoise, 0.85);

            float heat = fineCells * 0.50 + medCells * 0.32 + macroFlow * 0.18;
            heat = pow(clamp(heat, 0.0, 1.0), 0.92);
            heat += faculae * 0.48;
            heat -= penumbra * 0.42;
            heat -= umbra * 0.58;
            heat = clamp(heat, 0.0, 1.35);

            float mu = clamp(dot(normalize(vWorldNormal), normalize(vViewDir)), 0.0, 1.0);
            float limbDarkening = pow(mu, 0.48);
            float rimFactor = pow(1.0 - mu, 2.35);

            float spiculeWave = granulationCells(p * 38.0 + vec3(uTime * 1.9, -uTime * 1.6, uTime * 1.7));
            float rimSpicules = rimFactor * (0.6 + 0.95 * spiculeWave);

            vec3 colUmbra    = vec3(0.12, 0.015, 0.002);
            vec3 colDarkLane = vec3(0.72, 0.16, 0.01);
            vec3 colPhoto    = vec3(0.98, 0.52, 0.05);
            vec3 colGranule  = vec3(1.00, 0.84, 0.32);
            vec3 colFaculae  = vec3(1.00, 0.98, 0.88);
            vec3 colChromo   = vec3(1.00, 0.26, 0.02);

            vec3 baseColor;
            if (heat < 0.25) {
              baseColor = mix(colUmbra, colDarkLane, heat / 0.25);
            } else if (heat < 0.56) {
              baseColor = mix(colDarkLane, colPhoto, (heat - 0.25) / 0.31);
            } else if (heat < 0.84) {
              baseColor = mix(colPhoto, colGranule, (heat - 0.56) / 0.28);
            } else {
              baseColor = mix(colGranule, colFaculae, clamp((heat - 0.84) / 0.38, 0.0, 1.0));
            }

            vec3 limbTinted = mix(colChromo * 0.82, baseColor, 0.28 + 0.72 * limbDarkening);
            vec3 finalColor = limbTinted
                            + colChromo * rimSpicules * 0.65
                            + colFaculae * (faculae * (1.0 - mu * 0.6) * 0.52);

            gl_FragColor = vec4(finalColor, 1.0);
          }
        `
      });

    function applyCharacteristicTexturesToScene() {
      if (window._isApplyingTextures) return;

      const meshQueue = [];

        if (!obj.isMesh || !obj.geometry || !obj.material) return;
        if (obj.userData && obj.userData._nasaTextured) return;
        if (obj.geometry.type === 'RingGeometry' || obj.geometry.type === 'TorusGeometry' || obj.geometry.type === 'ConeGeometry') return;

        const meta = (obj.userData && obj.userData.name) ? obj.userData :
                     (obj.parent && obj.parent.userData && obj.parent.userData.name) ? obj.parent.userData : null;
        if (!meta || !meta.name) return;
        if (obj.material.wireframe) return;
        if (['sagittarius-a-star', 'ton-618', 'andromeda', 'triangulum', 'sombrero-galaxy', 'messier-87', 'bootes-void', 'el-gordo', 'centaurus-a', 'crab-nebula', 'eagle-nebula', 'orion-nebula', 'lmc', 'smc', 'great-attractor', 'shapley-supercluster', 'smacs-0723', 'gn-z11'].includes(meta.id)) return;
        if (obj.material.transparent && obj.material.opacity < 0.75) return;

        const kind = classifyMeshTextureKind(meta.name, meta.type);
        if (!kind) return;
        meshQueue.push({ obj, meta, kind });
      });

      let qIdx = 0;
      let texturedCount = 0;

      function processTextureBatch() {
        const startT = performance.now();
        while (qIdx < meshQueue.length && (performance.now() - startT) < 8) {
          const { obj, meta, kind } = meshQueue[qIdx++];
          if (obj.userData._nasaTextured) continue;

          const procTex = buildNASACanvasTexture(kind);
          const bumpTex = nasaBumpCache[kind];
          const isSelfLuminous = (kind === 'sun' || kind.startsWith('star-') || kind === 'stephenson' || kind.startsWith('nebula-') || kind.startsWith('galaxy-'));

          if (kind === 'sun') {
            obj.material = createAnimatedSunMaterial();
            if (!obj.getObjectByName("sun-chromosphere-spicules")) {
              obj.add(createAnimatedCoronaLayer((meta && meta.size) ? meta.size : 2.5));
            }
          } else if (isSelfLuminous) {
            obj.material = new THREE.MeshStandardMaterial({
              map: procTex,
              emissiveMap: procTex,
              emissive: new THREE.Color(0xffffff),
              emissiveIntensity: 1.15,
              roughness: 0.9,
              metalness: 0.0
            });
          } else {
            const isOceanWorld = (kind === 'earth');
            const isGasGiant = (kind === 'jupiter' || kind === 'saturn' || kind === 'uranus' || kind === 'neptune' || kind === 'venus');
            const isOumuamua = (kind === 'oumuamua');
            obj.material = new THREE.MeshStandardMaterial({
              map: procTex,
              bumpMap: bumpTex || null,
              bumpScale: isGasGiant ? 0.012 : isOceanWorld ? 0.035 : isOumuamua ? 0.115 : 0.065,
              roughness: isOceanWorld ? 0.42 : isGasGiant ? 0.68 : isOumuamua ? 0.76 : 0.88,
              metalness: isOceanWorld ? 0.12 : isOumuamua ? 0.08 : 0.04,
              emissiveMap: procTex,
              emissive: new THREE.Color(0xffffff),
              emissiveIntensity: isOumuamua ? 0.26 : 0.12
            });
          }
          obj.material.needsUpdate = true;
          obj.userData._nasaTextured = true;
          texturedCount++;
        }

        if (qIdx < meshQueue.length) {
          setTimeout(processTextureBatch, 0);
        } else {
          window._isApplyingTextures = false;
          window._texturesInitialized = true;
          console.log(`[NOVA] Applied 3D fBm & PBR materials to ${texturedCount} celestial bodies.`);

        lastTrackedTargetPos.copy(currentWorldPos);
      }

      controls.update();
      if (window._novaBeforeRender) window._novaBeforeRender(scene, camera, celestialObjects, celestialLabelEntries, activeTargetMesh);
      updateCelestialLabels(camDist);
      if (!window._texturesInitialized && celestialObjects.length > 5) {
        applyCharacteristicTexturesToScene();
        window._texturesInitialized = true;
      }

      if (typeof window.updateNovaAttitudeSphere === "function") {
        window.updateNovaAttitudeSphere();
      }
      renderer.render(scene, camera); if (window._novaAfterRender) window._novaAfterRender();
    }

    // === STREAMLINED SIDEBAR-INTEGRATED GUIDED COSMIC TOUR ENGINE ===
    let isTourActive = false;
    let isTourPaused = false;
    let tourPlaylist = [];
    let tourIndex = 0;
    let tourTimer = null;
    let tourProgressInterval = null;
    let tourStepStartTime = 0;
    let tourStepDuration = 16000;

    const TIER_LABELS = {
      1: "",
      2: "",
      3: "",
      4: ""
    };

    // Explicit Solar System heliocentric order so Earth -> Moon -> Mars -> Ceres -> Jupiter is always natural
    const TIER_1_ORDER = [
      "sun", "mercury", "venus", "earth", "moon", "mars",
      "ceres", "jupiter", "saturn", "uranus", "neptune",
      "halley-comet", "oumuamua", "sedna"
    ];

    function buildCosmicTourPlaylist() {
      const list = [];
      for (let t = 1; t <= 4; t++) {
        const intro = TIER_INTROS[t];
        const tierMeshes = celestialObjects.filter(m => m && m.userData && Number(m.userData.tier) === t);

        tierMeshes.sort((a, b) => {
          if (t === 1) {
            const idxA = TIER_1_ORDER.indexOf(a.userData.id);
            const idxB = TIER_1_ORDER.indexOf(b.userData.id);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          }
          const posA = new THREE.Vector3();
          const posB = new THREE.Vector3();
          a.getWorldPosition(posA);
          b.getWorldPosition(posB);
          return posA.length() - posB.length();
        });

        list.push({
          kind: "tier-intro",
          tier: t,
          badge: "",
          data: intro,
          camPos: intro.camPos,
          targetPos: intro.targetPos,
          dwellMs: Math.max(intro.dwellMs || 0, 22000) // Ensures intros get at least 22 seconds
        });

        tierMeshes.forEach((mesh, idx) => {
          const d = mesh.userData;
          list.push({
            kind: "object",
            tier: t,
            mesh: mesh,
            data: d,
            badge: TIER_LABELS[t],
            dwellMs: 19000
          });
        });
      }
      return list;
    }

    function updateTourButtonStyle(active) {
      const btn = document.getElementById("btn-cosmic-tour");
      const ring = document.getElementById("tour-ring-outer");
      const svg = document.getElementById("tour-compass-svg");
      if (!btn || !ring || !svg) return;

      if (active) {
        btn.className = "relative w-8 h-8 rounded-full bg-cyan-900/70 border border-cyan-300 flex items-center justify-center cursor-pointer transition duration-300 hover:scale-110 shadow-[0_0_14px_rgba(34,211,238,0.75)] shrink-0";
        ring.className = "absolute inset-0 rounded-full border border-dashed border-cyan-300 animate-mycelial";
        svg.setAttribute("class", "w-4 h-4 text-white animate-pulse");
      } else {
        btn.className = "relative w-8 h-8 rounded-full bg-cyan-950/50 border border-cyan-500/40 flex items-center justify-center cursor-pointer transition duration-300 hover:scale-110 shadow-[0_0_10px_rgba(6,182,212,0.3)] shrink-0";
        ring.className = "absolute inset-0 rounded-full border border-dashed border-cyan-400/40 transition-all duration-300";
        svg.setAttribute("class", "w-4 h-4 text-cyan-400 transition-transform duration-500");
      }
    }

    function updatePauseButtonIcon(paused) {
      const btn = document.getElementById("btn-tour-pause");
      const icon = document.getElementById("icon-tour-pause");
      if (!btn || !icon) return;
      if (paused) {
        btn.className = "relative w-6 h-6 rounded-full bg-amber-950/60 border border-amber-400/60 hover:border-amber-300 flex items-center justify-center text-amber-300 transition transform hover:scale-110 shadow-[0_0_8px_rgba(251,191,36,0.35)] cursor-pointer";
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M8 5v14l11-7z" />';
      } else {
        btn.className = "relative w-6 h-6 rounded-full bg-cyan-950/50 border border-cyan-500/50 hover:border-cyan-300 flex items-center justify-center text-cyan-300 transition transform hover:scale-110 shadow-[0_0_8px_rgba(6,182,212,0.3)] cursor-pointer";
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />';
      }
    }

    function clearTourTimers() {
      if (tourTimer) {
        clearTimeout(tourTimer);
        tourTimer = null;
      }
      if (tourProgressInterval) {
        clearInterval(tourProgressInterval);
        tourProgressInterval = null;
      }
    }

    function scheduleNextTourStep(dwellMs) {
      clearTourTimers();
      tourStepDuration = dwellMs;
      tourStepStartTime = performance.now();
      const bar = document.getElementById("tour-progress-bar");
      if (bar) bar.style.width = "0%";

      tourProgressInterval = setInterval(() => {
        if (!isTourActive || isTourPaused) return;
        const elapsed = performance.now() - tourStepStartTime;
        const pct = Math.min(100, (elapsed / tourStepDuration) * 100);
        if (bar) bar.style.width = `${pct}%`;
      }, 80);

      tourTimer = setTimeout(() => {
        if (!isTourActive || isTourPaused) return;
        tourIndex++;
        if (tourIndex >= tourPlaylist.length) {
          window.stopCosmicTour();
          resetToSolCore();
        } else {
          executeTourStep();
        }
      }, dwellMs);
    }

    let isTourVoiceMuted = false;
    let currentTourAudio = null;
    const preloadedAudioUrls = new Map();

    function cleanNarrationText(rawText) {
      if (!rawText) return "";
      return rawText
        .replace(/\^\d+/g, "")
        .replace(/\*/g, "")
        .replace(/’/g, "'")
        .trim();
    }

    function formatSpokenTitle(rawTitle) {
      if (!rawTitle) return "";
      // Convert "Name (Alternate)" -> "Name, also known as Alternate"
      return rawTitle.replace(/\s*\(([^)]+)\)/g, ", also known as $1");
    }

    function getStepNarrationText(step) {
      if (!step || !step.data) return "";
      const rawPrefix = step.kind === "tier-intro" ? step.data.title : step.data.name;
      const spokenPrefix = step.kind === "tier-intro" ? rawPrefix : formatSpokenTitle(rawPrefix);
      return cleanNarrationText(`${spokenPrefix}. ${step.data.summary}`);
    }

    function preloadTourStepAudio(stepIndex) {
      if (!tourPlaylist || tourPlaylist.length === 0) return;
      const idx = (stepIndex + tourPlaylist.length) % tourPlaylist.length;
      const step = tourPlaylist[idx];
      const filename = step.kind === "tier-intro" ? `tier-${step.tier}` : (step.data.id || "").toLowerCase();
      if (!filename || preloadedAudioUrls.has(filename)) return;

      const url = `./audio/tour/${filename}.mp3`;
      preloadedAudioUrls.set(filename, url);
      fetch(url).catch(() => {});
    }

    function stopTourAudio() {
      if (currentTourAudio) {
        currentTourAudio.onended = null;
        currentTourAudio.onerror = null;
        currentTourAudio.pause();
        currentTourAudio.currentTime = 0;
        currentTourAudio = null;
      }
    }

    function speakTourNarration(stepData, fallbackDwellMs = 19000) {
      stopTourAudio();
      clearTourTimers();

      // Preload next 3 stops in the background so audio is ready immediately
      if (isTourActive && tourPlaylist.length > 0) {
        preloadTourStepAudio(tourIndex + 1);
        preloadTourStepAudio(tourIndex + 2);
        preloadTourStepAudio(tourIndex + 3);
      }

      if (isTourVoiceMuted || !stepData) {
        if (isTourActive && !isTourPaused) {
          scheduleNextTourStep(fallbackDwellMs);
        }
        return;
      }

      const filename = stepData.kind === "tier-intro" ? `tier-${stepData.tier}` : (stepData.data.id || "").toLowerCase();
      const url = `./audio/tour/${filename}.mp3`;

      const audio = new Audio(url);
      audio.preload = "auto";
      currentTourAudio = audio;

      // Advance smoothly 1.5s after narration finishes
      audio.onended = () => {
        if (currentTourAudio === audio && isTourActive && !isTourPaused) {
          scheduleNextTourStep(1500);
        }
      };

      // Fallback timer if the MP3 is missing or fails to load
      audio.onerror = () => {
        if (currentTourAudio === audio && isTourActive && !isTourPaused) {
          scheduleNextTourStep(fallbackDwellMs);
        }
      };

      // Guard: if user clicked Pause while audio was still fetching, pause immediately on play
      audio.onplay = () => {
        if (isTourPaused && currentTourAudio === audio) {
          audio.pause();
        }
      };

      if (!isTourPaused) {
        audio.play().catch(() => {
          if (currentTourAudio === audio && isTourActive && !isTourPaused) {
            scheduleNextTourStep(fallbackDwellMs);
          }
        });
      }
    }
    
    // Pre-warm the first 3 tour stops shortly after startup so first run has zero delay
    setTimeout(() => {
      try {
        const warmupList = buildCosmicTourPlaylist();
        [0, 1, 2].forEach(i => {
          if (warmupList[i]) {
            const prefix = warmupList[i].kind === "tier-intro" ? warmupList[i].data.title : warmupList[i].data.name;
            const txt = cleanNarrationText(`${prefix}. ${warmupList[i].data.summary}`);
            if (txt && !preloadedAudioUrls.has(txt)) {
              // const u = `/api/tts?text=${encodeURIComponent(txt)}`;
              // preloadedAudioUrls.set(txt, u);
              // fetch(u).catch(() => {});
            }
          }
        });
      } catch (e) {}
    }, 1500);

    window.toggleTourVoice = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      isTourVoiceMuted = !isTourVoiceMuted;
      const btn = document.getElementById("btn-tour-voice");
      const icon = document.getElementById("icon-tour-voice");
      if (isTourVoiceMuted) {
        stopTourAudio();
        if (btn) btn.className = "relative w-6 h-6 rounded-full bg-slate-900/60 border border-slate-600 hover:border-slate-400 flex items-center justify-center text-slate-400 hover:text-slate-200 transition transform hover:scale-110 cursor-pointer";
        if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />';
      } else {
        if (btn) btn.className = "relative w-6 h-6 rounded-full bg-cyan-950/50 border border-cyan-500/50 hover:border-cyan-300 flex items-center justify-center text-cyan-300 transition transform hover:scale-110 shadow-[0_0_8px_rgba(6,182,212,0.3)] cursor-pointer";
        if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />';
      }
    };

    function executeTourStep() {
      if (!isTourActive || tourPlaylist.length === 0) return;
      clearTourTimers();

      const step = tourPlaylist[tourIndex];
      const spatialTourControls = document.getElementById("spatial-tour-controls");
      if (spatialTourControls) spatialTourControls.classList.remove("hidden");

      const badgeEl = document.getElementById("tour-step-badge");
      const counterEl = document.getElementById("tour-step-counter");
      if (badgeEl) badgeEl.textContent = step.badge;
      if (counterEl) counterEl.textContent = `${tourIndex + 1}/${tourPlaylist.length}`;

      if (manualTierLock !== 0) {
        filterTier(0);
      }

      if (step.tier === 4 && !isCosmicWebVisible) {
        window.toggleCosmicWeb();
      }

      window._spatialCalloutDismissedForMesh = null;

      if (step.kind === "tier-intro") {
        activeTargetMesh = null;
        activeTarget = step.data;
        if (typeof window.populateSpatialCallout === "function") {
          window.populateSpatialCallout(step.data, true);
        }
        speakTourNarration(step, step.dwellMs);
        TWEEN.removeAll();
        isFlyingToTarget = true;

        const startCam = camera.position.clone();
        const startTarget = controls.target.clone();
        const endCam = new THREE.Vector3(step.camPos.x, step.camPos.y, step.camPos.z);
        const endTarget = new THREE.Vector3(step.targetPos.x, step.targetPos.y, step.targetPos.z);

        const tweenObj = { t: 0 };
        new TWEEN.Tween(tweenObj)
          .to({ t: 1 }, 3200)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onUpdate(() => {
            camera.position.lerpVectors(startCam, endCam, tweenObj.t);
            controls.target.lerpVectors(startTarget, endTarget, tweenObj.t);
          })
          .onComplete(() => {
            isFlyingToTarget = false;
          })
          .start();

        // Timer synced with audio completion in speakTourNarration
      } else if (step.kind === "object" && step.mesh) {
        activeTargetMesh = step.mesh;
        activeTarget = step.data;
        if (typeof window.populateSpatialCallout === "function") {
          window.populateSpatialCallout(step.data, false);
        }
        speakTourNarration(step, step.dwellMs);
        smoothFlyToTarget(2800);

        // Timer synced with audio completion in speakTourNarration
      }
    }

    // Flag to ensure NOVA only introduces herself once per session
    let isFirstTourRun = true;

    window.toggleCosmicTour = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (isTourActive) {
        window.stopCosmicTour(e);
      } else {
        window.startCosmicTour();
      }
    };

    window.startCosmicTour = async function() {
      if (celestialObjects.length === 0) {
        await fetchCatalog();
      }
      tourPlaylist = buildCosmicTourPlaylist();
      if (tourPlaylist.length === 0) return;

      isTourActive = true;
      isTourPaused = false;
      isSidebarUserHidden = false;
      isPlanetOverviewEnabled = true;
      window._spatialCalloutDismissedForMesh = null;
      updateSidebarToggleStyle();
      tourIndex = 0;

      // Automatically enter Fullscreen mode when starting the tour
      applyZenUI(true, true);
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      const spatialTourControls = document.getElementById("spatial-tour-controls");
      if (spatialTourControls) spatialTourControls.classList.remove("hidden");
      const sidebarTourCtrl = document.getElementById("sidebar-tour-controls");
      if (sidebarTourCtrl) sidebarTourCtrl.classList.remove("hidden");

      updatePauseButtonIcon(false);
      updateTourButtonStyle(true);

      // First run: Play NOVA's introduction before starting step 0
      if (isFirstTourRun) {
        isFirstTourRun = false;
        stopTourAudio();
        clearTourTimers();

        const badgeEl = document.getElementById("tour-step-badge");
        const counterEl = document.getElementById("tour-step-counter");
        if (badgeEl) badgeEl.textContent = "NOVA";
        if (counterEl) counterEl.textContent = "INTRO";

        // --- CINEMATIC INTRO CAMERA SWEEP ---
        if (typeof TWEEN !== 'undefined') {
          TWEEN.removeAll();
          isFlyingToTarget = true; // Locks manual orbit while sweeping

          const startCam = camera.position.clone();
          // Push the camera out wide for a majestic starting view
          const sweepStart = new THREE.Vector3(startCam.x, Math.max(startCam.y, 250), Math.max(startCam.z, 500));
          // End position sets up perfectly for the "Solar System" Tier 1 jump
          const sweepEnd = new THREE.Vector3(-80, 120, 180); 
          
          const startTarget = controls.target.clone();
          const endTarget = new THREE.Vector3(0, 0, 0); // Focus on the Sun

          const tweenObj = { t: 0 };
          new TWEEN.Tween(tweenObj)
            .to({ t: 1 }, 21000) // 21-second sweep perfectly matches audio duration
            .easing(TWEEN.Easing.Sinusoidal.InOut)
            .onUpdate(() => {
              camera.position.lerpVectors(sweepStart, sweepEnd, tweenObj.t);
              controls.target.lerpVectors(startTarget, endTarget, tweenObj.t);
              if (controls.update) controls.update();
            })
            .onComplete(() => {
              isFlyingToTarget = false;
            })
            .start();
        }

        // IMPORTANT: Absolute path to static server root
        const introAudio = new Audio('/static/audio/tour/intro.mp3');
        introAudio.preload = "auto";
        currentTourAudio = introAudio;

        introAudio.onended = () => {
          if (isTourActive && !isTourPaused) {
            executeTourStep();
          }
        };

        introAudio.onerror = (err) => {
          console.error("Failed to load intro audio, proceeding to tour.", err);
          if (isTourActive && !isTourPaused) {
            executeTourStep();
          }
        };

        introAudio.play().catch((err) => {
          console.error("Autoplay blocked for intro, proceeding to tour.", err);
          executeTourStep();
        });
      } else {
        executeTourStep();
      }
    };

    window.stopCosmicTour = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      stopTourAudio();
      isTourActive = false;
      isTourPaused = false;
      isSidebarUserHidden = false;
      clearTourTimers();
      updateTourButtonStyle(false);

      const spatialTourControls = document.getElementById("spatial-tour-controls");
      if (spatialTourControls) spatialTourControls.classList.add("hidden");
      const sidebarTourCtrl = document.getElementById("sidebar-tour-controls");
      if (sidebarTourCtrl) sidebarTourCtrl.classList.add("hidden");

      window.dismissSpatialCallout();
      activeTarget = null;
      activeTargetMesh = null;
      if (typeof lastTrackedTargetPos !== "undefined") lastTrackedTargetPos.set(0, 0, 0);

      applyZenUI(false);
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      updateSidebarToggleStyle();
    };

    window.nextTourStep = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (!isTourActive) return;
      stopTourAudio();
      clearTourTimers();
      tourIndex = (tourIndex + 1) % tourPlaylist.length;
      executeTourStep();
    };

    window.prevTourStep = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (!isTourActive) return;
      stopTourAudio();
      clearTourTimers();
      tourIndex = (tourIndex - 1 + tourPlaylist.length) % tourPlaylist.length;
      executeTourStep();
    };

    window.togglePauseCosmicTour = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (!isTourActive) return;
      isTourPaused = !isTourPaused;
      updatePauseButtonIcon(isTourPaused);
      
      if (isTourPaused) {
        clearTourTimers();
        if (currentTourAudio && !currentTourAudio.paused) {
          currentTourAudio.pause();
        }
      } else {
        if (currentTourAudio && currentTourAudio.paused && currentTourAudio.currentTime < (currentTourAudio.duration || Infinity)) {
          currentTourAudio.play().catch(() => scheduleNextTourStep(5000));
        } else {
          scheduleNextTourStep(2500);
        }
      }
    };

    const tourBtnEl = document.getElementById("btn-cosmic-tour");
    if (tourBtnEl) {
      tourBtnEl.onclick = null;
      tourBtnEl.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.toggleCosmicTour(e);
      });
    }

    // === AUTONOMOUS OBSERVATORY STANDBY / SCREENSAVER SYSTEM ===
    let screensaverIdleTimer = null;
    let screensaverLingerTimer = null;
    let screensaverLastTargetIndex = -1;
    const SCREENSAVER_IDLE_TIMEOUT_MS = 60000; // 60s idle trigger

    function getScreensaverPool() {
      if (!celestialObjects || celestialObjects.length === 0) return [];
      return celestialObjects.filter(obj => {
        if (!obj || !obj.userData || !obj.userData.id) return false;
        const id = String(obj.userData.id).toLowerCase();
        return id !== "moon-orbit" && id !== "barycenter" && !id.includes("barycenter");
      });
    }

    function advanceScreensaverStep() {
      if (!isScreensaverActive) return;
      if (screensaverLingerTimer) {
        clearTimeout(screensaverLingerTimer);
        screensaverLingerTimer = null;
      }

      const pool = getScreensaverPool();
      if (pool.length === 0) return;

      let nextIdx = Math.floor(Math.random() * pool.length);
      if (pool.length > 1 && nextIdx === screensaverLastTargetIndex) {
        nextIdx = (nextIdx + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length;
      }
      screensaverLastTargetIndex = nextIdx;
      const targetMesh = pool[nextIdx];
      const targetData = targetMesh.userData;

      // Ensure all tiers visible so deep-space nodes render properly
      const tierNum = Number(targetData.tier) || 1;
      if (manualTierLock !== 0 && typeof filterTier === "function") {
        filterTier(0);
      }
      if (tierNum === 4 && !isCosmicWebVisible && typeof window.toggleCosmicWeb === "function") {
        window.toggleCosmicWeb();
      }

      activeTargetMesh = targetMesh;
      activeTarget = targetData;

      // Stop auto-rotation during cinematic flight
      controls.autoRotate = false;

      // Slower, cinematic easing flight (5,200ms)
      const flightDuration = 5200;
      window.smoothFlyToTarget(flightDuration);

      // Linger and orbit slowly around the target for 12 seconds
      screensaverLingerTimer = setTimeout(() => {
        if (!isScreensaverActive) return;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.42;

        // Schedule next random destination
        screensaverLingerTimer = setTimeout(() => {
          if (!isScreensaverActive) return;
          advanceScreensaverStep();
        }, 12000);
      }, flightDuration);
    }

    window.enterScreensaverMode = function() {
      if (isScreensaverActive) return;
      if (isTourActive) return;
      if (document.documentElement.classList.contains("is-booting")) return;

      isScreensaverActive = true;
      document.documentElement.classList.add("screensaver-active");

      // Dismiss active spatial telemetry callout and close drawers
      if (typeof window.dismissSpatialCallout === "function") window.dismissSpatialCallout();
      if (typeof window.closeMapKey === "function") window.closeMapKey();
      const labelsLayer = document.getElementById("celestial-labels-layer");
      if (labelsLayer) labelsLayer.style.display = "none";

      advanceScreensaverStep();
    };

    window.exitScreensaverMode = function() {
      if (!isScreensaverActive) return;
      isScreensaverActive = false;

      if (screensaverLingerTimer) {
        clearTimeout(screensaverLingerTimer);
        screensaverLingerTimer = null;
      }

      controls.autoRotate = false;
      document.documentElement.classList.remove("screensaver-active");
      const labelsLayer = document.getElementById("celestial-labels-layer");
      if (labelsLayer && areLabelsVisible) labelsLayer.style.display = "block";

      if (typeof window.resetScreensaverTimer === "function") {
        window.resetScreensaverTimer();
      }
    };

    window.toggleScreensaverMode = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (isScreensaverActive) {
        window.exitScreensaverMode();
      } else {
        window.enterScreensaverMode();
      }
    };

    Object.defineProperty(window, "isScreensaverActive", {
      get() { return isScreensaverActive; },
      set(val) {
        if (val) window.enterScreensaverMode();
        else window.exitScreensaverMode();
      },
      configurable: true
    });

    window.resetScreensaverTimer = function() {
      if (screensaverIdleTimer) {
        clearTimeout(screensaverIdleTimer);
        screensaverIdleTimer = null;
      }
      if (!isScreensaverActive) {
        screensaverIdleTimer = setTimeout(() => {
          if (isTourActive) return;
          if (document.documentElement.classList.contains("is-booting")) return;
          const mk = document.getElementById("map-key-drawer");
          if (mk && !mk.classList.contains("translate-x-[300px]")) return;
          const inqModal = document.getElementById("deep-space-inquiry-modal");
          if (inqModal && !inqModal.classList.contains("hidden")) return;
          if (typeof isTierMenuOpen !== "undefined" && isTierMenuOpen) return;

          window.enterScreensaverMode();
        }, SCREENSAVER_IDLE_TIMEOUT_MS);
      }
    };

    // Initialize idle timer
    window.resetScreensaverTimer();
  
  </script>
<script>
    // === SYNC MAP KEY TAB HEIGHT WITH MAP KEY DRAWER ===

    /* ==========================================================================
       NOVA Cinematic Boot Sequence & Interactive Wormhole Transition Controller
       ========================================================================== */
    window.handleHeaderLogoClick = function(event) {

    window.replayBootSequence = function() {
      try {
        localStorage.removeItem("hasBootedSession");

      const url = new URL(window.location.href);
      url.searchParams.set("boot", "1");

    (function initNovaCinematicBoot() {
      const hasBooted = false;

      const overlay = document.getElementById("nova-boot-overlay");
      if (hasBooted) {
        if (overlay) {
          overlay.style.display = "none";

        const headerLogo = document.getElementById("header-nova-logo");

        if (typeof controls !== "undefined" && controls) {
          controls.enabled = true;

          controls.enableZoom = true;
          controls.enablePan = true;

      }

      // Cold Start Mode: Render static NOVA wordmark immediately with zero flashing or delay
      document.documentElement.classList.add("is-booting");

      const baseWordmark = document.getElementById("nova-base-wordmark");
      if (baseWordmark) {

      const portalO = document.getElementById("nova-portal-o");
      if (portalO) {

      }

      // =========================================================================
      // INTERACTIVE MONOCHROME BOOT FIELD & VECTOR WORDMARK PHYSICS (ZERO COLOR)
      // =========================================================================
      let stopIdleBootField = (function initInteractiveBootField() {
        const canvas = document.getElementById("nova-warp-canvas");
        const svgEl = document.getElementById("nova-boot-svg");
        const overlayEl = document.getElementById("nova-boot-overlay");
        if (!canvas || !svgEl || !overlayEl) return null;

        const ctx = canvas.getContext("2d");
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);
        canvas.style.opacity = "1";

        // Sample original SVG wordmark paths for smooth, controlled elastic flexing
        const pathIds = ["nova-base-n", "nova-svg-o-top", "nova-svg-o-bot", "nova-base-v", "nova-base-a"];
        const idlePaths = [];
        pathIds.forEach((id) => {
          const el = document.getElementById(id);
          if (!el || typeof el.getTotalLength !== "function") return;
          const totalLen = el.getTotalLength();
          const numPts = Math.max(56, Math.ceil(totalLen / 2.0));
          const pts = [];
          for (let i = 0; i <= numPts; i++) {
            const pt = el.getPointAtLength((i / numPts) * totalLen);
            pts.push({ ox: pt.x, oy: pt.y, vx: 0, vy: 0, dx: 0, dy: 0 });
          }
          idlePaths.push({ el, pts });
        });

        const dotEl = document.getElementById("nova-base-a-dot");
        const idleDot = { ox: 657.5, oy: 71.5, r: 11.5, vx: 0, vy: 0, dx: 0, dy: 0, dr: 0, vr: 0 };

        // Monochrome background particles (kept identical to current feel)
        const particleCount = 115;
        const bgParticles = [];
        function seedParticles() {
          bgParticles.length = 0;
          for (let i = 0; i < particleCount; i++) {
            const hx = Math.random() * w;
            const hy = Math.random() * h;
            bgParticles.push({
              hx, hy,
              x: hx, y: hy,
              vx: 0, vy: 0,
              size: 0.9 + Math.random() * 1.5,
              baseAlpha: 0.16 + Math.random() * 0.32,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
        seedParticles();

        const onResize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          seedParticles();
        };
        window.addEventListener("resize", onResize);

        const pointer = { x: -9999, y: -9999, vx: 0, vy: 0, active: false };
        const ripples = [];

        const onMove = (e) => {
          if (pointer.active) {
            pointer.vx = e.clientX - pointer.x;
            pointer.vy = e.clientY - pointer.y;
          }
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.active = true;
        };

        const onDown = (e) => {
          if (e.target && e.target.closest && e.target.closest("#nova-portal-o")) return;
          // Single, whisper-thin hairline ripple that pushes particles and gently flexes letters
          ripples.push({
            x: e.clientX,
            y: e.clientY,
            r: 4,
            maxR: Math.hypot(w, h) * 0.75,
            speed: 8.2,
            alpha: 0.16,
            strength: 1.05,
            bandWidth: 72
          });
        };

        window.addEventListener("pointermove", onMove, { passive: true });
        overlayEl.addEventListener("pointerdown", onDown);

        let isRunning = true;
        let isPortalLaunching = false;
        let rafId = null;

        window.triggerPortalIdleShockwave = function(cx, cy) {
          isPortalLaunching = true;
          pointer.active = false;
          ripples.push({
            x: cx,
            y: cy,
            r: 4,
            maxR: Math.hypot(w, h) * 0.78,
            speed: 8.6,
            alpha: 0.20,
            strength: 1.35,
            bandWidth: 80
          });
        };

        function tick(now) {
          if (!isRunning) return;
          const t = now * 0.001;
          ctx.clearRect(0, 0, w, h);

          pointer.vx *= 0.85;
          pointer.vy *= 0.85;

          // 1. Find the 4 closest background particles within magnetic range (220px) — UNCHANGED
          const pullRadius = 220;
          const candidates = [];
          if (pointer.active) {
            for (let i = 0; i < bgParticles.length; i++) {
              const p = bgParticles[i];
              const d = Math.hypot(pointer.x - p.hx, pointer.y - p.hy);
              if (d < pullRadius) {
                candidates.push({ idx: i, d });
              }
            }
            candidates.sort((a, b) => a.d - b.d);
          }
          const pulledSet = new Set(candidates.slice(0, 4).map((c) => c.idx));

          // 2. Update & draw ultra-subtle hairline ripple ring (no heavy radial fill glow)
          for (let r = ripples.length - 1; r >= 0; r--) {
            const rip = ripples[r];
            rip.r += rip.speed;
            const progress = rip.r / rip.maxR;
            rip.alpha *= 0.972;
            rip.strength *= 0.980;

            if (rip.alpha <= 0.004 || progress >= 1.0) {
              ripples.splice(r, 1);
              continue;
            }

            ctx.strokeStyle = `rgba(255, 255, 255, ${rip.alpha.toFixed(3)})`;
            ctx.lineWidth = 0.75;
            ctx.beginPath();
            ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
            ctx.stroke();
          }

          // 3. Update & draw monochrome background particles — UNCHANGED
          for (let i = 0; i < bgParticles.length; i++) {
            const p = bgParticles[i];
            const targetHx = p.hx + Math.cos(t * 0.45 + p.phase) * 3.5;
            const targetHy = p.hy + Math.sin(t * 0.45 + p.phase) * 3.5;

            if (pulledSet.has(i)) {
              const dx = pointer.x - p.x;
              const dy = pointer.y - p.y;
              const dist = Math.hypot(dx, dy);
              const pullFactor = Math.max(0, 1 - dist / pullRadius);
              p.vx += dx * 0.022 * pullFactor;
              p.vy += dy * 0.022 * pullFactor;
              p.vx += (targetHx - p.x) * 0.025;
              p.vy += (targetHy - p.y) * 0.025;

              const lineAlpha = pullFactor * 0.22;
              if (lineAlpha > 0.01) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha.toFixed(3)})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(pointer.x, pointer.y);
                ctx.stroke();
              }
            } else {
              p.vx += (targetHx - p.x) * 0.038;
              p.vy += (targetHy - p.y) * 0.038;
            }

            let waveHighlight = 0;
            for (let r = 0; r < ripples.length; r++) {
              const rip = ripples[r];
              const rx = p.x - rip.x;
              const ry = p.y - rip.y;
              const rDist = Math.hypot(rx, ry) || 1;
              const bandDist = rDist - rip.r;
              if (Math.abs(bandDist) < rip.bandWidth) {
                const phase = (bandDist / rip.bandWidth) * Math.PI;
                const env = Math.cos(phase * 0.5);
                const waveForce = -Math.sin(phase) * env * rip.strength * 3.4;
                p.vx += (rx / rDist) * waveForce;
                p.vy += (ry / rDist) * waveForce;
                waveHighlight = Math.max(waveHighlight, env * rip.strength * 0.32);
              }
            }

            p.vx *= 0.87;
            p.vy *= 0.87;
            p.x += p.vx;
            p.y += p.vy;

            const activeBoost = (pulledSet.has(i) ? 0.42 : 0) + waveHighlight;
            const alpha = Math.min(0.98, p.baseAlpha + activeBoost);
            const radius = p.size * (1 + (pulledSet.has(i) ? 0.35 : 0) + waveHighlight * 0.6);
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.fill();
          }

         // 4. Balanced Elastic SVG Wordmark Flexing (Smooth, legible, zero twisting knots)
          const svgRect = svgEl.getBoundingClientRect();
          if (!isPortalLaunching && svgRect.width > 0 && svgRect.height > 0) {
            const scaleX = 734 / svgRect.width;
            const scaleY = 144 / svgRect.height;
            const svgMouseX = (pointer.x - svgRect.left) * scaleX;
            const svgMouseY = (pointer.y - svgRect.top) * scaleY;
            const svgRadius = 120; // Balanced proximity radius

            function stepSvgPoint(pt, isDot) {
              // Firmer spring return (0.11) and controlled damping (0.82)
              let fx = -pt.dx * 0.11;
              let fy = -pt.dy * 0.11;

              if (pointer.active) {
                const mx = pt.ox + pt.dx - svgMouseX;
                const my = pt.oy + pt.dy - svgMouseY;
                const mDist = Math.hypot(mx, my);
                if (mDist < svgRadius && mDist > 0.01) {
                  const norm = 1 - mDist / svgRadius;
                  const falloff = norm * norm;
                  fx += (mx / mDist) * falloff * 2.4 + pointer.vx * 0.045 * falloff;
                  fy += (my / mDist) * falloff * 2.4 + pointer.vy * 0.045 * falloff;
                }
              }

              // Smooth, medium wave undulation when a click ripple passes through the letters
              for (let r = 0; r < ripples.length; r++) {
                const rip = ripples[r];
                const ripSvgX = (rip.x - svgRect.left) * scaleX;
                const ripSvgY = (rip.y - svgRect.top) * scaleY;
                const ripSvgR = rip.r * scaleX;
                const bandW = rip.bandWidth * scaleX;
                const rx = pt.ox - ripSvgX;
                const ry = pt.oy - ripSvgY;
                const rDist = Math.hypot(rx, ry) || 1;
                const diff = rDist - ripSvgR;
                if (Math.abs(diff) < bandW) {
                  const phase = (diff / bandW) * Math.PI;
                  const env = Math.cos(phase * 0.5);
                  const radialWave = -Math.sin(phase) * env * rip.strength * 2.8;
                  const vertWave = Math.cos(phase) * env * rip.strength * 2.2;
                  fx += (rx / rDist) * radialWave;
                  fy += (ry / rDist) * radialWave * 0.45 + vertWave;
                  if (isDot) {
                    pt.vr += radialWave * 0.04;
                  }
                }
              }

              pt.vx = (pt.vx + fx) * 0.82;
              pt.vy = (pt.vy + fy) * 0.82;
              pt.dx = Math.max(-14, Math.min(14, pt.dx + pt.vx));
              pt.dy = Math.max(-12, Math.min(12, pt.dy + pt.vy));
            }

            idlePaths.forEach((item) => {
              const pts = item.pts;
              let dStr = "";
              for (let i = 0; i < pts.length; i++) {
                stepSvgPoint(pts[i], false);
                const px = pts[i].ox + pts[i].dx;
                const py = pts[i].oy + pts[i].dy;
                dStr += (i === 0 ? "M " : " L ") + px.toFixed(2) + " " + py.toFixed(2);
              }
              item.el.setAttribute("d", dStr);
            });

            if (dotEl) {
              stepSvgPoint(idleDot, true);
              idleDot.vr = (idleDot.vr - idleDot.dr * 0.12) * 0.82;
              idleDot.dr = Math.max(-2.5, Math.min(3.5, idleDot.dr + idleDot.vr));
              dotEl.setAttribute("cx", (idleDot.ox + idleDot.dx).toFixed(2));
              dotEl.setAttribute("cy", (idleDot.oy + idleDot.dy).toFixed(2));
              dotEl.setAttribute("r", (idleDot.r + idleDot.dr).toFixed(2));
            }
          }

          rafId = requestAnimationFrame(tick);
        }

        rafId = requestAnimationFrame(tick);

        return function cleanupIdleBootField() {
          isRunning = false;
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("resize", onResize);
          window.removeEventListener("pointermove", onMove);
          overlayEl.removeEventListener("pointerdown", onDown);
          if (ctx) ctx.clearRect(0, 0, w, h);
        };
      })();

      // Pure monochrome starfield warp canvas (Zero color tints, pure white stars)
      function runStarfieldWarp(cx, cy, duration = 6200) {
        const canvas = document.getElementById("nova-warp-canvas");
        if (!canvas) return null;
        const ctx = canvas.getContext("2d");
        const w = (canvas.width = window.innerWidth);
        const h = (canvas.height = window.innerHeight);

        canvas.style.opacity = "1";
        canvas.style.transition = "none";

        const numStars = 220;
        const stars = [];
        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: (Math.random() - 0.5) * w * 2.5,
            y: (Math.random() - 0.5) * h * 2.5,
            z: Math.random() * 1000 + 1,
            size: Math.random() * 0.9 + 0.4
          });
        }

        let startTime = performance.now();
        let animId = null;

        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1.0, elapsed / duration);
          const decel = Math.pow(1.0 - progress, 2.8);
          const speed = 1.5 + decel * 58;

          ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < numStars; i++) {
            const s = stars[i];
            const prevZ = s.z;
            s.z -= speed;

            if (s.z <= 1) {
              s.z = 1000;
              s.x = (Math.random() - 0.5) * w * 2.5;
              s.y = (Math.random() - 0.5) * h * 2.5;
              continue;
            }

            const k = 460 / s.z;
            const px = cx + s.x * k;
            const py = cy + s.y * k;
            const prevK = 460 / prevZ;
            const prevPx = cx + s.x * prevK;
            const prevPy = cy + s.y * prevK;

            if (px >= 0 && px <= w && py >= 0 && py <= h) {
              const starFade = progress > 0.45 ? Math.max(0, 1.0 - (progress - 0.45) / 0.45) : 1.0;
              const alpha = Math.min(0.4, (1000 - s.z) / 1000 * 0.48) * starFade;
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
              ctx.lineWidth = Math.min(1.2, s.size * (0.6 + speed / 80));
              ctx.beginPath();
              ctx.moveTo(prevPx, prevPy);
              ctx.lineTo(px, py);
              ctx.stroke();
            }
          }

          if (progress < 1.0) {
            animId = requestAnimationFrame(frame);
          } else {
            ctx.clearRect(0, 0, w, h);
          }
        }

        animId = requestAnimationFrame(frame);
        return function stopWarp() {
          if (animId) cancelAnimationFrame(animId);
          if (ctx) ctx.clearRect(0, 0, w, h);
        };
      }

      // Wave First, Followed 0.6s Later by Seamless Overlapping Tunnel Zoom
      function runStaggeredRippleAndZoom(onTunnelCleared, onStartWarp) {
        const svgEl = document.getElementById("nova-boot-svg");
        const portalO = document.getElementById("nova-portal-o");

        const pathIds = [
          "nova-base-n",
          "nova-svg-o-top",
          "nova-svg-o-bot",
          "nova-base-v",
          "nova-base-a"
        ];
        const sampledPaths = [];

        pathIds.forEach(id => {
          const el = document.getElementById(id);
          if (!el || typeof el.getTotalLength !== "function") return;
          const totalLen = el.getTotalLength();
          const numPts = Math.max(64, Math.ceil(totalLen / 1.5));
          const pts = [];
          for (let i = 0; i <= numPts; i++) {
            const pt = el.getPointAtLength((i / numPts) * totalLen);
            pts.push({ x: pt.x, y: pt.y });
          }
          sampledPaths.push({ el, pts });
        });

        const dotEl = document.getElementById("nova-base-a-dot");
        const dotOrig = { cx: 657.5, cy: 71.5, r: 11.5 };

        const originX = 278.0;
        const originY = 72.5;

        const waveDuration = 2200;  // Deliberate gravitational wave lifecycle
        const zoomDelayMs = 600;    // Zoom begins 0.6s in, while letters are mid-wobble
        const zoomDuration = 2400;  // Long, silky-smooth continuous glide
        let warpStarted = false;
        let tunnelCleared = false;
        const startTime = performance.now();

        const warpCanvasEl = document.getElementById("nova-warp-canvas");
        const warpCtx = warpCanvasEl ? warpCanvasEl.getContext("2d") : null;
        const portalEl = document.getElementById("nova-portal-o");
        const portalRect = portalEl ? portalEl.getBoundingClientRect() : null;
        const waveScreenCx = portalRect && portalRect.width > 0
          ? portalRect.left + portalRect.width * 0.5
          : window.innerWidth * 0.44;
        const waveScreenCy = portalRect && portalRect.height > 0
          ? portalRect.top + portalRect.height * 0.5
          : window.innerHeight * 0.5;

        function displaceVertex(px, py, tWave) {
          const dx = px - originX;
          const dy = py - originY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const nx = dist > 0.0001 ? dx / dist : 0;
          const ny = dist > 0.0001 ? dy / dist : 0;

          const waveSpeed = 425.0;
          const waveFront = tWave * 1.5 * waveSpeed;
          const distFromFront = dist - waveFront;

          const packetWidth = 125.0;
          const env = Math.exp(-(distFromFront * distFromFront) / (2.0 * packetWidth * packetWidth));
          const timeEnvelope = Math.sin(Math.min(1.0, tWave) * Math.PI);
          const activeEnv = env * timeEnvelope;

          // Balanced gravitational crest & trough across N-O-V-A letters
          const radialWave = Math.sin((distFromFront / packetWidth) * Math.PI * 2.2);
          const radialOffset = radialWave * 32.0 * activeEnv;
          const verticalOffset = Math.cos((dist * 0.024) - (tWave * 7.4)) * 26.0 * activeEnv;

          return {
            x: px + nx * radialOffset,
            y: py + ny * (radialOffset * 0.55) + verticalOffset,
            scale: 1.0 + radialWave * 0.36 * activeEnv
          };
        }

        function stepFrame(now) {
          const elapsed = now - startTime;
          const tWave = Math.min(1.0, elapsed / waveDuration);

          // 1. Update wave wobble deformation
          if (elapsed <= waveDuration + 100) {
            sampledPaths.forEach(item => {
              const pts = item.pts;
              let dStr = "";
              for (let i = 0; i < pts.length; i++) {
                const p = displaceVertex(pts[i].x, pts[i].y, tWave);
                dStr += (i === 0 ? "M " : " L ") + p.x.toFixed(2) + " " + p.y.toFixed(2);
              }
              item.el.setAttribute("d", dStr);
            });

            if (dotEl) {
              const dp = displaceVertex(dotOrig.cx, dotOrig.cy, tWave);
              dotEl.setAttribute("cx", dp.x.toFixed(2));
              dotEl.setAttribute("cy", dp.y.toFixed(2));
              dotEl.setAttribute("r", Math.max(4.0, dotOrig.r * dp.scale).toFixed(2));
            }
          }

          // 2. Start exponential tunnel zoom 0.6 seconds in (mid-wobble), running concurrently with the wave
          if (elapsed >= zoomDelayMs) {
            document.documentElement.classList.add("is-wormhole-zooming");
            const zoomElapsed = elapsed - zoomDelayMs;
            const pZoom = Math.min(1.0, zoomElapsed / zoomDuration);
            // Ultra-smooth cubic acceleration curve into the aperture
            const expCurve = Math.pow(pZoom, 2.6);
            const scale = 1.0 + expCurve * 135.0;
            const opacity = pZoom < 0.78 ? 1.0 : Math.max(0.0, 1.0 - (pZoom - 0.78) / 0.22);

            if (svgEl) {
              svgEl.style.transform = `scale(${scale.toFixed(3)})`;
              svgEl.style.opacity = opacity.toFixed(3);
            }

            const viewCenterX = window.innerWidth / 2;
            const viewCenterY = window.innerHeight / 2;
            // Start starfield warp right as zoom accelerates, seamlessly handing off from the idle particle canvas
            if (!warpStarted && pZoom >= 0.08) {
              warpStarted = true;
              if (typeof stopIdleBootField === "function") {
                stopIdleBootField();
                stopIdleBootField = null;
              }
              onStartWarp(viewCenterX, viewCenterY, 6200);
            }

            if (!tunnelCleared && pZoom >= 0.90) {
              tunnelCleared = true;
              onTunnelCleared();
            }
          }

          if (elapsed < zoomDelayMs + zoomDuration) {
            requestAnimationFrame(stepFrame);
          }
        }

        if (typeof window.triggerPortalIdleShockwave === "function") {
          window.triggerPortalIdleShockwave(waveScreenCx, waveScreenCy);
        }
        requestAnimationFrame(stepFrame);
      }

      let isWormholeRunning = false;
      function onPortalTriggerClick(e) {
        if (isWormholeRunning) return;
        isWormholeRunning = true;
        document.body.classList.remove('nova-portal-o-active', 'nova-cursor-hover');
        if (e && e.stopPropagation) e.stopPropagation();

        const portalO = document.getElementById("nova-portal-o");
        const svgEl = document.getElementById("nova-boot-svg");
        const splashContainer = document.getElementById("nova-boot-center-container");
        const warpCanvas = document.getElementById("nova-warp-canvas");

        if (portalO) {
          portalO.style.pointerEvents = "none";
          portalO.classList.remove("portal-ready");
          const arcs = portalO.querySelectorAll(".nova-portal-arc");
          arcs.forEach(arc => {
            arc.style.animation = "none";
            arc.style.stroke = "#ffffff";
            arc.style.filter = "drop-shadow(0 0 18px rgba(255, 255, 255, 0.98))";
          });
        }

        if (svgEl) {
          svgEl.style.transformOrigin = "37.87% 50.35%";
        }
        if (splashContainer) {
          splashContainer.style.transformOrigin = "37.87% 50.35%";
          splashContainer.style.pointerEvents = "none";
        }

        // Prepare 3D Solar System destination state
        if (typeof filterTier === "function") filterTier(0);
        const slider = document.getElementById("scale-slider");
        if (slider) slider.value = "3.70";
        if (typeof controls !== "undefined") {
          controls.target.set(0, 0, 0);
          controls.enabled = false;
        }
        if (typeof lastTrackedTargetPos !== "undefined") {
          lastTrackedTargetPos.set(0, 0, 0);
        }
        if (typeof sunMeshRef !== "undefined" && sunMeshRef) {
          activeTargetMesh = sunMeshRef;
          activeTarget = sunMeshRef.userData;
        }
        if (typeof applyCharacteristicTexturesToScene === "function") {
          applyCharacteristicTexturesToScene();
        }
        if (typeof camera !== "undefined") {
          camera.position.set(0, 36, 52);
          camera.fov = 56;
          camera.updateProjectionMatrix();
        }

        let stopWarp = null;

        runStaggeredRippleAndZoom(
          () => {
            if (typeof sunMeshRef !== "undefined" && sunMeshRef) {
              activeTargetMesh = sunMeshRef;
              activeTarget = sunMeshRef.userData;
            }
            if (typeof lastTrackedTargetPos !== "undefined") {
              lastTrackedTargetPos.set(0, 0, 0);
            }
            isFlyingToTarget = true;
            if (typeof controls !== "undefined" && controls) {
              controls.enabled = false;
              controls.target.set(0, 0, 0);
            }

            if (typeof camera !== "undefined" && typeof TWEEN !== "undefined") {
              TWEEN.removeAll();

              // Continuous, slow cinematic zoom-in directly onto the Sun ({0, 9.0, 13.0}) matching the reference screenshot on completion
              const zoomDuration = 4800;
              new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 9.0, z: 13.0 }, zoomDuration)
                .easing(TWEEN.Easing.Cubic.Out)
                .onUpdate(() => {
                  camera.lookAt(0, 0, 0);
                  if (typeof controls !== "undefined" && controls) {
                    controls.target.set(0, 0, 0);
                  }
                  if (typeof updateScaleSliderFromCamera === "function") {
                    updateScaleSliderFromCamera();
                  }
                })
                .onComplete(() => {
                  camera.position.set(0, 9.0, 13.0);
                  camera.fov = 50;
                  camera.updateProjectionMatrix();
                  document.documentElement.classList.remove("is-wormhole-zooming");
                  if (typeof controls !== "undefined" && controls) {
                    controls.target.set(0, 0, 0);
                    controls.enabled = true;
                    controls.enableRotate = true;
                    controls.enableZoom = true;
                    controls.enablePan = true;
                    controls.update();
                  }
                  if (typeof updateScaleSliderFromCamera === "function") {
                    updateScaleSliderFromCamera();
                  }
                  if (stopWarp) stopWarp();
                  isFlyingToTarget = false;
                  isWormholeRunning = false;
                  try {
                    localStorage.setItem("hasBootedSession", "true");
                  } catch (e) {}

                  if (overlay) {
                    overlay.style.display = "none";
                    overlay.style.pointerEvents = "none";
                    overlay.classList.add("boot-completed");
                  }
                  if (splashContainer) {
                    splashContainer.style.display = "none";
                    splashContainer.style.pointerEvents = "none";
                    splashContainer.classList.add("boot-completed");
                  }
                  if (warpCanvas) {
                    warpCanvas.style.display = "none";
                    warpCanvas.style.pointerEvents = "none";
                    warpCanvas.classList.add("boot-completed");
                  }
                })
                .start();

              const fovState = { fov: 56 };
              new TWEEN.Tween(fovState)
                .to({ fov: 50 }, zoomDuration)
                .easing(TWEEN.Easing.Cubic.Out)
                .onUpdate(() => {
                  camera.fov = fovState.fov;
                  camera.updateProjectionMatrix();
                })
                .start();
            }

            if (overlay) {
              overlay.style.pointerEvents = "none";
              overlay.style.transition = "opacity 1200ms ease-out";
              overlay.style.opacity = "0";
            }
            if (warpCanvas) {
              warpCanvas.style.pointerEvents = "none";
              warpCanvas.style.transition = "opacity 1600ms ease-out";
              setTimeout(() => { warpCanvas.style.opacity = "0"; }, 400);
            }

            setTimeout(() => {
              document.documentElement.classList.remove("is-booting");
              const hudElements = [
                document.getElementById("header-nav"),
                document.getElementById("bottom-hud"),
                document.getElementById("map-key-summon-btn"),
                document.getElementById("celestial-labels-layer"),
                document.getElementById("odometer-group")
              ];
              hudElements.forEach(el => {
                if (el) {
                  el.style.transition = "opacity 1400ms cubic-bezier(0.16, 1, 0.3, 1)";
                  el.style.opacity = "1";
                  el.style.visibility = "visible";
                }
              });
              if (typeof updateSidebarToggleStyle === "function") {
                updateSidebarToggleStyle();
              }
            }, 1000);
          },
          (cx, cy, duration) => {
            stopWarp = runStarfieldWarp(cx, cy, duration);
          }
        );
      }
    })();

<script>
  (function() {
    console.log('NOVA CUSTOM CURSOR LOADED v3');
    const dot = document.getElementById('nova-cursor-dot');
    const halo = document.getElementById('nova-cursor-halo');
    const canvas = document.getElementById('nova-trail-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Initialize cursor dead-center inside #nova-portal-o on the boot screen
    function getPortalOCenterAndRadius() {
      const portalEl = document.getElementById('nova-portal-o') || document.getElementById('nova-portal-glow');
      const bootOverlay = document.getElementById('nova-boot-overlay');
      const isBootVisible = bootOverlay && !bootOverlay.classList.contains('boot-completed') && bootOverlay.style.display !== 'none';
      if (portalEl && isBootVisible) {
        const rect = portalEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          return {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2,
            r: Math.max(rect.width, rect.height) / 2,
            active: true
          };
        }
      }
      return { x: width / 2, y: height / 2, r: 0, active: false };
    }

    let mouse = { x: -100, y: -100 };
    let haloPos = { x: -100, y: -100 };
    let hasUserMovedPointer = false;

    if (dot) { dot.style.opacity = '0'; }
    if (halo) { halo.style.opacity = '0'; }

    // Check on every pointer move whether the cursor is anywhere inside or on the letter O circle
    window.addEventListener('mousemove', (e) => {
      if (!hasUserMovedPointer) {
        hasUserMovedPointer = true;
        mouse.x = haloPos.x = e.clientX;
        mouse.y = haloPos.y = e.clientY;
        if (dot) { dot.style.opacity = '1'; }
        if (halo) { halo.style.opacity = '1'; }
      }
      const p = getPortalOCenterAndRadius();
      if (p.active) {
        const dist = Math.hypot(e.clientX - p.x, e.clientY - p.y);
        const portalEl = document.getElementById('nova-portal-o');
        // Full outer radius of the O ring + stroke padding
        if (dist <= p.r + 6) {
          document.body.classList.add('nova-portal-o-active');
      document.body.classList.remove('nova-cursor-hover');
          if (portalEl) {
            portalEl.querySelectorAll('.nova-portal-arc').forEach(arc => {
              arc.style.stroke = '#ffffff';
              arc.style.filter = 'drop-shadow(0 0 12px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 22px rgba(255, 255, 255, 0.35))';
            });
          }
        } else {
          document.body.classList.remove('nova-portal-o-active');
          if (portalEl) {
            portalEl.querySelectorAll('.nova-portal-arc').forEach(arc => {
              arc.style.stroke = '';
              arc.style.filter = '';
            });
          }
        }
      } else {
        document.body.classList.remove('nova-portal-o-active');
      }
    });
    const particles = [];
    let isPointerMoving = false;
    let pointerStopTimer = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      dot.style.left = `${mouse.x}px`;
      dot.style.top = `${mouse.y}px`;

      isPointerMoving = true;
      if (pointerStopTimer) clearTimeout(pointerStopTimer);
      pointerStopTimer = setTimeout(() => {
        isPointerMoving = false;
      }, 65);

      if (Math.random() > 0.25) {
        particles.push({
          x: mouse.x + (Math.random() - 0.5) * 4,
          y: mouse.y + (Math.random() - 0.5) * 4,
          size: Math.random() * 1.6 + 0.4,
          alpha: 0.55,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25
        });
      }
    });

    const interactiveSelectors = '#nova-portal-o, #nova-portal-glow, .celestial-label, a, button, [role="button"], input, select, .interactive';
    document.addEventListener('mouseover', (e) => {
      if (e.target && e.target.hasAttribute && e.target.hasAttribute('title')) {
        e.target.removeAttribute('title');
      }
      if (e.target.closest && e.target.closest(interactiveSelectors)) {
        document.body.classList.add('nova-cursor-hover');
      }
      if (e.target && e.target.classList && (e.target.classList.contains('label') || e.target.classList.contains('planet-label') || e.target.tagName === 'SPAN')) {
        document.body.classList.add('nova-cursor-hover');
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest && e.target.closest(interactiveSelectors)) {
        document.body.classList.remove('nova-cursor-hover');
      }
      if (e.target && e.target.classList && (e.target.classList.contains('label') || e.target.classList.contains('planet-label') || e.target.tagName === 'SPAN')) {
        document.body.classList.remove('nova-cursor-hover');
      }
    });

    document.querySelectorAll('[title]').forEach(el => el.removeAttribute('title'));

    function animateCursor() {
      ctx.clearRect(0, 0, width, height);

      // Check if an interactive element or 3D celestial object is currently highlighted
      const isHighlighted =
        document.body.classList.contains('nova-cursor-hover') ||
        document.body.classList.contains('nova-portal-o-active') ||
        document.body.classList.contains('nova-orb-locked');

      // Longer trail behind cursor while moving (0.065); rapid snap to cursor when stopped or highlighted (0.42)
      const haloLerp = (!isPointerMoving || isHighlighted) ? 0.42 : 0.065;
      haloPos.x += (mouse.x - haloPos.x) * haloLerp;
      haloPos.y += (mouse.y - haloPos.y) * haloLerp;

      if (Math.hypot(mouse.x - haloPos.x, mouse.y - haloPos.y) < 0.75) {
        haloPos.x = mouse.x;
        haloPos.y = mouse.y;
      }

      halo.style.left = `${haloPos.x}px`;
      halo.style.top = `${haloPos.y}px`;

      const dx = mouse.x - haloPos.x;
      const dy = mouse.y - haloPos.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 2.5) {
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(haloPos.x, haloPos.y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(dist / 95, 0.28)})`;
        ctx.lineWidth = 0.85;
        ctx.stroke();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.018;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 240, 255, ${p.alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(animateCursor);
    }

    animateCursor();
  })();
</script>


<script>
    (function initMorphingZoomOrb() {
    const slider = document.getElementById('scale-slider');
    const channel = document.getElementById('zoom-orb-channel');
    const canvas = document.getElementById('zoom-trail-canvas');
    const orb = document.getElementById('zoom-morph-orb');
    const anchorLeft = document.getElementById('zoom-anchor-left');
    const anchorRight = document.getElementById('zoom-anchor-right');
    const rippleLeft = document.getElementById('zoom-ripple-left');
    const rippleRight = document.getElementById('zoom-ripple-right');

    const cursorDot = document.getElementById('nova-cursor-dot');
    const cursorHalo = document.getElementById('nova-cursor-halo');

    if (!slider || !channel || !canvas || !orb) return;
    const ctx = canvas.getContext('2d');

    let cw = 144, ch = 32;
    const canvasPadX = 18;
    function resizeTrailCanvas() {
      const rect = channel.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        const dpr = window.devicePixelRatio || 1;
        cw = rect.width;
        ch = rect.height;
        canvas.width = (cw + canvasPadX * 2) * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, canvasPadX * dpr, 0);
      }
    }
    resizeTrailCanvas();
    window.addEventListener('resize', resizeTrailCanvas);

    // Track pointer position & drag state for Cursor-to-Orb Magnetic Morphing
    let pointerX = -999, pointerY = -999;
    let isPointerInChannel = false;
    let isDraggingOrb = false;

    window.addEventListener('pointermove', (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
    });
    channel.addEventListener('pointerenter', () => { isPointerInChannel = true; });
    channel.addEventListener('pointerleave', () => { isPointerInChannel = false; });
    slider.addEventListener('pointerdown', () => {
      isDraggingOrb = true;
      document.body.classList.add('nova-orb-locked');
    });
    window.addEventListener('pointerup', () => {
      if (isDraggingOrb) {
        isDraggingOrb = false;
        document.body.classList.remove('nova-orb-locked');
      }
    });

    function getNormalizedSlider() {
      const v = parseFloat(slider.value) || 3.70;
      return Math.max(0, Math.min(1, (v - 1.0) / 3.0));
    }

    let displayNorm = getNormalizedSlider();
    let lastX = null;
    let dockedState = null;
    const trailNodes = [];

    function triggerEclipseRipple(side) {
      const el = side === 'left' ? rippleLeft : rippleRight;
      if (!el) return;
      el.classList.remove('eclipse-ripple-active');
      void el.offsetWidth;
      el.classList.add('eclipse-ripple-active');
    }

    function updateMorphingOrbFrame() {
      if (cw <= 0) resizeTrailCanvas();
      const targetNorm = getNormalizedSlider();

      // Responsive interpolation for both mouse drag and two-finger trackpad swipe
      displayNorm += (targetNorm - displayNorm) * 0.28;
      if (Math.abs(targetNorm - displayNorm) < 0.0002) {
        displayNorm = targetNorm;
      }

      const minX = 5;
      const maxX = Math.max(20, cw - 7);
      const x = minX + displayNorm * (maxX - minX);
      const y = ch / 2;

      // Two-stage diameter curve: stays compact (4.5px -> 7.4px) across 0%..90% of the slider so it is unmistakably smaller than the 12px right circle, then smoothly expands to 12.0px at 100% full zoom
      const baseGrowth = displayNorm * 3.1; // +3.1px linear growth
      const finalDockGrowth = Math.pow(displayNorm, 6.0) * 4.4; // +4.4px only near the very end (92%..100%)
      const diameter = 4.5 + baseGrowth + finalDockGrowth;
      const radius = diameter / 2;

      orb.style.boxSizing = 'border-box';
      orb.style.left = `${x}px`;
      orb.style.width = `${diameter.toFixed(2)}px`;
      orb.style.height = `${diameter.toFixed(2)}px`;

      const fillAlpha = 0.92 - Math.pow(displayNorm, 2.0) * 0.32;
      const glowSpread = 3.0 + Math.pow(displayNorm, 3.0) * 5.0;
      orb.style.background = `rgba(103, 232, 249, ${fillAlpha.toFixed(2)})`;
      orb.style.border = '1px solid rgba(224, 242, 254, 0.9)';
      orb.style.boxShadow = `0 0 ${glowSpread.toFixed(1)}px rgba(34, 211, 238, ${(0.5 + displayNorm * 0.3).toFixed(2)})`;

      // Check if cursor is directly over the active orb, left anchor, or right anchor, or actively dragging
      const rect = channel.getBoundingClientRect();
      const orbScreenX = rect.left + x;
      const orbScreenY = rect.top + y;
      const leftAnchorScreenX = rect.left + minX;
      const rightAnchorScreenX = rect.left + maxX;

      const distToOrb = Math.hypot(pointerX - orbScreenX, pointerY - orbScreenY);
      const distToLeft = Math.hypot(pointerX - leftAnchorScreenX, pointerY - orbScreenY);
      const distToRight = Math.hypot(pointerX - rightAnchorScreenX, pointerY - orbScreenY);

      if (cursorDot && cursorHalo) {
        if (isDraggingOrb || (isPointerInChannel && distToOrb <= 14)) {
          // Lock & morph cursor circle to match the moving zoom orb's exact size and position
          cursorDot.style.left = `${orbScreenX}px`;
          cursorDot.style.top = `${orbScreenY}px`;
          cursorDot.style.width = `${diameter}px`;
          cursorDot.style.height = `${diameter}px`;
          cursorDot.style.backgroundColor = 'rgba(165, 243, 252, 0.98)';
          cursorDot.style.boxShadow = `0 0 ${glowSpread + 4}px 2px rgba(34, 211, 238, 0.95)`;
          cursorHalo.style.width = `${diameter + 6}px`;
          cursorHalo.style.height = `${diameter + 6}px`;
          cursorHalo.style.opacity = '0.35';
        } else if (isPointerInChannel && distToLeft <= 10) {
          // Match left small anchor circle (6px) when hovering directly over it
          cursorDot.style.left = `${leftAnchorScreenX}px`;
          cursorDot.style.top = `${orbScreenY}px`;
          cursorDot.style.width = '6px';
          cursorDot.style.height = '6px';
          cursorHalo.style.width = '14px';
          cursorHalo.style.height = '14px';
          cursorHalo.style.opacity = '0.4';
        } else if (isPointerInChannel && distToRight <= 12) {
          // Match right larger anchor circle (10px) when hovering directly over it
          cursorDot.style.left = `${rightAnchorScreenX}px`;
          cursorDot.style.top = `${orbScreenY}px`;

      if (anchorLeft) {

      }
      if (anchorRight) {
        anchorRight.style.opacity = displayNorm > 0.94 ? '0.95' : '0.48';
        anchorRight.style.borderColor = displayNorm > 0.94 ? 'rgba(165, 243, 252, 0.95)' : 'rgba(103, 232, 249, 0.5)';

      } else if (displayNorm >= 0.982 && dockedState !== 'right') {
        dockedState = 'right';

      if (lastX !== null) {
        const dx = x - lastX;
        const absDx = Math.abs(dx);
        if (absDx > 0.025) {
          // Sub-stepping every 1.1px guarantees a smooth, unbroken ribbon trail
          const steps = Math.min(14, Math.max(1, Math.ceil(absDx / 1.1)));
          for (let s = 1; s <= steps; s++) {
            const interpX = lastX + (dx * s) / steps;
            trailNodes.push({
              x: interpX,
              y: y,
              r: radius * 0.95,
              alpha: Math.min(0.62, 0.28 + absDx * 0.065)
            });
          }

      ctx.clearRect(-canvasPadX, 0, cw + canvasPadX * 2, ch);
      for (let i = trailNodes.length - 1; i >= 0; i--) {

        if (pt.alpha <= 0.004) {
          trailNodes.splice(i, 1);
          continue;

        const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.r * 2.1);
        grad.addColorStop(0, `rgba(165, 243, 252, ${pt.alpha})`);
        grad.addColorStop(0.45, `rgba(34, 211, 238, ${pt.alpha * 0.65})`);
        grad.addColorStop(1, 'rgba(34, 211, 238, 0)');
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r * 2.1, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }

      requestAnimationFrame(updateMorphingOrbFrame);
    }

    requestAnimationFrame(updateMorphingOrbFrame);
  })();

  (function initBulletproofPhysics() {
    const hud = document.getElementById("bottom-hud") || document.querySelector("nav") || document.getElementById("hud-bar");
    let isHoveringBottom = false;

    // 1. Create the cyan line dock zone dynamically
    let dockZone = document.getElementById("nova-tour-dock");

        dockZone.id = "nova-tour-dock";
        dockZone.innerHTML = '<div class="cyan-line"></div>';
        document.body.appendChild(dockZone);

        isHoveringBottom = e.clientY > window.innerHeight - 120;

    setInterval(() => {
        if (!hud) return;
        
        // Detect Guided Tour by finding any pagination format like "18/47" or "2 / 39"

        const isTourActive = /\b\d+\s*\/\s*[34][0-9]\b/.test(pageText) || pageText.includes("Gravity-dominated");

            dockZone.classList.add("active");
        } else {
            hud.classList.remove("nova-hud-docked");
            dockZone.classList.remove("active");
        }
