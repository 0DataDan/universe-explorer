    // === COSMIC PERSPECTIVE & DEPTH SHELL RESCALER ===
    function applyCosmicDepthProportions(item) {
      if (!item || !item.position || item.position.length < 3) return;
      const id = (item.id || '').toLowerCase();
      const type = (item.type || '').toLowerCase();
      const tier = item.tier || 1;

      // Keep Solar System (Tier 1: Sun, Planets, Moons, Asteroid Belt) untouched at the core
      const solarSystemIds = [
        'sun', 'sol', 'mercury', 'venus', 'earth', 'moon', 'mars',
        'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'ceres', 'halley'
      ];
      if (tier === 1 || solarSystemIds.includes(id) || type.includes('planet') || type === 'moon') {
        return;
      }

      let x = item.position[0], y = item.position[1], z = item.position[2];
      let currentDist = Math.sqrt(x * x + y * y + z * z);
      if (currentDist < 0.001) currentDist = 1.0;

      // Unit direction vector from Sol Core (0,0,0)
      const ux = x / currentDist;
      const uy = y / currentDist;
      const uz = z / currentDist;

      // Assign target radial distance shell based on astrophysical category/tier
      let targetDist = currentDist;
      if (['el-gordo', 'shapley-supercluster', 'great-attractor', 'smacs-0723', 'gn-z11', 'ton-618', 'bootes-void'].includes(id) || tier === 4) {
        // Tier 4: Deep Cosmological Web & Quasars (950 - 1,650 units out)
        targetDist = 950 + (currentDist * 4.5);
      } else if (['andromeda', 'sombrero-galaxy', 'centaurus-a', 'messier-87', 'lmc', 'smc', 'triangulum'].includes(id) || type.includes('galaxy') || tier === 3) {
        // Tier 3: Galaxies & Local Group (450 - 820 units out)
        targetDist = 450 + (currentDist * 3.2);
      } else if (['eagle-nebula', 'crab-nebula', 'orion-nebula', 'pillars-of-creation'].includes(id) || type.includes('nebula')) {
        // Tier 2B: Galactic Nebulae & Supernova Remnants (220 - 380 units out)
        targetDist = 220 + (currentDist * 2.2);
      } else {
        // Tier 2A: Stellar Neighbors, Pulsars, Stellar Black Holes (120 - 210 units out)
        targetDist = 120 + (currentDist * 1.6);
      }

      // Add vertical (Y-axis) 3D dispersion so objects don't sit on a flat pancake plane
      const hash = id.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      const verticalSpread = Math.sin(hash * 1.37) * 0.38;
      const ny = uy + verticalSpread;
      const norm = Math.sqrt(ux * ux + ny * ny + uz * uz) || 1.0;

      item.position[0] = (ux / norm) * targetDist;
      item.position[1] = (ny / norm) * targetDist;
      item.position[2] = (uz / norm) * targetDist;
    }

    
    // === REAL-TIME ANIMATED SOLAR PHOTOSPHERE, GRANULATION & LIMB SPICULE SHADER ===
    window.sunShaderUniforms = {
      uTime: { value: 0.0 }
    };

    function createAnimatedSunMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: window.sunShaderUniforms,
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;
          uniform float uTime;

          float hash31(vec3 p) {
            p = fract(p * 0.1031);
            p += dot(p, p.yzx + 33.33);
            return fract((p.x + p.y) * p.z);
          }
          float vNoise(vec3 x) {
            vec3 i = floor(x);
            vec3 f = fract(x);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(mix(hash31(i + vec3(0,0,0)), hash31(i + vec3(1,0,0)), f.x),
                  mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
              mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
                  mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z
            );
          }

          void main() {
            vNormal = normalize(normal);
            vPosition = normalize(position);

            // Subtle limb-visible photospheric plasma boiling undulation
            float boil = vNoise(vPosition * 18.0 + vec3(uTime * 0.85, -uTime * 0.65, uTime * 0.75)) * 0.65
                       + vNoise(vPosition * 36.0 - vec3(uTime * 1.35, uTime * 1.1, -uTime * 0.95)) * 0.35;
            vec3 displaced = position + normal * ((boil - 0.5) * 0.032);

            vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            vViewDir = normalize(cameraPosition - worldPos.xyz);

            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;
          uniform float uTime;

          float hash(vec3 p) {
            p = fract(p * vec3(443.897, 441.423, 437.195));
            p += dot(p, p.yzx + 19.19);
            return fract((p.x + p.y) * p.z);
          }

          float noise3D(vec3 p) {
            vec3 i = floor(p);
            vec3 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                  mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
              mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                  mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z
            );
          }

          // Multi-octave fBm plasma turbulence
          float fbm(vec3 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
              v += a * noise3D(p);
              p = p * 2.08 + vec3(13.7, -9.2, 17.4);
              a *= 0.5;
            }
            return v;
          }

          // Sharp cellular ridge noise for bubbling Bénard solar convection cells
          // (bright hot upwelling granule centers + dark cooled intergranular downflow lanes)
          float granulationCells(vec3 p) {
            float n1 = 1.0 - abs(noise3D(p) * 2.0 - 1.0);
            float n2 = 1.0 - abs(noise3D(p * 2.12 + vec3(7.3, -4.1, 11.8)) * 2.0 - 1.0);
            float n3 = 1.0 - abs(noise3D(p * 4.25 - vec3(3.7, 9.4, -6.2)) * 2.0 - 1.0);
            return pow(n1 * 0.52 + n2 * 0.33 + n3 * 0.15, 1.45);
          }

          void main() {
            // Noticeable, organic convective churning speed
            float t = uTime * 0.72;
            vec3 p = normalize(vPosition);

            // 3D fluid domain-warping so plasma filaments & convection cells swirl and evolve continuously
            vec3 warp = vec3(
              fbm(p * 5.0 + vec3(t * 0.55, -t * 0.42, t * 0.25)),
              fbm(p * 5.0 + vec3(-t * 0.48, t * 0.52, 8.3 - t * 0.3)),
              fbm(p * 5.0 + vec3(4.1 + t * 0.35, -t * 0.5, t * 0.45))
            );

            // Multi-scale solar granulation (fine granules + mesogranulation + supergranulation)
            float fineCells = granulationCells(p * 28.0 + warp * 2.8 + vec3(t * 1.15, -t * 0.95, t * 1.05));
            float medCells  = granulationCells(p * 13.0 + warp * 2.0 - vec3(t * 0.75, t * 0.65, -t * 0.8));
            float macroFlow = fbm(p * 4.2 + warp * 1.1 + vec3(0.0, t * 0.3, 0.0));

            // Realistic Sunspot Active Belts (+/- 12° to 28° solar latitude)
            float latBelt = exp(-pow((abs(p.y) - 0.26) * 4.5, 2.0));
            float activeField = fbm(p * 6.0 + warp * 0.55 + vec3(t * 0.16, 0.0, -t * 0.14));
            float spotMetric = activeField * (0.68 + 0.42 * latBelt);
            float umbra    = smoothstep(0.67, 0.77, spotMetric);
            float penumbra = smoothstep(0.56, 0.68, spotMetric);

            // Bright white-hot magnetic faculae / plage filaments threading around active regions
            float filamentNoise = granulationCells(p * 34.0 - warp * 3.2 + vec3(t * 1.4));
            float faculae = smoothstep(0.47, 0.60, spotMetric) * (1.0 - penumbra) * pow(filamentNoise, 0.85);

            // Combine photospheric thermal intensity
            float heat = fineCells * 0.50 + medCells * 0.32 + macroFlow * 0.18;
            heat = pow(clamp(heat, 0.0, 1.0), 0.92);
            heat += faculae * 0.48;
            heat -= penumbra * 0.42;
            heat -= umbra * 0.58;
            heat = clamp(heat, 0.0, 1.35);

            // Physical Eddington Limb Darkening + Fiery Chromospheric Spicule Rim (matching reference video)
            float mu = clamp(dot(normalize(vWorldNormal), normalize(vViewDir)), 0.0, 1.0);
            float limbDarkening = pow(mu, 0.48);
            float rimFactor = pow(1.0 - mu, 2.35);

            // Dynamic flickering plasma spicules & micro-prominences along the solar limb
            float spiculeWave = granulationCells(p * 38.0 + vec3(uTime * 1.9, -uTime * 1.6, uTime * 1.7));
            float rimSpicules = rimFactor * (0.6 + 0.95 * spiculeWave);

            // High-dynamic-range SDO / Photosphere / Chromosphere palette
            vec3 colUmbra    = vec3(0.12, 0.015, 0.002); // Dark magnetic sunspot core
            vec3 colDarkLane = vec3(0.72, 0.16, 0.01);   // Deep crimson-orange intergranular downflow lanes
            vec3 colPhoto    = vec3(0.98, 0.52, 0.05);   // Rich solar amber-orange photosphere
            vec3 colGranule  = vec3(1.00, 0.84, 0.32);   // Bright golden-yellow upwelling granule tops
            vec3 colFaculae  = vec3(1.00, 0.98, 0.88);   // Incandescent white-hot magnetic faculae/plages
            vec3 colChromo   = vec3(1.00, 0.26, 0.02);   // Fiery chromospheric rim

            vec3 baseColor;
            if (heat < 0.25) {
              baseColor = mix(colUmbra, colDarkLane, heat / 0.25);
            } else if (heat < 0.56) {
              baseColor = mix(colDarkLane, colPhoto, (heat - 0.25) / 0.31);
            } else if (heat < 0.84) {
              baseColor = mix(colPhoto, colGranule, (heat - 0.56) / 0.28);
            } else {
              baseColor = mix(colGranule, colFaculae, clamp((heat - 0.84) / 0.38, 0.0, 1.0));
            }

            // Apply realistic limb darkening toward the edges while keeping magnetic faculae bright near the limb
            vec3 limbTinted = mix(colChromo * 0.82, baseColor, 0.28 + 0.72 * limbDarkening);
            vec3 finalColor = limbTinted
                            + colChromo * rimSpicules * 0.65
                            + colFaculae * (faculae * (1.0 - mu * 0.6) * 0.52);

            gl_FragColor = vec4(finalColor, 1.0);
          }
        `
      });
    }

        fragmentShader: `
          varying vec3 vPos;

          varying vec3 vViewDir;

            float spicule2 = 1.0 - abs(noise3D(vPos * 46.0 - vec3(uTime * 2.1, uTime * 1.7, -uTime * 1.5)) * 2.0 - 1.0);
            float prominence = pow(spicule1 * 0.6 + spicule2 * 0.4, 1.4);
            float alpha = rim * (0.32 + 0.65 * prominence);
            vec3 col = mix(vec3(1.0, 0.24, 0.02), vec3(1.0, 0.85, 0.35), prominence);

      const coronaMesh = new THREE.Mesh(coronaGeo, coronaMat);

    function applyCharacteristicTexturesToScene() {
      ensurePhotorealisticLighting();
      let texturedCount = 0;

      scene.traverse((obj) => {
        if (!obj.isMesh || !obj.geometry || !obj.material) return;
        if (obj.geometry.type === 'RingGeometry' || obj.geometry.type === 'TorusGeometry' || obj.geometry.type === 'ConeGeometry') return;

        const meta = (obj.userData && obj.userData.name) ? obj.userData :
                     (obj.parent && obj.parent.userData && obj.parent.userData.name) ? obj.parent.userData : null;
        if (!meta || !meta.name) return;

        if (obj.material.wireframe) return;
        if (['sagittarius-a-star', 'ton-618', 'andromeda', 'triangulum', 'sombrero-galaxy', 'messier-87', 'bootes-void', 'el-gordo', 'centaurus-a', 'crab-nebula', 'eagle-nebula', 'orion-nebula', 'lmc', 'smc', 'great-attractor', 'shapley-supercluster', 'smacs-0723', 'gn-z11'].includes(meta.id)) return;
        if (obj.material.transparent && obj.material.opacity < 0.75) return;

        const kind = classifyMeshTextureKind(meta.name, meta.type);
        if (!kind) return;

        const procTex = buildNASACanvasTexture(kind);
        const bumpTex = nasaBumpCache[kind];
        const isSelfLuminous = (kind === 'sun' || kind.startsWith('star-') || kind === 'stephenson' || kind.startsWith('nebula-') || kind.startsWith('galaxy-'));

        if (kind === 'sun') {
              obj.material = createAnimatedSunMaterial();
              if (!obj.getObjectByName("sun-chromosphere-spicules")) {
                obj.add(createAnimatedCoronaLayer((meta && meta.size) ? meta.size : 2.5));
              }
            } else if (isSelfLuminous) {
              obj.material = new THREE.MeshStandardMaterial({
                map: procTex,
                emissiveMap: procTex,
                emissive: new THREE.Color(0xffffff),
                emissiveIntensity: 1.15,
                roughness: 0.9,
                metalness: 0.0
              });
        } else {
          const isOceanWorld = (kind === 'earth');
          const isGasGiant = (kind === 'jupiter' || kind === 'saturn' || kind === 'uranus' || kind === 'neptune' || kind === 'venus');
          const isOumuamua = (kind === 'oumuamua');
          obj.material = new THREE.MeshStandardMaterial({
            map: procTex,
            bumpMap: bumpTex || null,
            bumpScale: isGasGiant ? 0.012 : isOceanWorld ? 0.035 : isOumuamua ? 0.115 : 0.065,
            roughness: isOceanWorld ? 0.42 : isGasGiant ? 0.68 : isOumuamua ? 0.76 : 0.88,
            metalness: isOceanWorld ? 0.12 : isOumuamua ? 0.08 : 0.04,
            emissiveMap: procTex,
            emissive: new THREE.Color(0xffffff),
            emissiveIntensity: isOumuamua ? 0.26 : 0.12
          });
        }
        obj.material.needsUpdate = true;
        obj.userData._nasaTextured = true;
        texturedCount++;
      });
      console.log(`[NOVA] Applied 3D fBm & PBR materials to ${texturedCount} celestial bodies.`);
      buildVolumetricCelestialStructures();
    }

    function animate(time = performance.now()) {
      requestAnimationFrame(animate);
      TWEEN.update(time);

      const timeSec = time * 0.001;
      if (window.sunShaderUniforms) {
        window.sunShaderUniforms.uTime.value = timeSec;
      }
      if (sunMeshRef && (!sunMeshRef.material || sunMeshRef.material.type !== 'ShaderMaterial') && typeof createAnimatedSunMaterial === 'function') {
        sunMeshRef.material = createAnimatedSunMaterial();
        if (!sunMeshRef.getObjectByName("sun-chromosphere-spicules")) {
          sunMeshRef.add(createAnimatedCoronaLayer((sunMeshRef.userData && sunMeshRef.userData.size) ? sunMeshRef.userData.size : 2.5));

      }
      const camDist = camera.position.distanceTo(controls.target);
      updateAdaptiveScale(camDist);

      if (celestialSkyboxGroup) {
        celestialSkyboxGroup.position.copy(camera.position);
      }

      rotatableObjects.forEach(obj => {
        obj.rotation.y += (obj === sunMeshRef) ? 0.0006 : 0.003;
      });

      if (crabPulsarBeams) {
        crabPulsarBeams.rotation.y += 0.045;
      }

      if (!isOrbitPaused) {
        orbitingPlanets.forEach(p => {
          p.angle -= p.speed;
          p.mesh.position.x = Math.cos(p.angle) * p.radius;
          p.mesh.position.z = Math.sin(p.angle) * p.radius;
        });

        if (ton618AccretionDisk) {
          ton618AccretionDisk.rotation.z += 0.015;
        }
        ton618PlasmaFlares.forEach(flare => {
          flare.angle += flare.speed;
          flare.mesh.position.set(
            Math.cos(flare.angle) * flare.radius,
            -Math.sin(flare.angle) * flare.radius * 0.203,
            Math.sin(flare.angle) * flare.radius * 0.979
          );
        });

        if (sagAAccretionDisk) {
          sagAAccretionDisk.rotation.z += 0.012;
        }
        sagAPlasmaFlares.forEach(flare => {
          flare.angle += flare.speed;
          flare.mesh.position.set(
            Math.cos(flare.angle) * flare.angle * 0 + Math.cos(flare.angle) * flare.radius,
            -Math.sin(flare.angle) * flare.radius * 0.203,
            Math.sin(flare.angle) * flare.radius * 0.979
          );
        });

        if (siriusAMesh && siriusBMesh) {
          siriusBinaryAngle += 0.007;
          const sepA = 2.4;
          const sepB = 7.6;
          siriusAMesh.position.set(
            -Math.cos(siriusBinaryAngle) * sepA,
            Math.sin(siriusBinaryAngle) * (sepA * 0.3),
            -Math.sin(siriusBinaryAngle) * (sepA * 0.6)
          );
          siriusBMesh.position.set(
            Math.cos(siriusBinaryAngle) * sepB,
            -Math.sin(siriusBinaryAngle) * (sepB * 0.3),
            Math.sin(siriusBinaryAngle) * (sepB * 0.6)
          );
        }

        if (alphaCenAMesh && alphaCenBMesh && proximaMesh) {
          alphaCenBinaryAngle += 0.005;
          const rA = 1.8;
          const rB = 2.4;
          alphaCenAMesh.position.set(
            -Math.cos(alphaCenBinaryAngle) * rA,
            Math.sin(alphaCenBinaryAngle) * (rA * 0.25),
            -Math.sin(alphaCenBinaryAngle) * rA
          );
          alphaCenBMesh.position.set(
            Math.cos(alphaCenBinaryAngle) * rB,
            -Math.sin(alphaCenBinaryAngle) * (rB * 0.25),
            Math.sin(alphaCenBinaryAngle) * rB
          );

          proximaOrbitAngle -= 0.0008;
          proximaMesh.position.set(
            Math.cos(proximaOrbitAngle) * 16.5,
            Math.sin(proximaOrbitAngle) * 2.8,
            Math.sin(proximaOrbitAngle) * 14.5
          );
        }

        cenAPlasmaKnots.forEach(knot => {
          knot.progress = (knot.progress + knot.speed) % 1.0;
          const currentY = knot.progress * knot.maxDist * (knot.isTop ? 1 : -1);
          knot.mesh.position.set(0, currentY, 0);
          knot.mesh.scale.setScalar(0.7 + knot.progress * 0.9);
        });

        if (andromedaGroup) {
          andromedaApproachDistance = (andromedaApproachDistance + 0.004) % 35.0;
          andromedaGroup.position.copy(andromedaBasePos).addScaledVector(andromedaApproachDir, andromedaApproachDistance);
          andromedaGroup.rotation.y += 0.0008;
        }

        if (halleyOrbitObj) {
          const distToSol = Math.max(2.0, halleyOrbitObj.mesh.position.length());
          const keplerSpeed = 0.05 / Math.pow(distToSol, 0.75);
          halleyOrbitObj.angle += keplerSpeed;

          const hx = halleyOrbitObj.cx + Math.cos(halleyOrbitObj.angle) * halleyOrbitObj.a;
          const hz = Math.sin(halleyOrbitObj.angle) * halleyOrbitObj.b;
          halleyOrbitObj.mesh.position.set(hx, hz * 0.35, hz);
        }

        if (oumuamuaOrbitObj) {
          oumuamuaOrbitObj.t += oumuamuaOrbitObj.speed;
          if (oumuamuaOrbitObj.t > 2.2) oumuamuaOrbitObj.t = -2.2;

          const pos = getOumuamuaPosition(oumuamuaOrbitObj.t);
          oumuamuaOrbitObj.mesh.position.copy(pos);
          // Realistic non-principal-axis tumbling motion that showcases both the elongated shard profile and scalloped dorsal crater
          oumuamuaOrbitObj.mesh.rotation.y += 0.006;
          oumuamuaOrbitObj.mesh.rotation.x = 0.28 + 0.22 * Math.sin(timeSec * 0.55);
          oumuamuaOrbitObj.mesh.rotation.z = -0.14 + 0.18 * Math.cos(timeSec * 0.38);
        }
      }

if (isCosmicWebVisible && window._cosmicMaterials) {
        const t = performance.now() * 0.001;
        // Gentle breathing factor (narrower amplitude so peak and trough stay balanced)
        const pulseFactor = 0.72 + 0.10 * Math.sin(t * 0.8) + 0.05 * Math.sin(t * 2.0);
        // Smooth distance attenuation across the expanded Observable Universe scale,
        // keeping filaments clearly visible (50% floor) at full horizon zoom-out
        const zoomNorm = Math.max(0.0, Math.min(1.0, (camDist - 350.0) / 16000.0));
        const distAtten = 1.0 - 0.50 * zoomNorm;
        const webScale = pulseFactor * distAtten;

        window._cosmicMaterials.core.opacity = 0.22 * webScale;
        window._cosmicMaterials.outer.opacity = 0.13 * webScale;
        window._cosmicMaterials.branch.opacity = 0.085 * webScale;

        filamentFlowParticles.forEach(item => {
          item.progress = (item.progress + item.speed) % 1.0;
          const pt = item.curve.getPoint(item.progress);
          item.mesh.position.set(pt.x, pt.y, pt.z);
          
          // --- Sync electrical pulse opacity with the toned-down breathing web ---
          if (item.sparkMat) item.sparkMat.opacity = 0.15 * webScale;
          if (item.haloMat) item.haloMat.opacity = 0.075 * webScale;
          // -----------------------------------------------------------

          if (item.progress < 0.99) {
            const lookPt = item.curve.getPoint(item.progress + 0.01);
            item.mesh.lookAt(lookPt);
          }
        });
      }

      if (asteroidBelt) asteroidBelt.rotation.y += 0.001;
      if (oortCloudGroup) oortCloudGroup.rotation.y += 0.0002;
      if (milkyWayGroup) milkyWayGroup.rotation.y += 0.0006;
      if (triangulumGroup) triangulumGroup.rotation.y += 0.0007;

      if (cmbSphere) {
        cmbSphere.rotation.y += 0.00015;
        updateCMBThermalAcoustics(timeSec);
      }

      const eMesh = window.earthMeshRef || earthMeshRef;
      const mMesh = window.moonMeshRef || moonMeshRef;
      if (eMesh && mMesh) {
        if (!isOrbitPaused) {
          moonOrbitAngle -= 0.025;
        }
        const orbitRadius = 1.65;
        mMesh.position.set(
          eMesh.position.x + Math.cos(moonOrbitAngle) * orbitRadius,
          eMesh.position.y + Math.sin(moonOrbitAngle) * 0.18,
          eMesh.position.z + Math.sin(moonOrbitAngle) * orbitRadius
        );
        mMesh.rotation.y += 0.015;
        mMesh.visible = eMesh.visible;
        if (moonOrbitRingRef) {
          moonOrbitRingRef.position.copy(eMesh.position);
          moonOrbitRingRef.visible = eMesh.visible;
        }
      }

      if (activeTargetMesh && !isFlyingToTarget) {
        const currentWorldPos = new THREE.Vector3();
        activeTargetMesh.getWorldPosition(currentWorldPos);
        if (lastTrackedTargetPos.lengthSq() > 0) {
          const deltaMove = currentWorldPos.clone().sub(lastTrackedTargetPos);
          if (deltaMove.lengthSq() > 0 && deltaMove.lengthSq() < 100) {
            camera.position.add(deltaMove);
            controls.target.add(deltaMove);
          }
        }
        lastTrackedTargetPos.copy(currentWorldPos);
      }

      controls.update();
      updateCelestialLabels(camDist);
      if (!window._texturesInitialized && celestialObjects.length > 5) {
        applyCharacteristicTexturesToScene();
        window._texturesInitialized = true;
      }

      renderer.render(scene, camera);
    }

    // === STREAMLINED SIDEBAR-INTEGRATED GUIDED COSMIC TOUR ENGINE ===
    let isTourActive = false;
    let isTourPaused = false;
    let tourPlaylist = [];

    let tourTimer = null;

    let tourStepStartTime = 0;
    let tourStepDuration = 16000;

    const TIER_LABELS = {
      1: "",
      2: "",
      3: "",
      4: ""
    };

    // Explicit Solar System heliocentric order so Earth -> Moon -> Mars -> Ceres -> Jupiter is always natural
    const TIER_1_ORDER = [
      "sun", "mercury", "venus", "earth", "moon", "mars",
      "ceres", "jupiter", "saturn", "uranus", "neptune",
      "halley-comet", "oumuamua", "sedna"
    ];

    function buildCosmicTourPlaylist() {
      const list = [];
      for (let t = 1; t <= 4; t++) {
        const intro = TIER_INTROS[t];
        const tierMeshes = celestialObjects.filter(m => m && m.userData && Number(m.userData.tier) === t);

        tierMeshes.sort((a, b) => {
          if (t === 1) {
            const idxA = TIER_1_ORDER.indexOf(a.userData.id);
            const idxB = TIER_1_ORDER.indexOf(b.userData.id);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          }
          const posA = new THREE.Vector3();
          const posB = new THREE.Vector3();
          a.getWorldPosition(posA);
          b.getWorldPosition(posB);
          return posA.length() - posB.length();
        });

        list.push({
          kind: "tier-intro",
          tier: t,
          badge: "",
          data: intro,
          camPos: intro.camPos,
          targetPos: intro.targetPos,
          dwellMs: Math.max(intro.dwellMs || 0, 22000) // Ensures intros get at least 22 seconds
        });

        tierMeshes.forEach((mesh, idx) => {
          const d = mesh.userData;
          list.push({
            kind: "object",
            tier: t,
            mesh: mesh,
            data: d,
            badge: TIER_LABELS[t],
            dwellMs: 19000
          });
        });
      }
      return list;
    }

    function clearTourTimers() {
      if (tourTimer) {
        clearTimeout(tourTimer);
        tourTimer = null;
      }
      if (tourProgressInterval) {
        clearInterval(tourProgressInterval);
        tourProgressInterval = null;
      }
    }

    function scheduleNextTourStep(dwellMs) {
      clearTourTimers();
      tourStepDuration = dwellMs;
      tourStepStartTime = performance.now();
      const bar = document.getElementById("tour-progress-bar");
      if (bar) bar.style.width = "0%";

      tourProgressInterval = setInterval(() => {
        if (!isTourActive || isTourPaused) return;
        const elapsed = performance.now() - tourStepStartTime;
        const pct = Math.min(100, (elapsed / tourStepDuration) * 100);
        if (bar) bar.style.width = `${pct}%`;
      }, 80);

      tourTimer = setTimeout(() => {
        if (!isTourActive || isTourPaused) return;
        tourIndex++;
        if (tourIndex >= tourPlaylist.length) {
          window.stopCosmicTour();
          resetToSolCore();
        } else {
          executeTourStep();
        }
      }, dwellMs);
    }

    let isTourVoiceMuted = false;
    let currentTourAudio = null;
    const preloadedAudioUrls = new Map();

    function cleanNarrationText(rawText) {
      if (!rawText) return "";
      return rawText
        .replace(/\^\d+/g, "")
        .replace(/\*/g, "")
        .replace(/’/g, "'")
        .trim();
    }

    function formatSpokenTitle(rawTitle) {
      if (!rawTitle) return "";
      // Convert "Name (Alternate)" -> "Name, also known as Alternate"
      return rawTitle.replace(/\s*\(([^)]+)\)/g, ", also known as $1");
    }

    function getStepNarrationText(step) {
      if (!step || !step.data) return "";
      const rawPrefix = step.kind === "tier-intro" ? step.data.title : step.data.name;
      const spokenPrefix = step.kind === "tier-intro" ? rawPrefix : formatSpokenTitle(rawPrefix);
      return cleanNarrationText(`${spokenPrefix}. ${step.data.summary}`);
    }

    function preloadTourStepAudio(stepIndex) {
      if (!tourPlaylist || tourPlaylist.length === 0) return;
      const idx = (stepIndex + tourPlaylist.length) % tourPlaylist.length;
      const text = getStepNarrationText(tourPlaylist[idx]);
      if (!text || preloadedAudioUrls.has(text)) return;
      // const url = `/api/tts?text=${encodeURIComponent(text)}`;
      // preloadedAudioUrls.set(text, url);
      // fetch(url).catch(() => {});
    }

    function stopTourAudio() {
      if (currentTourAudio) {
        currentTourAudio.onended = null;
        currentTourAudio.onerror = null;
        currentTourAudio.pause();
        currentTourAudio.currentTime = 0;
        currentTourAudio = null;
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

      // Preload next 3 stops in the background so audio is ready immediately
      if (isTourActive && tourPlaylist.length > 0) {
        preloadTourStepAudio(tourIndex + 1);
        preloadTourStepAudio(tourIndex + 2);
        preloadTourStepAudio(tourIndex + 3);
      }

      if (isTourVoiceMuted || !textToSpeak) {
        if (isTourActive && !isTourPaused) {
          scheduleNextTourStep(fallbackDwellMs);
        }
        return;
      }

      // const cleanText = cleanNarrationText(textToSpeak);
      // const url = `/api/tts?text=${encodeURIComponent(cleanText)}`;
      // const audio = new Audio(url);
      // audio.preload = "auto";
      // currentTourAudio = audio;
      if (isTourActive && !isTourPaused) {
        scheduleNextTourStep(fallbackDwellMs);
      }
      return;

      /*
      // Advance smoothly 1.8s after narration finishes
      audio.onended = () => {

      };

      // Guard: if user clicked Pause while audio was still fetching, pause immediately on play

        });
      }
      */
    }

    // Pre-warm the first 3 tour stops shortly after startup so first run has zero delay
    setTimeout(() => {
      try {
        const warmupList = buildCosmicTourPlaylist();
        [0, 1, 2].forEach(i => {
          if (warmupList[i]) {
            const prefix = warmupList[i].kind === "tier-intro" ? warmupList[i].data.title : warmupList[i].data.name;
            const txt = cleanNarrationText(`${prefix}. ${warmupList[i].data.summary}`);
            if (txt && !preloadedAudioUrls.has(txt)) {

    window.toggleTourVoice = function(e) {

        if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />';

    function executeTourStep() {
      if (!isTourActive || tourPlaylist.length === 0) return;
      clearTourTimers();

      const step = tourPlaylist[tourIndex];
      const tourCtrl = document.getElementById("sidebar-tour-controls");
      if (tourCtrl) tourCtrl.classList.remove("hidden");

      const badgeEl = document.getElementById("tour-step-badge");
      const counterEl = document.getElementById("tour-step-counter");
      if (badgeEl) badgeEl.textContent = step.badge;
      if (counterEl) counterEl.textContent = `${tourIndex + 1}/${tourPlaylist.length}`;

      if (manualTierLock !== 0) {
        filterTier(0);
      }

      if (step.tier === 4 && !isCosmicWebVisible) {
        window.toggleCosmicWeb();
      }

      if (step.kind === "tier-intro") {
        activeTargetMesh = null;
        openInspector(step.data, true);
        speakTourNarration(getStepNarrationText(step), step.dwellMs);
        TWEEN.removeAll();
        isFlyingToTarget = true;

        const startCam = camera.position.clone();
        const startTarget = controls.target.clone();
        const endCam = new THREE.Vector3(step.camPos.x, step.camPos.y, step.camPos.z);
        const endTarget = new THREE.Vector3(step.targetPos.x, step.targetPos.y, step.targetPos.z);

        const tweenObj = { t: 0 };
        new TWEEN.Tween(tweenObj)
          .to({ t: 1 }, 3200)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onUpdate(() => {
            camera.position.lerpVectors(startCam, endCam, tweenObj.t);
            controls.target.lerpVectors(startTarget, endTarget, tweenObj.t);
          })
          .onComplete(() => {
            isFlyingToTarget = false;
          })
          .start();

        // Timer synced with audio completion in speakTourNarration
      } else if (step.kind === "object" && step.mesh) {
        activeTargetMesh = step.mesh;
        openInspector(step.data, false);
        speakTourNarration(getStepNarrationText(step), step.dwellMs);
        smoothFlyToTarget(2800);

        // Timer synced with audio completion in speakTourNarration
      }
    }

    window.startCosmicTour = async function() {
      if (celestialObjects.length === 0) {
        await fetchCatalog();
      }
      tourPlaylist = buildCosmicTourPlaylist();
      if (tourPlaylist.length === 0) return;

      isTourActive = true;
      isTourPaused = false;

      // Pure monochrome starfield warp canvas (Zero color tints, pure white stars)
      function runStarfieldWarp(cx, cy, duration = 6200) {
        const canvas = document.getElementById("nova-warp-canvas");

        const ctx = canvas.getContext("2d");
        const w = (canvas.width = window.innerWidth);
        const h = (canvas.height = window.innerHeight);

        canvas.style.transition = "none";

        const numStars = 220;
        const stars = [];
        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: (Math.random() - 0.5) * w * 2.5,
            y: (Math.random() - 0.5) * h * 2.5,
            z: Math.random() * 1000 + 1,
            size: Math.random() * 0.9 + 0.4
          });
        }

        let startTime = performance.now();
        let animId = null;

        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1.0, elapsed / duration);
          const decel = Math.pow(1.0 - progress, 2.8);
          const speed = 1.5 + decel * 58;

          ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < numStars; i++) {
            const s = stars[i];
            const prevZ = s.z;
            s.z -= speed;

            if (s.z <= 1) {
              s.z = 1000;
              s.x = (Math.random() - 0.5) * w * 2.5;
              s.y = (Math.random() - 0.5) * h * 2.5;
              continue;
            }

            const k = 460 / s.z;
            const px = cx + s.x * k;
            const py = cy + s.y * k;
            const prevK = 460 / prevZ;
            const prevPx = cx + s.x * prevK;
            const prevPy = cy + s.y * prevK;

            if (px >= 0 && px <= w && py >= 0 && py <= h) {
              const starFade = progress > 0.45 ? Math.max(0, 1.0 - (progress - 0.45) / 0.45) : 1.0;
              const alpha = Math.min(0.4, (1000 - s.z) / 1000 * 0.48) * starFade;
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
              ctx.lineWidth = Math.min(1.2, s.size * (0.6 + speed / 80));
              ctx.beginPath();
              ctx.moveTo(prevPx, prevPy);
              ctx.lineTo(px, py);

        const svgEl = document.getElementById("nova-boot-svg");
        const portalO = document.getElementById("nova-portal-o");

        const pathIds = [

        ];
        const sampledPaths = [];

        pathIds.forEach(id => {
          const el = document.getElementById(id);
          if (!el || typeof el.getTotalLength !== "function") return;
          const totalLen = el.getTotalLength();
          const numPts = Math.max(64, Math.ceil(totalLen / 1.5));
          const pts = [];
          for (let i = 0; i <= numPts; i++) {
            const pt = el.getPointAtLength((i / numPts) * totalLen);

        const dotEl = document.getElementById("nova-base-a-dot");

        const zoomDuration = 2400;  // Long, silky-smooth continuous glide
        let warpStarted = false;
        let tunnelCleared = false;
        const startTime = performance.now();

        function displaceVertex(px, py, tWave) {
          const dx = px - originX;
          const dy = py - originY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const nx = dist > 0.0001 ? dx / dist : 0;
          const ny = dist > 0.0001 ? dy / dist : 0;

          const waveSpeed = 420.0;
          const waveFront = tWave * 1.5 * waveSpeed;
          const distFromFront = dist - waveFront;

          const packetWidth = 115.0;
          const env = Math.exp(-(distFromFront * distFromFront) / (2.0 * packetWidth * packetWidth));
          const timeEnvelope = Math.sin(Math.min(1.0, tWave) * Math.PI);
          const activeEnv = env * timeEnvelope;

          // Pronounced wobble / gravitational crest & trough
          const radialWave = Math.sin((distFromFront / packetWidth) * Math.PI * 2.2);
          const radialOffset = radialWave * 26.0 * activeEnv;
          const verticalOffset = Math.cos((dist * 0.024) - (tWave * 7.0)) * 22.0 * activeEnv;

          return {
            x: px + nx * radialOffset,
            y: py + ny * (radialOffset * 0.5) + verticalOffset,
            scale: 1.0 + radialWave * 0.32 * activeEnv

              let dStr = "";

                const p = displaceVertex(pts[i].x, pts[i].y, tWave);
                dStr += (i === 0 ? "M " : " L ") + p.x.toFixed(2) + " " + p.y.toFixed(2);
              }
              item.el.setAttribute("d", dStr);
            });

            if (dotEl) {
              const dp = displaceVertex(dotOrig.cx, dotOrig.cy, tWave);
              dotEl.setAttribute("cx", dp.x.toFixed(2));
              dotEl.setAttribute("cy", dp.y.toFixed(2));
              dotEl.setAttribute("r", Math.max(4.0, dotOrig.r * dp.scale).toFixed(2));
            }

          if (elapsed >= zoomDelayMs) {
            document.documentElement.classList.add("is-wormhole-zooming");
            const zoomElapsed = elapsed - zoomDelayMs;

    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Initialize cursor dead-center inside #nova-portal-o on the boot screen
    function getPortalOCenterAndRadius() {
      const portalEl = document.getElementById('nova-portal-o') || document.getElementById('nova-portal-glow');
      const bootOverlay = document.getElementById('nova-boot-overlay');
      const isBootVisible = bootOverlay && !bootOverlay.classList.contains('boot-completed') && bootOverlay.style.display !== 'none';
      if (portalEl && isBootVisible) {
        const rect = portalEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          return {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2,
            r: Math.max(rect.width, rect.height) / 2,
            active: true
          };
        }
      }
      return { x: width / 2, y: height / 2, r: 0, active: false };
    }

    const initPortal = getPortalOCenterAndRadius();
    let initialX = initPortal.x;
    let initialY = initPortal.y;

    let mouse = { x: initialX, y: initialY };
    let haloPos = { x: initialX, y: initialY };
    let hasUserMovedPointer = false;

    if (dot) { dot.style.left = `${initialX}px`; dot.style.top = `${initialY}px`; }
    if (halo) { halo.style.left = `${initialX}px`; halo.style.top = `${initialY}px`; }
    if (initPortal.active) {
      document.body.classList.add('nova-portal-o-active');
      document.body.classList.remove('nova-cursor-hover');
    }

    // Re-sync exact center across layout/font/SVG settle frames until the user moves the mouse
    function syncInitialPortalCenter() {
      if (hasUserMovedPointer) return;
      const p = getPortalOCenterAndRadius();
      if (p.active) {
        mouse.x = haloPos.x = p.x;
        mouse.y = haloPos.y = p.y;
        if (dot) { dot.style.left = `${p.x}px`; dot.style.top = `${p.y}px`; }
        if (halo) { halo.style.left = `${p.x}px`; halo.style.top = `${p.y}px`; }
        document.body.classList.add('nova-portal-o-active');
      document.body.classList.remove('nova-cursor-hover');
      }
    }
    requestAnimationFrame(syncInitialPortalCenter);
    setTimeout(syncInitialPortalCenter, 60);
    setTimeout(syncInitialPortalCenter, 200);
    window.addEventListener('resize', syncInitialPortalCenter);

    // Check on every pointer move whether the cursor is anywhere inside or on the letter O circle
    window.addEventListener('mousemove', (e) => {
      hasUserMovedPointer = true;
      const p = getPortalOCenterAndRadius();
      if (p.active) {
        const dist = Math.hypot(e.clientX - p.x, e.clientY - p.y);
        const portalEl = document.getElementById('nova-portal-o');
        // Full outer radius of the O ring + stroke padding
        if (dist <= p.r + 6) {
          document.body.classList.add('nova-portal-o-active');
      document.body.classList.remove('nova-cursor-hover');
          if (portalEl) {
            portalEl.querySelectorAll('.nova-portal-arc').forEach(arc => {
              arc.style.stroke = '#ffffff';
              arc.style.filter = 'drop-shadow(0 0 12px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 22px rgba(255, 255, 255, 0.35))';
            });
          }
        } else {
          document.body.classList.remove('nova-portal-o-active');
          if (portalEl) {
            portalEl.querySelectorAll('.nova-portal-arc').forEach(arc => {
              arc.style.stroke = '';
              arc.style.filter = '';
            });
          }
        }
      } else {
        document.body.classList.remove('nova-portal-o-active');
      }
    });
    const particles = [];
    let isPointerMoving = false;
    let pointerStopTimer = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      dot.style.left = `${mouse.x}px`;
      dot.style.top = `${mouse.y}px`;

      isPointerMoving = true;
      if (pointerStopTimer) clearTimeout(pointerStopTimer);
      pointerStopTimer = setTimeout(() => {
        isPointerMoving = false;
      }, 65);

      if (Math.random() > 0.25) {
        particles.push({
          x: mouse.x + (Math.random() - 0.5) * 4,
          y: mouse.y + (Math.random() - 0.5) * 4,
          size: Math.random() * 1.6 + 0.4,
          alpha: 0.55,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25
        });
      }
    });

    const interactiveSelectors = '#nova-portal-o, #nova-portal-glow, .celestial-label, a, button, [role="button"], input, select, .interactive';
    document.addEventListener('mouseover', (e) => {
      if (e.target && e.target.hasAttribute && e.target.hasAttribute('title')) {
        e.target.removeAttribute('title');
      }
      if (e.target.closest && e.target.closest(interactiveSelectors)) {
        document.body.classList.add('nova-cursor-hover');
      }
      if (e.target && e.target.classList && (e.target.classList.contains('label') || e.target.classList.contains('planet-label') || e.target.tagName === 'SPAN')) {
        document.body.classList.add('nova-cursor-hover');
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest && e.target.closest(interactiveSelectors)) {
        document.body.classList.remove('nova-cursor-hover');
      }
      if (e.target && e.target.classList && (e.target.classList.contains('label') || e.target.classList.contains('planet-label') || e.target.tagName === 'SPAN')) {
        document.body.classList.remove('nova-cursor-hover');
      }
    });

    document.querySelectorAll('[title]').forEach(el => el.removeAttribute('title'));

    function animateCursor() {
      ctx.clearRect(0, 0, width, height);

      // Check if an interactive element or 3D celestial object is currently highlighted
      const isHighlighted =
        document.body.classList.contains('nova-cursor-hover') ||
        document.body.classList.contains('nova-portal-o-active') ||
        document.body.classList.contains('nova-orb-locked');

      // Longer trail behind cursor while moving (0.065); rapid snap to cursor when stopped or highlighted (0.42)
      const haloLerp = (!isPointerMoving || isHighlighted) ? 0.42 : 0.065;
      haloPos.x += (mouse.x - haloPos.x) * haloLerp;
      haloPos.y += (mouse.y - haloPos.y) * haloLerp;

      if (Math.hypot(mouse.x - haloPos.x, mouse.y - haloPos.y) < 0.75) {
        haloPos.x = mouse.x;
        haloPos.y = mouse.y;
      }

      halo.style.left = `${haloPos.x}px`;
      halo.style.top = `${haloPos.y}px`;

      const dx = mouse.x - haloPos.x;
      const dy = mouse.y - haloPos.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 2.5) {
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(haloPos.x, haloPos.y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(dist / 95, 0.28)})`;
        ctx.lineWidth = 0.85;
        ctx.stroke();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.018;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 240, 255, ${p.alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(animateCursor);
    }

    animateCursor();
  })();
</script>


<script>
    (function initMorphingZoomOrb() {
    const slider = document.getElementById('scale-slider');
    const channel = document.getElementById('zoom-orb-channel');
    const canvas = document.getElementById('zoom-trail-canvas');
    const orb = document.getElementById('zoom-morph-orb');
    const anchorLeft = document.getElementById('zoom-anchor-left');
    const anchorRight = document.getElementById('zoom-anchor-right');
    const rippleLeft = document.getElementById('zoom-ripple-left');
    const rippleRight = document.getElementById('zoom-ripple-right');

    const cursorDot = document.getElementById('nova-cursor-dot');
    const cursorHalo = document.getElementById('nova-cursor-halo');

    if (!slider || !channel || !canvas || !orb) return;
    const ctx = canvas.getContext('2d');

    let cw = 144, ch = 32;
    const canvasPadX = 18;
    function resizeTrailCanvas() {
      const rect = channel.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        const dpr = window.devicePixelRatio || 1;
        cw = rect.width;
        ch = rect.height;
        canvas.width = (cw + canvasPadX * 2) * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, canvasPadX * dpr, 0);
      }
    }
    resizeTrailCanvas();
    window.addEventListener('resize', resizeTrailCanvas);

    // Track pointer position & drag state for Cursor-to-Orb Magnetic Morphing
    let pointerX = -999, pointerY = -999;
    let isPointerInChannel = false;
    let isDraggingOrb = false;

    window.addEventListener('pointermove', (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
    });
    channel.addEventListener('pointerenter', () => { isPointerInChannel = true; });
    channel.addEventListener('pointerleave', () => { isPointerInChannel = false; });
    slider.addEventListener('pointerdown', () => {
      isDraggingOrb = true;
      document.body.classList.add('nova-orb-locked');
    });
    window.addEventListener('pointerup', () => {
      if (isDraggingOrb) {
        isDraggingOrb = false;
        document.body.classList.remove('nova-orb-locked');
      }
    });

    function getNormalizedSlider() {
      const v = parseFloat(slider.value) || 3.70;
      return Math.max(0, Math.min(1, (v - 1.0) / 3.0));
    }

    let displayNorm = getNormalizedSlider();
    let lastX = null;
    let dockedState = null;
    const trailNodes = [];

    function triggerEclipseRipple(side) {
      const el = side === 'left' ? rippleLeft : rippleRight;
      if (!el) return;
      el.classList.remove('eclipse-ripple-active');
      void el.offsetWidth;
      el.classList.add('eclipse-ripple-active');
    }

    function updateMorphingOrbFrame() {
      if (cw <= 0) resizeTrailCanvas();
      const targetNorm = getNormalizedSlider();

      // Responsive interpolation for both mouse drag and two-finger trackpad swipe
      displayNorm += (targetNorm - displayNorm) * 0.28;
      if (Math.abs(targetNorm - displayNorm) < 0.0002) {
        displayNorm = targetNorm;
      }

      const minX = 5;
      const maxX = Math.max(20, cw - 7);
      const x = minX + displayNorm * (maxX - minX);
      const y = ch / 2;

      // Two-stage diameter curve: stays compact (4.5px -> 7.4px) across 0%..90% of the slider so it is unmistakably smaller than the 12px right circle, then smoothly expands to 12.0px at 100% full zoom
      const baseGrowth = displayNorm * 3.1; // +3.1px linear growth
      const finalDockGrowth = Math.pow(displayNorm, 6.0) * 4.4; // +4.4px only near the very end (92%..100%)
      const diameter = 4.5 + baseGrowth + finalDockGrowth;
      const radius = diameter / 2;

      orb.style.boxSizing = 'border-box';
      orb.style.left = `${x}px`;
      orb.style.width = `${diameter.toFixed(2)}px`;
      orb.style.height = `${diameter.toFixed(2)}px`;

      const fillAlpha = 0.92 - Math.pow(displayNorm, 2.0) * 0.32;
      const glowSpread = 3.0 + Math.pow(displayNorm, 3.0) * 5.0;
      orb.style.background = `rgba(103, 232, 249, ${fillAlpha.toFixed(2)})`;
      orb.style.border = '1px solid rgba(224, 242, 254, 0.9)';
      orb.style.boxShadow = `0 0 ${glowSpread.toFixed(1)}px rgba(34, 211, 238, ${(0.5 + displayNorm * 0.3).toFixed(2)})`;

      // Check if cursor is directly over the active orb, left anchor, or right anchor, or actively dragging
      const rect = channel.getBoundingClientRect();
      const orbScreenX = rect.left + x;
      const orbScreenY = rect.top + y;
      const leftAnchorScreenX = rect.left + minX;
      const rightAnchorScreenX = rect.left + maxX;

      const distToOrb = Math.hypot(pointerX - orbScreenX, pointerY - orbScreenY);
      const distToLeft = Math.hypot(pointerX - leftAnchorScreenX, pointerY - orbScreenY);
      const distToRight = Math.hypot(pointerX - rightAnchorScreenX, pointerY - orbScreenY);

      if (cursorDot && cursorHalo) {
        if (isDraggingOrb || (isPointerInChannel && distToOrb <= 14)) {
          // Lock & morph cursor circle to match the moving zoom orb's exact size and position
          cursorDot.style.left = `${orbScreenX}px`;
          cursorDot.style.top = `${orbScreenY}px`;
          cursorDot.style.width = `${diameter}px`;
          cursorDot.style.height = `${diameter}px`;
          cursorDot.style.backgroundColor = 'rgba(165, 243, 252, 0.98)';
          cursorDot.style.boxShadow = `0 0 ${glowSpread + 4}px 2px rgba(34, 211, 238, 0.95)`;
          cursorHalo.style.width = `${diameter + 6}px`;
          cursorHalo.style.height = `${diameter + 6}px`;
          cursorHalo.style.opacity = '0.35';
        } else if (isPointerInChannel && distToLeft <= 10) {
          // Match left small anchor circle (6px) when hovering directly over it
          cursorDot.style.left = `${leftAnchorScreenX}px`;
          cursorDot.style.top = `${orbScreenY}px`;
          cursorDot.style.width = '6px';
          cursorDot.style.height = '6px';
          cursorHalo.style.width = '14px';
          cursorHalo.style.height = '14px';
          cursorHalo.style.opacity = '0.4';
        } else if (isPointerInChannel && distToRight <= 12) {
          // Match right larger anchor circle (10px) when hovering directly over it
          cursorDot.style.left = `${rightAnchorScreenX}px`;
          cursorDot.style.top = `${orbScreenY}px`;
          cursorDot.style.width = '10px';
          cursorDot.style.height = '10px';
          cursorHalo.style.width = '18px';
          cursorHalo.style.height = '18px';
          cursorHalo.style.opacity = '0.4';
        } else {
          // Restore default Celestial Point cursor dimensions
          cursorDot.style.width = '';
          cursorDot.style.height = '';
          cursorDot.style.backgroundColor = '';
          cursorDot.style.boxShadow = '';
          cursorHalo.style.width = '';
          cursorHalo.style.height = '';
          cursorHalo.style.opacity = '';
        }
      }

      // Anchor opacity & Eclipse Resonance Docking detection
      if (anchorLeft) {
        anchorLeft.style.opacity = displayNorm < 0.06 ? '0.15' : '0.45';
      }
      if (anchorRight) {
        anchorRight.style.opacity = displayNorm > 0.94 ? '0.95' : '0.48';
        anchorRight.style.borderColor = displayNorm > 0.94 ? 'rgba(165, 243, 252, 0.95)' : 'rgba(103, 232, 249, 0.5)';
      }

      if (displayNorm <= 0.018 && dockedState !== 'left') {
        dockedState = 'left';
        triggerEclipseRipple('left');
      } else if (displayNorm >= 0.982 && dockedState !== 'right') {
        dockedState = 'right';
        triggerEclipseRipple('right');
      } else if (displayNorm > 0.04 && displayNorm < 0.96) {
        dockedState = null;
      }

      // Spawn dense, long-lasting comet wake segments for BOTH mouse drag and two-finger trackpad scroll
      if (lastX !== null) {
        const dx = x - lastX;
        const absDx = Math.abs(dx);
        if (absDx > 0.025) {
          // Sub-stepping every 1.1px guarantees a smooth, unbroken ribbon trail
          const steps = Math.min(14, Math.max(1, Math.ceil(absDx / 1.1)));
          for (let s = 1; s <= steps; s++) {
            const interpX = lastX + (dx * s) / steps;
            trailNodes.push({
              x: interpX,
              y: y,
              r: radius * 0.95,
              alpha: Math.min(0.62, 0.28 + absDx * 0.065)
            });
          }
        }
      }
      lastX = x;

      // Render & slowly decay the trail (3.5x longer persistence so it stays visible much longer)
      ctx.clearRect(-canvasPadX, 0, cw + canvasPadX * 2, ch);
      for (let i = trailNodes.length - 1; i >= 0; i--) {
        const pt = trailNodes[i];
        pt.alpha -= 0.0045; // Slow decay for long, lingering comet tail
        pt.r *= 0.994;      // Gradual taper toward the tail tip
        if (pt.alpha <= 0.004) {
          trailNodes.splice(i, 1);
          continue;
        }
        const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.r * 2.1);
        grad.addColorStop(0, `rgba(165, 243, 252, ${pt.alpha})`);
        grad.addColorStop(0.45, `rgba(34, 211, 238, ${pt.alpha * 0.65})`);
        grad.addColorStop(1, 'rgba(34, 211, 238, 0)');
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r * 2.1, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }

      requestAnimationFrame(updateMorphingOrbFrame);
    }

    requestAnimationFrame(updateMorphingOrbFrame);
  })();
</script>
