<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universe Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #02040a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    canvas { display: block; }
    @keyframes mycelial-spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animate-mycelial {
      animation: mycelial-spin 10s linear infinite;
    }
    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #orbit-spinner-svg {
      animation: orbit-spin 8s linear infinite reverse;
    }
    #orbit-spinner-svg.orbit-paused {
      animation-play-state: paused;
    }
/* --- Cosmic Scale Ladder (Muted Top Tier Pips) --- */
    /* --- Cosmic Scale Ladder (Pure Minimalist Icon Pips) --- */
    .tier-ladder {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(9, 13, 22, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      padding: 5px 8px;
      border-radius: 10px;
      backdrop-filter: blur(12px);
    }
    .tier-pip {
      display: flex;
      align-items: center;
      gap: 0px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tier-pip svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      flex-shrink: 0;
      transition: transform 0.25s ease, color 0.25s ease;
    }
    .tier-pip-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 0.3s ease, opacity 0.25s ease, margin-left 0.25s ease;
    }
    .tier-pip:hover {
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.45);
      border-color: rgba(148, 163, 184, 0.2);
    }
    /* Expand label ONLY on hover */
    .tier-pip:hover .tier-pip-label {
      max-width: 90px;
      opacity: 1;
      margin-left: 7px;
    }
    .tier-pip.active {
      color: #e2e8f0;
      background: rgba(30, 41, 59, 0.75);
      border-color: rgba(217, 119, 6, 0.45);
      box-shadow: inset 0 0 10px rgba(217, 119, 6, 0.12);
    }
    .tier-pip.active svg {
      color: #fbbf24;
    }
    .tier-pip.active:hover .tier-pip-label {
      color: #fcd34d;
    }

  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- Top Navigation Header -->
  <header class="fixed top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
    <div onclick="resetToSolCore()" class="pointer-events-auto cursor-pointer bg-slate-900/40 border border-slate-700/50 hover:border-fuchsia-500/50 px-4 py-2 rounded-xl backdrop-blur-md flex items-center space-x-2.5 shadow-lg transition">
      <span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400 shadow-[0_0_8px_#e879f9]"></span>
      <span class="font-bold tracking-wider text-xs text-fuchsia-300 uppercase">Universe Explorer</span>
    </div>

    <div class="pointer-events-auto tier-ladder shadow-lg">
      <!-- Solar -->
      <button id="btn-t1" onclick="filterTier(1)" class="tier-pip">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>
        <span class="tier-pip-label">Solar</span>
      </button>

      <!-- Stellar -->
      <button id="btn-t2" onclick="filterTier(2)" class="tier-pip">
        <svg viewBox="0 0 24 24"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>
        <span class="tier-pip-label">Stellar</span>
      </button>

      <!-- Galaxies -->
      <button id="btn-t3" onclick="filterTier(3)" class="tier-pip">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4.2" transform="rotate(-28 12 12)"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
        <span class="tier-pip-label">Galaxies</span>
      </button>

      <!-- Deep Web -->
      <button id="btn-t4" onclick="filterTier(4)" class="tier-pip">
        <svg viewBox="0 0 24 24"><polygon points="12,3 20,8 20,16 12,21 4,16 4,8"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="4" y1="8" x2="20" y2="16"/></svg>
        <span class="tier-pip-label">Deep Web</span>
      </button>

      <!-- All Tiers -->
      <button id="btn-t0" onclick="filterTier(0)" class="tier-pip active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        <span class="tier-pip-label">All Tiers</span>
      </button>
    </div>
  </header>

  <!-- Hover Tooltip -->
  <div id="hover-tooltip" class="fixed z-30 pointer-events-none hidden bg-slate-950/90 border border-slate-700/80 text-slate-100 text-xs px-2.5 py-1 rounded-md shadow-xl backdrop-blur-sm -translate-y-8 translate-x-3">
    <span id="tooltip-text"></span>
  </div>

  <!-- Right-Side Astrophysical Inspector Drawer -->
  <aside id="inspector" class="fixed top-16 right-4 z-20 w-96 max-h-[calc(100vh-7.5rem)] overflow-y-auto bg-slate-900/45 border border-slate-700/50 rounded-2xl p-5 backdrop-blur-md shadow-2xl transition-transform duration-300 translate-x-[430px] pointer-events-auto">
    <!-- Minimalist Guided Tour Controls Header (Visible During Tour) -->
    <div id="sidebar-tour-controls" class="hidden mb-3.5 pb-3 border-b border-slate-700/50">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] animate-pulse"></span>
          <span id="tour-step-badge" class="text-[10px] font-mono uppercase tracking-widest text-cyan-300 font-semibold">GUIDED TOUR</span>
          <span id="tour-step-counter" class="text-[10px] font-mono text-slate-400"></span>
        </div>
        <div class="flex items-center space-x-1.5">
          <!-- Minimalist Prev Orb -->
          <button onclick="prevTourStep(event)" title="Previous Celestial Stop" class="w-6 h-6 rounded-full bg-slate-900/60 border border-slate-600/60 hover:border-cyan-400/70 flex items-center justify-center text-slate-300 hover:text-cyan-300 transition transform hover:scale-110 cursor-pointer">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <!-- Minimalist Pause/Resume Orb -->
          <button id="btn-tour-pause" onclick="togglePauseCosmicTour(event)" title="Pause / Resume Tour" class="relative w-6 h-6 rounded-full bg-cyan-950/50 border border-cyan-500/50 hover:border-cyan-300 flex items-center justify-center text-cyan-300 transition transform hover:scale-110 shadow-[0_0_8px_rgba(6,182,212,0.3)] cursor-pointer">
            <svg id="icon-tour-pause" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />
            </svg>
          </button>
          <!-- Minimalist Next Orb -->
          <button onclick="nextTourStep(event)" title="Next Celestial Stop" class="w-6 h-6 rounded-full bg-slate-900/60 border border-slate-600/60 hover:border-cyan-400/70 flex items-center justify-center text-slate-300 hover:text-cyan-300 transition transform hover:scale-110 cursor-pointer">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
          <!-- Minimalist Voice Mute/Unmute Orb -->
          <button id="btn-tour-voice" onclick="toggleTourVoice(event)" title="Toggle Tour Narration Voice" class="relative w-6 h-6 rounded-full bg-cyan-950/50 border border-cyan-500/50 hover:border-cyan-300 flex items-center justify-center text-cyan-300 transition transform hover:scale-110 shadow-[0_0_8px_rgba(6,182,212,0.3)] cursor-pointer">
            <svg id="icon-tour-voice" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
          </button>
          <!-- Minimalist Exit Tour Orb -->
          <button onclick="stopCosmicTour(event)" title="Exit Guided Tour" class="w-6 h-6 rounded-full bg-rose-950/40 border border-rose-500/40 hover:border-rose-400 flex items-center justify-center text-rose-300 hover:text-rose-200 transition transform hover:scale-110 cursor-pointer">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div class="w-full bg-slate-800/60 h-1 rounded-full mt-2.5 overflow-hidden">
        <div id="tour-progress-bar" class="bg-cyan-400/90 h-full transition-all duration-150" style="width: 0%"></div>
      </div>
    </div>

    <div class="flex items-start justify-between">
      <div>
        <span id="target-scale" class="text-[10px] font-mono uppercase tracking-widest text-emerald-400 block"></span>
        <h2 id="target-name" class="text-xl font-bold text-white mt-0.5"></h2>
        <p id="target-type" class="text-xs text-slate-300/90"></p>
      </div>
      <button id="btn-close-inspector" onclick="closeInspector()" title="Close Panel" class="w-6 h-6 rounded-full bg-slate-900/50 border border-slate-700/70 hover:border-slate-500 flex items-center justify-center text-slate-400 hover:text-white transition transform hover:scale-110 cursor-pointer shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mt-3 pt-3 border-t border-slate-700/50 text-xs text-amber-300 font-mono" id="target-distance"></div>
    <p id="target-summary" class="mt-2.5 text-[13.5px] text-slate-100 leading-relaxed"></p>

    <!-- Authoritative NASA / ESA / JWST Deep Profile Section -->
    <div id="target-deep-profile" class="mt-3.5 pt-3 border-t border-slate-700/50 space-y-2.5">
      <div id="target-metrics-grid" class="grid grid-cols-2 gap-1.5"></div>
      <div id="target-facts-container" class="bg-slate-950/35 border border-slate-700/50 rounded-xl p-2.5">
        <span class="text-[10.5px] font-mono uppercase tracking-widest text-cyan-300/90 block mb-1.5 font-semibold">Key Astrophysical Features</span>
        <ul id="target-facts-list" class="space-y-1.5 text-[13px] text-slate-200 leading-relaxed list-disc list-inside"></ul>
      </div>
    </div>

    <div id="inspector-inquiry-section" class="mt-4 pt-3 border-t border-slate-700/50">
      <label class="block text-[10.5px] font-mono uppercase tracking-wider text-cyan-400 mb-1.5 font-semibold">Observatory Telemetry</label>
      <div class="flex items-center space-x-2">
        <input id="custom-query-input" type="text" placeholder="Ask about rings, composition, moons, orbit..." class="w-full bg-slate-950/50 border border-slate-700/70 rounded-lg px-3 py-1.5 text-[13px] text-slate-100 placeholder-slate-400 focus:outline-none focus:border-cyan-400" onkeydown="if(event.key==='Enter') queryGemini()" />
        <button onclick="queryGemini()" title="Submit Inquiry" class="relative w-7 h-7 rounded-full bg-cyan-950/60 border border-cyan-500/50 hover:border-cyan-300 flex items-center justify-center text-cyan-300 hover:text-white transition duration-300 transform hover:scale-110 shadow-[0_0_10px_rgba(6,182,212,0.3)] shrink-0 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 5l7 7-7 7" />
          </svg>
        </button>
      </div>
      <div id="ai-telemetry" class="hidden mt-3 p-3.5 rounded-xl bg-slate-950/60 border border-slate-700/70 text-[13px] text-slate-100 leading-relaxed max-h-56 overflow-y-auto"></div>
    </div>
  </aside>

<!-- Bottom HUD Bar -->
  <footer id="bottom-hud" class="fixed bottom-4 left-4 right-4 z-20 bg-slate-900/40 border border-slate-700/50 px-5 py-3 rounded-2xl backdrop-blur-md flex items-center justify-between pointer-events-auto shadow-2xl">
    <div class="flex items-center space-x-4">
      <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400 whitespace-nowrap">Cosmic Scale:</span>
      <input id="scale-slider" type="range" min="1.0" max="4.0" step="0.01" value="1.0" class="w-44 accent-emerald-400 cursor-pointer" />

      <!-- Sol System Core Reset Button (Uniform w-8 h-8) -->
      <button onclick="resetToSolCore()" title="Return to Sun (Sol Core)" class="w-7 h-7 rounded-full bg-amber-400 hover:bg-amber-300 shadow-[0_0_12px_rgba(251,191,36,0.75)] transition transform hover:scale-110 shrink-0 cursor-pointer"></button>

      <!-- Cosmic Web Filament Button (True 8-Spoke Scalloped Spider-Web with Electric Pulses) -->
      <button id="btn-cosmic-web" onclick="toggleCosmicWeb()" title="Toggle Cosmic Web Filaments"
        class="relative w-7 h-7 rounded-full bg-fuchsia-950/60 border border-fuchsia-400/70 flex items-center justify-center cursor-pointer transition duration-300 hover:scale-110 shadow-[0_0_14px_rgba(232,121,249,0.55)] shrink-0">
        <svg id="cosmic-web-svg" class="w-6 h-6 text-fuchsia-300 transition-all duration-300 drop-shadow-[0_0_5px_rgba(232,121,249,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <!-- 8 Radial Spokes extending to tips -->
          <g stroke-width="1.15" stroke-opacity="0.85">
            <path d="M12 1.2v21.6M1.2 12h21.6M4.4 4.4l15.2 15.2M4.4 19.6L19.6 4.4"/>
          </g>
          <!-- 3 Concentric Scalloped Web Rings (Dipping inward between all 8 spokes) -->
          <g stroke-width="1.0" stroke-opacity="0.75">
            <!-- Outer Scalloped Ring -->
            <path d="M12 2.5 Q14.3 5.7 18.7 5.3 Q18.3 9.7 21.5 12 Q18.3 14.3 18.7 18.7 Q14.3 18.3 12 21.5 Q9.7 18.3 5.3 18.7 Q5.7 14.3 2.5 12 Q5.7 9.7 5.3 5.3 Q9.7 5.7 12 2.5Z"/>
            <!-- Middle Scalloped Ring -->
            <path d="M12 5.6 Q13.5 7.8 16.5 7.5 Q16.2 10.5 18.4 12 Q16.2 13.5 16.5 16.5 Q13.5 16.2 12 18.4 Q10.5 16.2 7.5 16.5 Q7.8 13.5 5.6 12 Q7.8 10.5 7.5 7.5 Q10.5 7.8 12 5.6Z"/>
            <!-- Inner Scalloped Ring -->
            <path d="M12 8.6 Q12.8 9.8 14.4 9.6 Q14.2 11.2 15.4 12 Q14.2 12.8 14.4 14.4 Q12.8 14.2 12 15.4 Q11.2 14.2 9.6 14.4 Q9.8 12.8 8.6 12 Q9.8 11.2 9.6 9.6 Q11.2 9.8 12 8.6Z"/>
          </g>
          <!-- Active Electric Surge Pulses traveling along the web -->
          <g id="web-electric-pulse" stroke="#ffffff" stroke-width="1.4" class="drop-shadow-[0_0_6px_#f0abfc]">
            <path d="M12 1.2v21.6M4.4 4.4l15.2 15.2" stroke-dasharray="4 10">
              <animate attributeName="stroke-dashoffset" values="28;0" dur="0.9s" repeatCount="indefinite"/>
            </path>
            <path d="M12 5.6 Q13.5 7.8 16.5 7.5 Q16.2 10.5 18.4 12 Q16.2 13.5 16.5 16.5 Q13.5 16.2 12 18.4 Q10.5 16.2 7.5 16.5 Q7.8 13.5 5.6 12 Q7.8 10.5 7.5 7.5 Q10.5 7.8 12 5.6Z" stroke="#f0abfc" stroke-dasharray="5 12">
              <animate attributeName="stroke-dashoffset" values="0;34" dur="1.1s" repeatCount="indefinite"/>
            </path>
          </g>
        </svg>
      </button>

      <!-- Pause/Resume Orbital Motion Button (Uniform w-6 h-6) -->
      <button id="btn-orbits" onclick="toggleOrbitPause()" title="Toggle Orbital Motion" class="relative w-8 h-8 rounded-full bg-emerald-950/50 border border-emerald-500/40 flex items-center justify-center cursor-pointer transition duration-300 hover:scale-110 shadow-[0_0_10px_rgba(16,185,129,0.3)] shrink-0">
        <svg id="orbit-spinner-svg" class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none">
          <!-- Counter-clockwise arc from 1:30 (45 deg top-right) around to 4:30 (45 deg bottom-right) -->
          <path d="M 18.36 5.64 A 9 9 0 1 0 18.36 18.36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          <!-- Crisp, stroke-free triangular arrowhead tilted at the exact 45-degree counter-clockwise tangent -->
          <polygon points="21.2,14.2 14.5,16.5 19.5,21.5" fill="currentColor" />
        </svg>
        <span id="orbit-core-dot" class="absolute w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
      </button>

      <!-- Guided Cosmic Tour Button (Uniform w-6 h-6) -->
      <button id="btn-cosmic-tour" onclick="toggleCosmicTour()" title="Start Guided Cosmic Tour (All Tiers & Objects)" class="relative w-8 h-8 rounded-full bg-cyan-950/50 border border-cyan-500/40 flex items-center justify-center cursor-pointer transition duration-300 hover:scale-110 shadow-[0_0_10px_rgba(6,182,212,0.3)] shrink-0">
        <span id="tour-ring-outer" class="hidden"></span>
        <svg id="tour-compass-svg" class="w-6 h-6 text-cyan-400 transition-transform duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z" />
        </svg>
      </button>
    </div>

    <!-- Center/Right Odometers & Far-Right View Controls -->
    <div class="flex items-center space-x-6">
      <div id="odometer-group" class="flex items-center space-x-8 text-xs font-mono">
        <div>
          <span class="text-slate-500 block text-[9px] uppercase tracking-wider whitespace-nowrap">Scale Metric</span>
          <span id="odo-metric" class="text-emerald-400 font-semibold whitespace-nowrap block mt-0.5">10^9 to 10^13 m</span>
        </div>
        <div>
          <span class="text-slate-500 block text-[9px] uppercase tracking-wider whitespace-nowrap">Effective Baseline</span>
          <span id="odo-dist" class="text-cyan-300 font-semibold whitespace-nowrap block mt-0.5">1.50 AU (Heliosphere)</span>
        </div>
        <!-- Hidden span keeps JS zoom loop error-free while removing Active Tier from UI -->
        <span id="odo-tier" class="hidden"></span>
      </div>

      <!-- Persistent Sidebar Toggle (|||) & Fullscreen / Standard Mode Buttons -->
      <div id="hud-right-controls" class="flex items-center space-x-2.5 pl-2">
        <button id="btn-toggle-sidebar" onclick="toggleSidebarVisibility(event)" title="Toggle Sidebar On / Off" class="w-8 h-8 rounded-full bg-slate-900 border border-slate-700/80 hover:border-slate-500 flex items-center justify-center text-slate-300 hover:text-white transition transform hover:scale-110 shrink-0 cursor-pointer shadow-lg">
          <svg id="sidebar-toggle-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 5v14M12 5v14M16 5v14" />
          </svg>
        </button>

        <button id="btn-fullscreen-zen" onclick="toggleFullscreenZen()" title="Enter Fullscreen Mode" class="w-8 h-8 rounded-full bg-slate-900 border border-slate-700/80 hover:border-slate-500 flex items-center justify-center text-slate-300 hover:text-white transition transform hover:scale-110 shrink-0 cursor-pointer shadow-lg">
          <svg id="fullscreen-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4" />
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, raycaster, mouse;
    let catalog = [];
    let celestialObjects = [];
    let orbitingPlanets = [];
    let earthMeshRef = null;
    let moonMeshRef = null;
    let moonOrbitRingRef = null;
    let moonOrbitAngle = 0.8;
    let isFlyingToTarget = false;
    let lastTrackedTargetPos = new THREE.Vector3();
    let filamentFlowParticles = [];
    let rotatableObjects = [];
    let milkyWayGroup, andromedaGroup, triangulumGroup, cosmicWebGroup;
    let cmbSphere, cmbColorsAttribute, cmbMaterial;
    let celestialSkyboxGroup;
    let asteroidBelt, oortCloudGroup, crabPulsarBeams;
    let sunMeshRef = null;
    
    // Sagittarius A* Accretion Flow & ISCO Flares
    let sagAGroup = null;
    let sagAAccretionDisk = null;
    let sagAPlasmaFlares = [];

    // TON 618 Quasar Disk
    let ton618AccretionDisk = null;

    // Binary & Hierarchy Systems
    let siriusBarycenterGroup = null;
    let siriusAMesh = null, siriusBMesh = null;
    let siriusBinaryAngle = 0;
    
    let alphaCentauriGroup = null;
    let alphaCenAMesh = null, alphaCenBMesh = null, proximaMesh = null;

    function createRoundParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.35, 'rgba(255,255,255,0.75)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);
      return new THREE.CanvasTexture(canvas);
    }

    function buildUniformCelestialSkybox() {
      celestialSkyboxGroup = new THREE.Group();

      const starCount = 20000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(starCount * 3);
      const col = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        const radius = 2800.0;
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);

        pos[i] = radius * Math.sin(phi) * Math.cos(theta);
        pos[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
        pos[i + 2] = radius * Math.cos(phi);

        const tint = Math.random();
        if (tint > 0.82) {
          col[i] = 0.65; col[i+1] = 0.85; col[i+2] = 1.0;
        } else if (tint < 0.20) {
          col[i] = 1.0; col[i+1] = 0.82; col[i+2] = 0.60;
        } else {
          col[i] = 0.92; col[i+1] = 0.94; col[i+2] = 0.98;
        }
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: 1.1,
        sizeAttenuation: false,
        map: createRoundParticleTexture(),
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        depthWrite: false
      });

      const pts = new THREE.Points(geo, mat);
      pts.raycast = () => {};
      celestialSkyboxGroup.add(pts);
      scene.add(celestialSkyboxGroup);
    }

    function createProceduralTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      if (type === 'sun') {
        const grad = ctx.createLinearGradient(0, 0, 512, 256);
        grad.addColorStop(0, '#f59e0b');
        grad.addColorStop(0.5, '#fbbf24');
        grad.addColorStop(1, '#ea580c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 400; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(254, 240, 138, 0.3)' : 'rgba(217, 119, 6, 0.25)';
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 12, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'stephenson') {
        const grad = ctx.createRadialGradient(256, 128, 10, 256, 128, 256);
        grad.addColorStop(0, '#f87171');
        grad.addColorStop(0.4, '#dc2626');
        grad.addColorStop(0.8, '#991b1b');
        grad.addColorStop(1, '#450a0a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 600; i++) {
          ctx.fillStyle = Math.random() > 0.6 ? 'rgba(254, 202, 202, 0.25)' : 'rgba(127, 29, 29, 0.35)';
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 16, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'sombrero') {
        const grad = ctx.createRadialGradient(256, 128, 5, 256, 128, 220);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.25, '#fef08a');
        grad.addColorStop(0.65, '#e2e8f0');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
      } else if (type === 'earth') {
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 28; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * 512, Math.random() * 256, 30 + Math.random() * 50, 15 + Math.random() * 30, Math.random(), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        for (let j = 0; j < 35; j++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, 12 + Math.random() * 25, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'jupiter') {
        for (let y = 0; y < 256; y += 8) {
          const bandColor = (y % 16 === 0) ? '#c2410c' : (y % 24 === 0) ? '#fef08a' : '#d97706';
          ctx.fillStyle = bandColor;
          ctx.fillRect(0, y, 512, 8);
        }
        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.ellipse(320, 165, 32, 18, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'mars') {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#78350f';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, 15 + Math.random() * 30, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, 512, 18);
        ctx.fillRect(0, 238, 512, 18);
      } else if (type === 'uranus') {
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#cffafe');
        grad.addColorStop(0.3, '#67e8f9');
        grad.addColorStop(0.7, '#22d3ee');
        grad.addColorStop(1, '#cffafe');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        for (let y = 60; y < 200; y += 18) {
          ctx.fillRect(0, y, 512, 3);
        }
      } else if (type === 'neptune') {
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#1e3a8a');
        grad.addColorStop(0.5, '#2563eb');
        grad.addColorStop(1, '#1d4ed8');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(260, 150, 24, 13, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        for (let i = 0; i < 18; i++) {
          const cx = Math.random() * 450;
          const cy = 100 + Math.random() * 110;
          ctx.fillRect(cx, cy, 35 + Math.random() * 45, 2);
        }
      }

      return new THREE.CanvasTexture(canvas);
    }

    function makeFractalNodeSprite(colorHex, sizeMultiplier = 3.5) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, colorHex);
      gradient.addColorStop(0.35, colorHex);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        opacity: 0.85
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(sizeMultiplier, sizeMultiplier, 1.0);
      sprite.raycast = () => {};
      return sprite;
    }

    function buildAsteroidBelt() {

      for (let i = 0; i < asteroidCount; i++) {

        const radius = 18.2 + Math.random() * 3.0;
        const angle = Math.random() * Math.PI * 2;

        positions[i3] = Math.cos(angle) * radius;
        positions[i3 + 1] = (Math.random() - 0.5) * 0.45;
        positions[i3 + 2] = Math.sin(angle) * radius;

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({

      asteroidBelt.add(pts);

    function buildVolumetricOortCloud() {
      oortCloudGroup = new THREE.Group();
      const particleCount = 2800;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        const radius = 78.0 + Math.random() * 14.0;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions[i] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i + 2] = radius * Math.cos(phi);
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xa5f3fc,
        size: 0.25,
        map: createRoundParticleTexture(),

      const pts = new THREE.Points(geo, mat);
      pts.raycast = () => {};
      oortCloudGroup.add(pts);
      scene.add(oortCloudGroup);
    }

    function buildMilkyWaySpiral() {
      milkyWayGroup = new THREE.Group();
      milkyWayGroup.position.set(0, -3, -290);

      const particleCount = 24000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const arms = 2;

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const isBulge = Math.random() < 0.24;

        if (isBulge) {
          const r = 7.0 + Math.pow(Math.random(), 1.4) * 11.0;
          const theta = Math.random() * Math.PI * 2;
          const phi = (Math.random() - 0.5) * Math.PI * 0.4;

          positions[i3] = r * Math.cos(theta) * Math.cos(phi);
          positions[i3 + 1] = r * Math.sin(phi) * 0.45;
          positions[i3 + 2] = r * Math.sin(theta) * Math.cos(phi);

          colors[i3] = 1.0;
          colors[i3 + 1] = 0.88;
          colors[i3 + 2] = 0.62;
        } else {
          const r = 16.0 + Math.pow(Math.random(), 1.7) * 55;
          const armIndex = i % arms;
          const armSpread = (Math.random() - 0.5) * (0.32 + (r / 95));
          const angle = (armIndex * Math.PI) + (r * 0.11) + armSpread;

          positions[i3] = Math.cos(angle) * r;
          positions[i3 + 1] = (Math.random() - 0.5) * (6.5 * Math.exp(-r / 32));
          positions[i3 + 2] = Math.sin(angle) * r;

          colors[i3] = 0.35 + (Math.random() * 0.35);
          colors[i3 + 1] = 0.65;
          colors[i3 + 2] = 1.0;
        }
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.15,
        map: createRoundParticleTexture(),
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const pts = new THREE.Points(geometry, material);
      pts.raycast = () => {};
      milkyWayGroup.add(pts);
      scene.add(milkyWayGroup);
    }

    function buildAndromedaSpiral() {
      andromedaGroup = new THREE.Group();
      andromedaGroup.position.copy(andromedaBasePos);
      andromedaGroup.rotation.x = Math.PI / 3.2;
      andromedaGroup.rotation.z = Math.PI / 5;

      const particleCount = 14000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const isCore = Math.random() < 0.2;
        if (isCore) {
          const u = Math.random();
          const r = 2.0 + Math.sqrt(-2.0 * Math.log(u || 0.0001)) * 3.5;
          const theta = Math.random() * Math.PI * 2;
          positions[i3] = r * Math.cos(theta);
          positions[i3 + 1] = (Math.random() - 0.5) * 2.0;

    // Subtle, Translucent Electric Fractal Cosmic Web
    function buildNASAHubbleCosmicWeb() {
      cosmicWebGroup = new THREE.Group();
      filamentFlowParticles = [];
      window._filamentPulses = [];

      // Deterministic PRNG for structured fractal repeatability
      let seed = 421337;
      function fRand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      // 1. Expanded Supercluster Attractor Nodes across a much wider cosmic volume
      const nodeCount = 88; // Increased density from 52
      const nodes = [];
      for (let i = 0; i < nodeCount; i++) {
        const u = fRand(), v = fRand();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 400 + fRand() * 1350; // Stretches much further out (up to ~1750 units)
        nodes.push(new THREE.Vector3(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta) * 0.62,
          r * Math.cos(phi)
        ));
      }

      // 2. Recursive Midpoint-Displacement Fractal Bolt Generator
      function generateFractalBolt(pStart, pEnd, depth, jitterScale) {
        let pts = [pStart.clone(), pEnd.clone()];
        let currentJitter = jitterScale;
        for (let d = 0; d < depth; d++) {
          const nextPts = [pts[0]];
          for (let k = 0; k < pts.length - 1; k++) {
            const a = pts[k];
            const b = pts[k + 1];
            const mid = a.clone().add(b).multiplyScalar(0.5);
            mid.x += (fRand() - 0.5) * currentJitter;
            mid.y += (fRand() - 0.5) * currentJitter;
            mid.z += (fRand() - 0.5) * currentJitter;
            nextPts.push(mid, b);
          }
          pts = nextPts;
          currentJitter *= 0.52;
        }
        return pts;
      }

      // 3. Subtle, Translucent Electric Fractal Palette (Never overpowers foreground objects)
      const coreFilamentMat = new THREE.LineBasicMaterial({
        color: 0xf472b6,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const outerFilamentMat = new THREE.LineBasicMaterial({
        color: 0xd946ef,
        transparent: true,
        opacity: 0.11,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const branchFilamentMat = new THREE.LineBasicMaterial({
        color: 0xa855f7,
        transparent: true,
        opacity: 0.07,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

window._cosmicMaterials = { 
        core: coreFilamentMat, 
        outer: outerFilamentMat, 
        branch: branchFilamentMat 
      };

      const pulseCoreGeo = new THREE.SphereGeometry(0.85, 8, 8);
      const pulseCoreMat = new THREE.MeshBasicMaterial({
        color: 0xfce7f3,
        transparent: true,
        opacity: 0.48,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const pulseHaloGeo = new THREE.SphereGeometry(2.1, 8, 8);
      const pulseHaloMat = new THREE.MeshBasicMaterial({
        color: 0xe879f9,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      // 4. Connect Supercluster Nodes with Long-Range Conduits & Fractal Sub-Branches
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dist = nodes[i].distanceTo(nodes[j]);
          if (dist > 240 && dist < 620) { // Wider span for massive, far-reaching cosmic filaments
            const boltPts = generateFractalBolt(nodes[i], nodes[j], 4, dist * 0.22);
            const boltGeom = new THREE.BufferGeometry().setFromPoints(boltPts);

            const coreLine = new THREE.Line(boltGeom, coreFilamentMat);
            coreLine.raycast = () => {};
            cosmicWebGroup.add(coreLine);

            const sheathPts = generateFractalBolt(nodes[i], nodes[j], 4, dist * 0.26);
            const sheathGeom = new THREE.BufferGeometry().setFromPoints(sheathPts);
            const sheathLine = new THREE.Line(sheathGeom, outerFilamentMat);
            sheathLine.raycast = () => {};
            cosmicWebGroup.add(sheathLine);

            const branchCount = 1 + Math.floor(fRand() * 2);
            for (let b = 0; b < branchCount; b++) {
              const pickIdx = 3 + Math.floor(fRand() * (boltPts.length - 6));
              const branchOrigin = boltPts[pickIdx];
              const branchDir = new THREE.Vector3(
                (fRand() - 0.5) * 85,
                (fRand() - 0.5) * 65,
                (fRand() - 0.5) * 85
              );
              const branchTarget = branchOrigin.clone().add(branchDir);
              const subPts = generateFractalBolt(branchOrigin, branchTarget, 3, 24);
              const subGeom = new THREE.BufferGeometry().setFromPoints(subPts);
              const subLine = new THREE.Line(subGeom, branchFilamentMat);
              subLine.raycast = () => {};
              cosmicWebGroup.add(subLine);
            }

            if (fRand() > 0.45) {
              const boltCurve = new THREE.CatmullRomCurve3(boltPts);
              const pulseGroup = new THREE.Group();
// --- Longer, translucent 3D electric spark zigzag ---
              const sparkPts = [
                new THREE.Vector3(0, 0, -4.5),
                new THREE.Vector3(1.0, 0.8, -2.0),
                new THREE.Vector3(-0.8, -0.7, 0.0),
                new THREE.Vector3(0.6, 0.5, 2.0),
                new THREE.Vector3(0, 0, 4.5)
              ];
              const sparkGeo = new THREE.BufferGeometry().setFromPoints(sparkPts);
              const sparkMat = new THREE.LineBasicMaterial({
                color: 0xff33bb,
                transparent: true,
                opacity: 0.325,
                blending: THREE.AdditiveBlending
              });
              const sparkLine = new THREE.Line(sparkGeo, sparkMat);
              sparkLine.raycast = () => {};
              pulseGroup.add(sparkLine);
              // -------------------------------------------------------------

              const pHalo = new THREE.Mesh(pulseHaloGeo, pulseHaloMat);
              pHalo.raycast = () => {};
              pulseGroup.add(pHalo);
              cosmicWebGroup.add(pulseGroup);

const pulseItem = {
                mesh: pulseGroup,
                curve: boltCurve,
                progress: fRand(),
                speed: 0.0016 + fRand() * 0.0024,
                sparkMat: sparkMat,       // <-- Add this reference
                haloMat: pulseHaloMat     // <-- Add this reference
              };
              filamentFlowParticles.push(pulseItem);
              window._filamentPulses.push(pulseItem);
            }
          }
        }
      }

      function makeSubtleNodeSprite(rgbaColor, scaleSize) {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0.0, rgbaColor);
        grad.addColorStop(0.4, rgbaColor);
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(scaleSize, scaleSize, 1.0);
        return sprite;
      }

      // 5. Subtle Supercluster Intersection Nodes
      nodes.forEach(pt => {
        const outerAura = makeSubtleNodeSprite('rgba(232, 121, 249, 0.18)', 9.0);
        outerAura.position.copy(pt);

        hotCore.raycast = () => {};

      scene.add(cosmicWebGroup);
    }

    function updateCMBThermalAcoustics(timeSec) {
      if (!cmbSphere || cmbMaterial.opacity <= 0.002 || !cmbColorsAttribute) return;

      const pos = cmbSphere.geometry.attributes.position;
      const colors = cmbColorsAttribute.array;
      const count = pos.count;
      const t = timeSec * 0.30;

      for (let i = 0; i < count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        const w1 = Math.sin(x * 0.010 + t) * Math.cos(y * 0.010);
        const w2 = Math.sin(y * 0.014 - t * 0.75) * Math.cos(z * 0.014);
        const w3 = Math.cos(z * 0.020 + t * 0.4) * Math.sin(x * 0.020);
        const anisotropy = (w1 + w2 + w3) / 3.0;

        const i3 = i * 3;
        if (anisotropy > 0.12) {
          const factor = (anisotropy - 0.12) * 1.8;
          colors[i3] = 0.0;
          colors[i3 + 1] = 0.55 * factor;
          colors[i3 + 2] = 0.75 * factor;
        } else if (anisotropy < -0.12) {
          const factor = (-anisotropy - 0.12) * 1.6;
          colors[i3] = 0.32 * factor;
          colors[i3 + 1] = 0.10 * factor;
          colors[i3 + 2] = 0.60 * factor;
        } else {
          colors[i3] = 0.0;
          colors[i3 + 1] = 0.0;
          colors[i3 + 2] = 0.0;
        }
      }

      cmbColorsAttribute.needsUpdate = true;
    }

    function isNodeVisible(obj) {
      let cur = obj;
      while (cur) {
        if (cur.visible === false) return false;
        cur = cur.parent;
      }
      return true;
    }

    function resolveTargetData(obj) {
      let cur = obj;
      while (cur) {
        if (cur.userData && cur.userData.id) {
          return { data: cur.userData, rootMesh: cur };
        }
        cur = cur.parent;
      }
      return null;
    }

    function onPointerMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const visibleCandidates = celestialObjects.filter(obj => isNodeVisible(obj));
      const intersects = raycaster.intersectObjects(visibleCandidates, false);

      if (intersects.length > 0 && event.clientX < window.innerWidth - 410) {
        const resolved = resolveTargetData(intersects[0].object);
        if (resolved && resolved.data.name) {
          tooltipText.textContent = `${resolved.data.name} (${resolved.data.distance})`;
          tooltip.style.left = `${event.clientX}px`;
          tooltip.style.top = `${event.clientY}px`;
          tooltip.style.display = 'block';
          document.body.style.cursor = 'pointer';
          return;
        }
      }
      tooltip.style.display = 'none';
      document.body.style.cursor = 'default';
    }

    function onPointerDown(event) {
      if (event.target && event.target.closest && event.target.closest('header, footer, aside, #cosmic-tour-hud, button, input')) return;
      if (event.clientY < 60 || event.clientX > window.innerWidth - 410) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const visibleCandidates = celestialObjects.filter(obj => isNodeVisible(obj));
      const intersects = raycaster.intersectObjects(visibleCandidates, false);

      if (intersects.length > 0) {
        const resolved = resolveTargetData(intersects[0].object);
        if (resolved && resolved.data.id) {
          activeTargetMesh = resolved.rootMesh;
          openInspector(resolved.data);
          smoothFlyToTarget();
        }
      }
    }

    window.smoothFlyToTarget = function(durationMs = 2600) {
      if (!activeTargetMesh) return;

      TWEEN.removeAll();
      isFlyingToTarget = true;

      const startCamPos = camera.position.clone();
      const startTargetPos = controls.target.clone();

      const objRadius = (activeTarget && activeTarget.size) ? activeTarget.size : 1.0;
      
      // Closer, immersive framing distance for planets, stars, and galaxies
      const baseDist = Math.max(objRadius * 3.2, 4.2);
      const offsetDist = baseDist;

      const viewDir = startCamPos.clone().sub(startTargetPos);
      if (viewDir.lengthSq() < 0.001) viewDir.set(0.6, 0.3, 0.8);
      viewDir.normalize();

      // Balanced close-up elevation
      const offsetVec = new THREE.Vector3(
        viewDir.x * offsetDist,
        Math.max(offsetDist * 0.28, 1.4),
        viewDir.z * offsetDist
      );

      const tweenObj = { t: 0 };
      new TWEEN.Tween(tweenObj)
        .to({ t: 1 }, durationMs)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => {
          if (!activeTargetMesh) return;
          const currentWorldPos = new THREE.Vector3();
          activeTargetMesh.getWorldPosition(currentWorldPos);

          const desiredEndCam = currentWorldPos.clone().add(offsetVec);
          camera.position.lerpVectors(startCamPos, desiredEndCam, tweenObj.t);
          controls.target.lerpVectors(startTargetPos, currentWorldPos, tweenObj.t);
          lastTrackedTargetPos.copy(currentWorldPos);
        })
        .onComplete(() => {
          isFlyingToTarget = false;
          if (activeTargetMesh) {
            activeTargetMesh.getWorldPosition(lastTrackedTargetPos);
          }
        })
        .start();
    };

    function synthesizeDirectAstrophysicalAnswer(target, rawQuery) {
      const q = (rawQuery || "").toLowerCase().trim();
      const id = target.id;
      const arch = ASTROPHYSICAL_ARCHIVE[id] || {};
      const metricsMap = {};
      (arch.metrics || []).forEach(([k, v]) => { metricsMap[k.toLowerCase()] = `${k}: ${v}`; });
      const facts = arch.facts || [];

      // Topic-specific deep Q&A dictionary for natural, accurate answers
      const TOPIC_QA = {
        "saturn": {
          "ring": "Saturn's main ring system spans 282,000 km across (divided into the D, C, B, Cassini Division, A, F, G, and E rings) yet is only 10 to 30 meters thick. It is composed of 99.9% pure water-ice particles ranging in size from microscopic frost grains to house-sized boulders, likely formed from a tidally shattered icy moon or comet within Saturn's Roche limit.",
          "moon": "Saturn has 146 confirmed moons. Its largest moon, Titan (5,149 km diameter), possesses a dense nitrogen-rich atmosphere and liquid methane/ethane seas, while Enceladus vents hydrothermal water-ice plumes from a global subsurface ocean at its south pole.",
          "hex": "Saturn's north pole hosts a persistent 29,000-km-wide hexagonal standing wave in its atmospheric jet stream, driven by steep latitudinal wind-shear gradients Rotating with a period of 10h 39m."
        },
        "uranus": {
          "ring": "Uranus possesses 13 narrow, remarkably dark rings (albedo < 5%) composed of radiation-darkened organic ice boulders and dust, discovered in 1977 during a stellar occultation and flanked by small shepherd moons like Cordelia and Ophelia."
        },
        "jupiter": {
          "ring": "Jupiter has a faint, dusty 4-part ring system (halo, main ring, and two gossamer rings) discovered by Voyager 1 in 1979, continuously replenished by micrometeoroid impacts blasting dust off its inner moons Metis, Adrastea, Amalthea, and Thebe.",
          "spot": "The Great Red Spot is a high-pressure anticyclonic storm in Jupiter's southern hemisphere spanning ~16,350 km across (wider than Earth), featuring 430–680 km/h peripheral winds and persisting for over 300 years."
        },
        "neptune": {
          "ring": "Neptune is encircled by five faint, dusty rings (Galle, Le Verrier, Lassell, Arago, and Adams) featuring bright clumpy arcs ('Fraternité', 'Égalité', 'Liberté') stabilized by the gravitational resonance of its inner moon Galatea."
        }
      };

      if (TOPIC_QA[id]) {
        for (const [kw, ans] of Object.entries(TOPIC_QA[id])) {
          if (q.includes(kw)) return ans;
        }
      }

      // Match query keywords against the object's facts and metrics
      const keywords = q.replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w.length > 2 && !["what", "are", "the", "how", "why", "does", "for", "about", "tell", "with", "from", "that", "this"].includes(w));

      const matchedFacts = facts.filter(f => keywords.some(kw => f.toLowerCase().includes(kw)));
      const matchedMetrics = (arch.metrics || []).filter(([k, v]) => keywords.some(kw => k.toLowerCase().includes(kw) || v.toLowerCase().includes(kw)));

      if (q.includes("ring")) {
        const ringFact = facts.find(f => f.toLowerCase().includes("ring"));
        if (ringFact) return ringFact;
        return `${target.name} does not possess a prominent planetary ring system; in our Solar System, only the four giant planets (Jupiter, Saturn, Uranus, and Neptune) and minor bodies like Chariklo and Haumea maintain ring systems.`;
      }
      if (q.includes("moon") || q.includes("satellite")) {
        const moonFact = facts.find(f => /moon|satellite|titan|enceladus|triton|ganymede|europa|phobos|theia/i.test(f));
        if (moonFact) return moonFact;
      }
      if (q.includes("temp") || q.includes("hot") || q.includes("cold") || q.includes("heat")) {
        const tempMetric = (arch.metrics || []).find(([k]) => /temp|heat/i.test(k));
        const tempFact = facts.find(f => /temp|kelvin|°c|greenhouse|cold|hot|thermal/i.test(f));
        if (tempMetric && tempFact) return `${tempMetric[0]} is ${tempMetric[1]}. ${tempFact}`;
        if (tempMetric) return `${target.name}'s ${tempMetric[0].toLowerCase()} is ${tempMetric[1]}.`;
      }
      if (q.includes("mass") || q.includes("size") || q.includes("big") || q.includes("radius") || q.includes("large") || q.includes("heavy") || q.includes("dens")) {
        const sizeMetrics = (arch.metrics || []).filter(([k]) => /mass|radius|diameter|span|size|density|volume/i.test(k)).map(([k, v]) => `${k}: ${v}`).join(" • ");
        const sizeFact = facts.find(f => /mass|radius|size|largest|diameter|volume|dense/i.test(f));
        return [sizeMetrics, sizeFact].filter(Boolean).join(" — ") || target.summary;
      }
      if (q.includes("dist") || q.includes("far") || q.includes("where") || q.includes("locat") || q.includes("light")) {
        return `${target.name} is located at a distance of ${target.distance} (scale regime ${target.scale_order}). ${facts[0] || target.summary}`;
      }
      if (q.includes("orbit") || q.includes("year") || q.includes("rotat") || q.includes("spin") || q.includes("day") || q.includes("speed") || q.includes("vel")) {
        const kinMetrics = (arch.metrics || []).filter(([k]) => /orbit|period|rotat|spin|vel|day|reson/i.test(k)).map(([k, v]) => `${k}: ${v}`).join(" • ");
        const kinFact = facts.find(f => /orbit|rotat|spin|year|day|perihelion|velocity|km\/s/i.test(f));
        return [kinMetrics, kinFact].filter(Boolean).join(" — ") || target.summary;
      }
      if (q.includes("comp") || q.includes("made") || q.includes("atmos") || q.includes("gas") || q.includes("core") || q.includes("surface") || q.includes("water") || q.includes("ice")) {
        const compFact = facts.find(f => /hydrogen|helium|iron|silicate|water|ice|co₂|atmosphere|methane|crust|core|plasma|dust/i.test(f));
        if (compFact) return compFact;
      }

      if (matchedFacts.length > 0 || matchedMetrics.length > 0) {
        const mText = matchedMetrics.map(([k, v]) => `${k}: ${v}`).join(" • ");
        return [mText, ...matchedFacts].filter(Boolean).join(" ");
      }

      return `${target.summary} ${facts.join(" ")}`.trim();
    }
