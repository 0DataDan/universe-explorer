<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="NOVA" />
  <meta name="description" content="NOVA — Interactive 3D Cosmic Simulation" />
  <title>NOVA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const forceBoot = urlParams.has("boot") || urlParams.has("intro");
      const hasBooted = !forceBoot && localStorage.getItem("hasBootedSession") === "true";
      if (!hasBooted) {
        document.documentElement.classList.add("is-booting");
      }
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000000; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    canvas { display: block; }
    @keyframes mycelial-spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animate-mycelial {
      animation: mycelial-spin 10s linear infinite;
    }
    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #orbit-spinner-svg {
      animation: orbit-spin 8s linear infinite reverse;
    }
    #orbit-spinner-svg.orbit-paused {
      animation-play-state: paused;
    }
/* --- Cosmic Scale Ladder (Muted Top Tier Pips) --- */
    /* --- Cosmic Scale Ladder (Pure Minimalist Icon Pips) --- */
    .tier-ladder {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(9, 13, 22, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      padding: 5px 8px;
      border-radius: 10px;
      backdrop-filter: blur(12px);
    }
    .tier-pip {
      display: flex;
      align-items: center;
      gap: 0px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tier-pip svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      flex-shrink: 0;
      transition: transform 0.25s ease, color 0.25s ease;
    }
    .tier-pip-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 0.3s ease, opacity 0.25s ease, margin-left 0.25s ease;
    }
    .tier-pip:hover {
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.45);
      border-color: rgba(148, 163, 184, 0.2);
    }
    /* Expand label ONLY on hover */
    .tier-pip:hover .tier-pip-label {
      max-width: 90px;
      opacity: 1;
      margin-left: 7px;
    }
    .tier-pip.active {
      color: #e2e8f0;
      background: rgba(30, 41, 59, 0.75);
      border-color: rgba(217, 119, 6, 0.45);
      box-shadow: inset 0 0 10px rgba(217, 119, 6, 0.12);
    }
    .tier-pip.active svg {
      color: #fbbf24;
    }
    .tier-pip.active:hover .tier-pip-label {
      color: #fcd34d;
    }


    /* Heavy Hydraulic Spaceship Door Slide Effect (Slowed down for deliberate, cinematic motion) */
    #inspector,
    #map-key-drawer {
      transition: transform 3600ms cubic-bezier(0.22, 0.95, 0.32, 1) !important;
      will-change: transform;
    }
    #inspector-edge-tab,
    #map-key-summon-btn {
      transition: transform 3400ms cubic-bezier(0.22, 0.95, 0.32, 1), opacity 2600ms ease, background-color 300ms ease, border-color 300ms ease !important;
      will-change: transform, opacity;
    }

    /* Fullscreen Sidebar Tab Hover Behavior: Hidden by default in Fullscreen, appears smoothly on mouse hover */
    #inspector-edge-tab::before {
      content: "";
      position: absolute;
      top: -20px;
      bottom: -20px;
      right: 0;
      width: 28px;
      background: transparent;
    }
    #inspector-edge-tab.fullscreen-hover-tab {
      opacity: 0 !important;
      transform: translateY(-50%) translateX(8px) !important;
      pointer-events: auto !important;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1), opacity 260ms ease, background-color 300ms ease, border-color 300ms ease !important;
    }
    #inspector-edge-tab.fullscreen-hover-tab:hover {
      opacity: 1 !important;
      transform: translateY(-50%) translateX(0px) !important;
    }

    /* Vertical Tier Menu Slide-Out Animation (Slower, graceful & smooth) */
    #tier-vertical-menu {
      transition: transform 1300ms cubic-bezier(0.22, 0.95, 0.32, 1), opacity 950ms ease, clip-path 1300ms cubic-bezier(0.22, 0.95, 0.32, 1) !important;
      transform-origin: bottom center;
      will-change: transform, opacity, clip-path;
    }
    #tier-vertical-menu.tier-menu-closed {
      transform: translate(-50%, 34px) scaleY(0.15) !important;
      opacity: 0 !important;
      clip-path: inset(100% -20px 0% -20px);
      pointer-events: none !important;
    }
    #tier-vertical-menu.tier-menu-open {
      transform: translate(-50%, 0px) scaleY(1) !important;
      opacity: 1 !important;
      clip-path: inset(-20px -20px -20px -20px);
      pointer-events: auto !important;
    }

    /* Reset Button Spiral: Single Continuous Inward Spin & Deep-Orange-to-Yellow Glow */
    @keyframes reset-spiral-inward {
      0% {
        transform: rotate(0deg);
        color: #67e8f9;
        filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4));
      }
      45% {
        color: #ea580c;
        filter: drop-shadow(0 0 8px #ea580c) drop-shadow(0 0 14px #f97316);
      }
      75% {
        color: #fde047;
        filter: drop-shadow(0 0 12px #facc15) drop-shadow(0 0 20px #fef08a);
      }
      100% {
        transform: rotate(1080deg);
        color: #67e8f9;
        filter: drop-shadow(0 0 0px transparent);
      }
    }
    @keyframes reset-btn-aura {
      0% {
        border-color: rgba(34, 211, 238, 0.6);
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
      }
      45% {
        border-color: rgba(249, 115, 22, 0.95);
        box-shadow: 0 0 18px rgba(234, 88, 12, 0.85), inset 0 0 10px rgba(249, 115, 22, 0.4);
      }
      75% {
        border-color: rgba(253, 224, 71, 1);
        box-shadow: 0 0 22px rgba(250, 204, 21, 0.95), inset 0 0 12px rgba(254, 240, 138, 0.5);
      }
      100% {
        border-color: rgba(34, 211, 238, 0.6);
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
      }
    }
    #btn-reset-sol.reset-animating {
      animation: reset-btn-aura 2000ms cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    #btn-reset-sol.reset-animating #reset-spiral-svg {
      animation: reset-spiral-inward 2000ms cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
  
    /* Trackless Morphing Zoom Singularity & Eclipse Resonance Docking */
    input[type="range"]#scale-slider,
    input[type="range"].scale-slider,
    div[class*="bottom-"] input[type="range"] {
      -webkit-appearance: none !important;
      appearance: none !important;
      background: transparent !important;
      height: 24px !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      cursor: none !important;
    }
    input[type="range"]#scale-slider::-webkit-slider-runnable-track {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      cursor: none !important;
    }
    input[type="range"]#scale-slider::-webkit-slider-thumb,
    div[class*="bottom-"] input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none !important;
      appearance: none !important;
      width: 18px !important;
      height: 18px !important;
      border-radius: 9999px !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      cursor: none !important;
    }
    input[type="range"]#scale-slider::-moz-range-thumb,
    div[class*="bottom-"] input[type="range"]::-moz-range-thumb {
      width: 18px !important;
      height: 18px !important;
      border-radius: 9999px !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      cursor: none !important;
    }

    @keyframes eclipse-dock-ripple {
      0% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.95;
        border-color: rgba(165, 243, 252, 0.95);
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.85);
      }
      100% {
        transform: translate(-50%, -50%) scale(2.65);
        opacity: 0;
        border-color: rgba(34, 211, 238, 0);
        box-shadow: 0 0 0px rgba(34, 211, 238, 0);
      }
    }
    .eclipse-ripple-active {
      animation: eclipse-dock-ripple 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* --- NASA Eyes on the Solar System Minimalist Celestial Labels --- */
    #celestial-labels-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none !important;
      overflow: hidden;
    }
    .celestial-label {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.88);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95), 0 0 8px rgba(2, 4, 10, 0.85);
      will-change: transform, opacity;
      transition: color 0.18s ease, text-shadow 0.18s ease;
    }
    .celestial-label--minor {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: rgba(175, 190, 212, 0.78);
    }
    .celestial-label:hover,
    .celestial-label--active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45), 0 1px 4px rgba(0, 0, 0, 0.98);
    }

    /* ==========================================================================
       Cinematic Boot Sequence & Wormhole Transition
       ========================================================================== */
    /* Header nav container must never block canvas mouse/trackpad events */
    header#header-nav {
      pointer-events: none !important;
    }
    #header-nova-pill {
      pointer-events: auto !important;
    }

    html.is-booting header#header-nav,
    html.is-booting #bottom-hud,
    html.is-booting #inspector-edge-tab,
    html.is-booting #map-key-summon-btn,
    html.is-booting #map-key-drawer,
    html.is-booting #celestial-labels-layer,
    html.is-booting #odometer-group {
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    #nova-boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #nova-boot-overlay.boot-completed,
    #nova-boot-overlay.pointer-events-none,
    html:not(.is-booting) #nova-boot-overlay {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* ==========================================================================
       Cinematic Boot Sequence: Locked Static Base Wordmark & Isolated Glow Trace
       ========================================================================== */
    /* Container layout locked against layout shifts before external scripts run */
    #nova-boot-center-container {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #nova-boot-center-container.boot-completed,
    #nova-boot-center-container.pointer-events-none,
    .boot-completed #nova-boot-center-container,
    html:not(.is-booting) #nova-boot-center-container {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
    #nova-boot-svg-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #nova-boot-svg {
      width: 520px !important;
      max-width: 85vw !important;
      height: auto !important;
      overflow: visible !important;
    }

    /* Base Wordmark: Statically rendered on initial frame, matching reference image 100% */
    #nova-base-wordmark {
      opacity: 1 !important;
      visibility: visible !important;
      display: block !important;
    }
    .nova-base-vector {
      fill: none !important;
      stroke: #ffffff !important;
      stroke-width: 9.6px !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    #nova-base-a-dot {
      fill: #ffffff !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* Portal 'O' Affordance: completely transparent center, breathing luminescent pulse on arcs */
    #nova-portal-o {
      transform-origin: 278px 72.5px;
      cursor: none !important;
      pointer-events: all !important;
    }
    @keyframes nova-cursor-dot-pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        background-color: #ffffff;
        box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.55);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.18);
        background-color: #ffffff;
        box-shadow: 0 0 11px 2.5px rgba(255, 255, 255, 0.9);
      }
    }
    @keyframes nova-cursor-halo-pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.94);
        border-color: rgba(255, 255, 255, 0.24);
        background-color: rgba(255, 255, 255, 0.01);
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.08);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.08);
        border-color: rgba(255, 255, 255, 0.55);
        background-color: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.22);
      }
    }
    body.nova-portal-o-active #nova-cursor-dot {
      width: 6px !important;
      height: 6px !important;
      background-color: #ffffff !important;
      animation: nova-cursor-dot-pulse 2.2s ease-in-out infinite !important;
    }
    body.nova-portal-o-active #nova-cursor-halo {
      width: 26px !important;
      height: 26px !important;
      animation: nova-cursor-halo-pulse 2.2s ease-in-out infinite !important;
    }
    #nova-portal-glow {
      fill: transparent !important;
    }
    #nova-portal-o .nova-portal-arc {
      animation: portal-arc-breathe 2.8s ease-in-out infinite alternate;
      transition: filter 350ms ease, stroke 350ms ease;
    }
    @keyframes portal-arc-breathe {
      0% {
        filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.35));
        stroke: rgba(255, 255, 255, 0.9);
      }
      100% {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.75));
        stroke: rgba(255, 255, 255, 1);
      }
    }
    /* Hover state: smoothly intensify brightness and glow without filling center */
    #nova-portal-o:hover .nova-portal-arc {
      animation: none !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.4)) !important;
    }
    html.is-wormhole-zooming #nova-portal-o .nova-portal-arc,
    html.is-wormhole-zooming #nova-portal-o:hover .nova-portal-arc {
      filter: none !important;
    }

    /* Starfield warp canvas */
    #nova-warp-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- Cinematic Boot Sequence & Wormhole Transition Overlay -->
  <div id="nova-boot-overlay">
    <!-- Forward-moving Starfield Traversal Canvas -->
    <canvas id="nova-warp-canvas" class="pointer-events-none absolute inset-0 z-10 opacity-0"></canvas>

    <!-- Centered Logo & Portal Container -->
    <div id="nova-boot-center-container" class="relative z-20 flex flex-col items-center justify-center will-change-transform">
      <div id="nova-boot-svg-wrapper" class="relative flex items-center justify-center will-change-transform">
        <svg id="nova-boot-svg" viewBox="0 0 734 144" class="w-[320px] sm:w-[460px] md:w-[600px] lg:w-[720px] h-auto overflow-visible select-none" xmlns="http://www.w3.org/2000/svg">
          <!-- BASE LAYER: Static crisp wordmark matching reference image 100% (Zero FOUC, No Startup Animation) -->
          <g id="nova-base-wordmark" style="opacity: 1 !important; visibility: visible !important;">
            <!-- Letter N: Smooth, continuous rounded top-left arch and bottom-right U-turn curve with vertical stems -->
            <path id="nova-base-n" class="nova-base-vector" d="M 12 132.5 L 12 39 C 12 22, 21 12.5, 34 12.5 C 46.5 12.5, 54 22, 56 35 L 89 110 C 91 123, 100 132.5, 112.5 132.5 C 125 132.5, 133 123, 133 109 L 133 12" />

            <!-- Letter O: The Interactive Portal Trigger (Circular ring with symmetrical horizontal gaps) -->
            <g id="nova-portal-o" class="portal-ready" style="opacity: 1 !important; visibility: visible !important;">
              <circle id="nova-portal-glow" cx="278" cy="72.5" r="60" fill="rgba(0,0,0,0.001)" style="pointer-events: all !important; cursor: none !important;" />
              <!-- Top Arc -->
              <path id="nova-svg-o-top" class="nova-base-vector nova-portal-arc" d="M 218.58 64.15 A 60 60 0 0 1 337.42 64.15" />
              <!-- Bottom Arc -->
              <path id="nova-svg-o-bot" class="nova-base-vector nova-portal-arc" d="M 337.42 80.85 A 60 60 0 0 1 218.58 80.85" />
            </g>

            <!-- Letter V: Wide, symmetrical angled legs meeting in a smooth, rounded bottom vertex -->
            <path id="nova-base-v" class="nova-base-vector" d="M 416.5 12 L 460 123 C 464 136, 488 136, 492 123 L 535.5 12" />

            <!-- Letter A: Inverted-V outer arch with rounded peak and solid white circular dot -->
            <path id="nova-base-a" class="nova-base-vector" d="M 593.5 132.5 L 634.5 29 C 640.5 10.5, 674.5 10.5, 680.5 29 L 721.5 132.5" />
            <circle id="nova-base-a-dot" cx="657.5" cy="71.5" r="11.5" />
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- 3D-Tracked NASA Eyes Minimalist Celestial Name Labels Layer -->
  <div id="celestial-labels-layer" aria-hidden="true"></div>

  <!-- Top Navigation Header -->
  <header id="header-nav" class="fixed top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
    <div id="header-nova-pill" onclick="handleHeaderLogoClick(event)" aria-label="NOVA" class="group pointer-events-auto cursor-pointer flex items-center px-3.5 py-2 rounded-full bg-slate-950/35 backdrop-blur-md border border-white/[0.07] hover:border-white/15 shadow-2xl transition-all duration-300">
      <img id="header-nova-logo" src="./nova-logo.png" alt="NOVA" class="h-[15px] w-auto object-contain opacity-75 group-hover:opacity-95 transition-opacity duration-300 select-none" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" />
      <span class="hidden text-slate-300/80 text-xs tracking-[0.28em] uppercase font-medium">NOVA</span>
    </div>
  </header>

  <!-- Sleek Glowing Minimalist Right-Edge Summon Tab (Textless, Independent from Bottom Overview Toggle) -->
  <button id="inspector-edge-tab" onclick="toggleSidebarDrawerTab(event)" class="fixed top-1/2 -translate-y-1/2 right-0 z-20 w-3 h-[420px] rounded-l-xl bg-cyan-950/75 hover:bg-cyan-900/90 backdrop-blur-xl border border-r-0 border-cyan-400/50 hover:border-cyan-300 text-cyan-300 shadow-[0_0_15px_rgba(34,211,238,0.35)] transition-all duration-300 pointer-events-auto cursor-pointer flex items-center justify-center group">
    <div class="w-1 h-1/3 max-h-24 min-h-[24px] rounded-full bg-cyan-400/90 shadow-[0_0_8px_#22d3ee] group-hover:bg-cyan-300 group-hover:scale-y-110 transition-all"></div>
  </button>

  <!-- Right-Side Astrophysical Inspector Drawer (Overflow-visible so left slide-back tab attaches cleanly) -->
  <aside id="inspector" class="fixed top-16 right-4 z-20 w-96 bg-slate-950/45 border border-white/10 rounded-2xl backdrop-blur-xl shadow-[0_12px_40px_rgba(0,0,0,0.65)] transition-transform duration-700 ease-[cubic-bezier(0.22,1,0.36,1)] translate-x-[430px] pointer-events-auto">
    <!-- Sleek Glowing Minimalist Attached Slide-Back Tab (Textless, Independent from Bottom Overview Toggle) -->
    <button onclick="toggleSidebarDrawerTab(event)" class="absolute top-0 bottom-0 -left-3.5 w-3.5 h-full rounded-l-xl bg-cyan-950/85 hover:bg-cyan-900/95 backdrop-blur-xl border border-r-0 border-cyan-400/60 hover:border-cyan-300 text-cyan-300 shadow-[0_0_15px_rgba(34,211,238,0.35)] transition-all duration-300 cursor-pointer flex items-center justify-center group">
      <div class="w-1 h-1/3 max-h-24 min-h-[24px] rounded-full bg-cyan-400/90 shadow-[0_0_8px_#22d3ee] group-hover:bg-cyan-300 group-hover:scale-y-110 transition-all"></div>
    </button>
    <div class="max-h-[calc(100vh-7.5rem)] overflow-y-auto p-5">
    <!-- Minimalist Guided Tour Controls Header (Visible During Tour) -->
    <div id="sidebar-tour-controls" class="hidden mb-3.5 pb-3 border-b border-slate-700/50">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] animate-pulse"></span>
          <span id="tour-step-badge" class="text-[10px] font-mono uppercase tracking-widest text-cyan-300 font-semibold">GUIDED TOUR</span>
          <span id="tour-step-counter" class="text-[10px] font-mono text-slate-400"></span>
        </div>

        .replace(/\s*\(scale regime [^\)]+\)/gi, "")

    function createRoundParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.35, 'rgba(255,255,255,0.75)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);
      return new THREE.CanvasTexture(canvas);
    }

    function buildUniformCelestialSkybox() {
      celestialSkyboxGroup = new THREE.Group();

      const starCount = 20000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(starCount * 3);
      const col = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        const radius = 38000.0;
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);

        pos[i] = radius * Math.sin(phi) * Math.cos(theta);
        pos[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
        pos[i + 2] = radius * Math.cos(phi);

        const tint = Math.random();
        if (tint > 0.82) {
          col[i] = 0.65; col[i+1] = 0.85; col[i+2] = 1.0;
        } else if (tint < 0.20) {
          col[i] = 1.0; col[i+1] = 0.82; col[i+2] = 0.60;
        } else {
          col[i] = 0.92; col[i+1] = 0.94; col[i+2] = 0.98;
        }
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: 1.1,
        sizeAttenuation: false,
        map: createRoundParticleTexture(),
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        depthWrite: false
      });

      const pts = new THREE.Points(geo, mat);
      pts.raycast = () => {};
      celestialSkyboxGroup.add(pts);
      scene.add(celestialSkyboxGroup);
    }

    const UNIFIED_TOGGLE_ACTIVE_CLASS = "relative w-8 h-8 rounded-full bg-cyan-950/60 border border-cyan-400/60 hover:border-cyan-300 flex items-center justify-center text-cyan-300 hover:text-white transition duration-300 transform hover:scale-110 shrink-0 cursor-pointer shadow-[0_0_10px_rgba(34,211,238,0.3)]";
    const UNIFIED_TOGGLE_INACTIVE_CLASS = "relative w-8 h-8 rounded-full bg-slate-900/70 border border-slate-700/80 hover:border-slate-500 flex items-center justify-center text-slate-400 hover:text-slate-200 opacity-60 transition duration-300 transform hover:scale-110 shrink-0 cursor-pointer shadow-lg";

        if (btn) btn.className = UNIFIED_TOGGLE_INACTIVE_CLASS;
        if (svg) svg.className.baseVal = "w-5 h-5 text-slate-400 transition-all duration-300";
        if (pulse) pulse.classList.add("hidden");
      }

      if (cosmicWebGroup) {
        cosmicWebGroup.visible = isCosmicWebVisible;
        if (isCosmicWebVisible) {
          const camDist = camera.position.distanceTo(controls.target);
          const webOpacityFactor = Math.max(0.2, 1.0 - Math.min(1.0, (camDist - 600) / 4500));
          cosmicWebGroup.traverse(child => {
            if (child.material) {
              child.material.transparent = true;
              if (child === cosmicWebGroup && child.userData.baseOpacity) {
                child.material.opacity = child.userData.baseOpacity * webOpacityFactor;
              } else if (!child.userData.baseOpacity) {
                child.userData.baseOpacity = child.material.opacity || 0.6;
                child.material.opacity = child.userData.baseOpacity * webOpacityFactor;
              }
            }
          });
        }

      const mapKeyDrawer = document.getElementById("map-key-drawer");

      }
      if (sbArcTop && sbArcBot && sbClipRect && sbInnerBar) {
        if (isVisible) {
          // TabToggleOn.png state: cyan arcs slide left from both top & bottom to form left half-circle (12 o'clock to 6 o'clock via 9 o'clock)
          sbArcTop.setAttribute("stroke-dasharray", "50 100");
          sbArcTop.setAttribute("stroke-dashoffset", "-50");
          sbArcBot.setAttribute("stroke-dasharray", "50 100");
          sbArcBot.setAttribute("stroke-dashoffset", "-50");
          sbClipRect.setAttribute("width", "16");
          sbInnerBar.style.opacity = "1";
          sbInnerBar.style.transform = "translateX(0px) scaleY(1)";
        } else {
          // TabToggleOff.png state: cyan arcs slide back to right edge
          sbArcTop.setAttribute("stroke-dasharray", "22 100");
          sbArcTop.setAttribute("stroke-dashoffset", "0");
          sbArcBot.setAttribute("stroke-dasharray", "22 100");
          sbArcBot.setAttribute("stroke-dashoffset", "0");
          sbClipRect.setAttribute("width", "0");
          sbInnerBar.style.opacity = "0";
          sbInnerBar.style.transform = "translateX(6px) scaleY(0.75)";

        // and hidden by default with hover-reveal (.fullscreen-hover-tab) in Fullscreen mode.
        if (isVisible) {
          edgeTab.classList.remove("fullscreen-hover-tab");

          mapKeySummon.classList.add("translate-x-20", "opacity-0", "pointer-events-none");

          mapKeySummon.classList.remove("translate-x-20", "opacity-0", "pointer-events-none");

    function createProceduralTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      if (type === 'sun') {
        const grad = ctx.createLinearGradient(0, 0, 512, 256);
        grad.addColorStop(0, '#f59e0b');
        grad.addColorStop(0.5, '#fbbf24');
        grad.addColorStop(1, '#ea580c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 400; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(254, 240, 138, 0.3)' : 'rgba(217, 119, 6, 0.25)';
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 12, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'stephenson') {
        const grad = ctx.createRadialGradient(256, 128, 10, 256, 128, 256);
        grad.addColorStop(0, '#f87171');
        grad.addColorStop(0.4, '#dc2626');
        grad.addColorStop(0.8, '#991b1b');
        grad.addColorStop(1, '#450a0a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 600; i++) {
          ctx.fillStyle = Math.random() > 0.6 ? 'rgba(254, 202, 202, 0.25)' : 'rgba(127, 29, 29, 0.35)';
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 16, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'sombrero') {
        const grad = ctx.createRadialGradient(256, 128, 5, 256, 128, 220);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.25, '#fef08a');
        grad.addColorStop(0.65, '#e2e8f0');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
      } else if (type === 'earth') {
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 28; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * 512, Math.random() * 256, 30 + Math.random() * 50, 15 + Math.random() * 30, Math.random(), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        for (let j = 0; j < 35; j++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, 12 + Math.random() * 25, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'jupiter') {
        for (let y = 0; y < 256; y += 8) {
          const bandColor = (y % 16 === 0) ? '#c2410c' : (y % 24 === 0) ? '#fef08a' : '#d97706';
          ctx.fillStyle = bandColor;
          ctx.fillRect(0, y, 512, 8);
        }
        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.ellipse(320, 165, 32, 18, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'mars') {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#78350f';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 256, 15 + Math.random() * 30, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, 512, 18);
        ctx.fillRect(0, 238, 512, 18);
      } else if (type === 'uranus') {
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#cffafe');
        grad.addColorStop(0.3, '#67e8f9');
        grad.addColorStop(0.7, '#22d3ee');
        grad.addColorStop(1, '#cffafe');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        for (let y = 60; y < 200; y += 18) {
          ctx.fillRect(0, y, 512, 3);
        }
      } else if (type === 'neptune') {
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#1e3a8a');
        grad.addColorStop(0.5, '#2563eb');
        grad.addColorStop(1, '#1d4ed8');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(260, 150, 24, 13, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        for (let i = 0; i < 18; i++) {
          const cx = Math.random() * 450;
          const cy = 100 + Math.random() * 110;
          ctx.fillRect(cx, cy, 35 + Math.random() * 45, 2);
        }
      }

      return new THREE.CanvasTexture(canvas);
    }

    function makeFractalNodeSprite(colorHex, sizeMultiplier = 3.5) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, colorHex);
      gradient.addColorStop(0.35, colorHex);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        opacity: 0.85
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(sizeMultiplier, sizeMultiplier, 1.0);
      sprite.raycast = () => {};
      return sprite;
    }

      let seed = 421337;
      function fRand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      // Helper matching applyCosmicDepthProportions() so Cosmic Web filaments reach exact positions of furthest objects
      function computeRescaledTargetPos(id, rawPos, tier) {
        const x = rawPos[0], y = rawPos[1], z = rawPos[2];
        const currentDist = Math.sqrt(x * x + y * y + z * z) || 1.0;
        const ux = x / currentDist, uy = y / currentDist, uz = z / currentDist;
        const targetDist = (tier === 4 || id === 'great-attractor')
          ? (950 + currentDist * 4.5)
          : (450 + currentDist * 3.2);
        const hash = id.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        const verticalSpread = Math.sin(hash * 1.37) * 0.38;
        const ny = uy + verticalSpread;
        const norm = Math.sqrt(ux * ux + ny * ny + uz * uz) || 1.0;
        return new THREE.Vector3((ux / norm) * targetDist, (ny / norm) * targetDist, (uz / norm) * targetDist);
      }

      // 1. Multi-Shell Supercluster Attractor Nodes spanning from Local Group (380) to Deep Cosmic Horizon (~7,850)
      const nodes = [];
      // Inner shell: Local Group & nearby supercluster web (r = 380 .. 2,150)
      const innerCount = 82;
      for (let i = 0; i < innerCount; i++) {
        const u = fRand(), v = fRand();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 380 + fRand() * 1770;
        nodes.push(new THREE.Vector3(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta) * 0.65,
          r * Math.cos(phi)
        ));
      }

      // Mid-deep shell: Laniakea, Shapley, and Coma-scale filaments (r = 2,100 .. 5,300)
      const midCount = 58;
      for (let i = 0; i < midCount; i++) {
        const u = fRand(), v = fRand();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 2100 + fRand() * 3200;
        nodes.push(new THREE.Vector3(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta) * 0.72,
          r * Math.cos(phi)
        ));
      }

      // Outer horizon shell: High-redshift protocluster web reaching the furthest objects (r = 5,100 .. 7,850)
      const outerCount = 44;
      for (let i = 0; i < outerCount; i++) {
        const u = fRand(), v = fRand();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 5100 + fRand() * 2750;
        nodes.push(new THREE.Vector3(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta) * 0.78,
          r * Math.cos(phi)
        ));
      }

      // Anchor nodes at the exact rescaled coordinates of Tier 3 & Tier 4 celestial objects (including furthest map objects)
      const deepCatalogAnchors = [
        { id: 'andromeda', pos: [380, 105, -255], tier: 3 },
        { id: 'triangulum', pos: [450, 48, -330], tier: 3 },
        { id: 'sombrero-galaxy', pos: [-335, 135, -380], tier: 3 },
        { id: 'centaurus-a', pos: [-510, 220, 175], tier: 3 },
        { id: 'messier-87', pos: [-285, 410, -510], tier: 3 },
        { id: 'great-attractor', pos: [-660, -175, -445], tier: 3 },
        { id: 'shapley-supercluster', pos: [-605, -540, 650], tier: 4 },
        { id: 'el-gordo', pos: [825, -350, -605], tier: 4 },
        { id: 'smacs-0723', pos: [460, 730, 985], tier: 4 },
        { id: 'ton-618', pos: [-985, -445, 890], tier: 4 },
        { id: 'earendel', pos: [670, -540, 1240], tier: 4 },
        { id: 'gn-z11', pos: [0, 0, 1500], tier: 4 }
      ];

      const anchorVectors = deepCatalogAnchors.map(item => computeRescaledTargetPos(item.id, item.pos, item.tier));
      anchorVectors.forEach(vec => nodes.push(vec));

      // Create organic stepping-stone bridge nodes from the inner web out to each furthest Tier 4 anchor so filaments visibly reach them
      anchorVectors.forEach(targetVec => {
        const distFromCore = targetVec.length();
        if (distFromCore > 2400) {
          const dir = targetVec.clone().normalize();
          const steps = 4;
          let prevPt = dir.clone().multiplyScalar(1450);
          nodes.push(prevPt);
          for (let s = 1; s < steps; s++) {
            const frac = s / steps;
            const radialDist = 1450 + frac * (distFromCore - 1450);
            const stepPt = dir.clone().multiplyScalar(radialDist);
            // Organic lateral offset so the filament bridge winds naturally through 3D space
            stepPt.x += (fRand() - 0.5) * 420;
            stepPt.y += (fRand() - 0.5) * 320;
            stepPt.z += (fRand() - 0.5) * 420;
            nodes.push(stepPt);
            prevPt = stepPt;
          }
        }
      });

      // 2. Recursive Midpoint-Displacement Fractal Bolt Generator
      function generateFractalBolt(pStart, pEnd, depth, jitterScale) {
        let pts = [pStart.clone(), pEnd.clone()];
        let currentJitter = jitterScale;
        for (let d = 0; d < depth; d++) {
          const nextPts = [pts[0]];
          for (let k = 0; k < pts.length - 1; k++) {
            const a = pts[k];
            const b = pts[k + 1];
            const mid = a.clone().add(b).multiplyScalar(0.5);
            mid.x += (fRand() - 0.5) * currentJitter;
            mid.y += (fRand() - 0.5) * currentJitter;
            mid.z += (fRand() - 0.5) * currentJitter;
            nextPts.push(mid, b);
          }
          pts = nextPts;
          currentJitter *= 0.52;
        }
        return pts;
      }

      // 3. Subtle, Translucent Electric Fractal Palette (Never overpowers foreground objects)
      const coreFilamentMat = new THREE.LineBasicMaterial({
        color: 0xf472b6,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const outerFilamentMat = new THREE.LineBasicMaterial({
        color: 0xd946ef,
        transparent: true,
        opacity: 0.11,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const branchFilamentMat = new THREE.LineBasicMaterial({
        color: 0xa855f7,
        transparent: true,
        opacity: 0.07,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      window._cosmicMaterials = { 
        core: coreFilamentMat, 
        outer: outerFilamentMat, 
        branch: branchFilamentMat 
      };

      const pulseHaloGeo = new THREE.SphereGeometry(2.1, 8, 8);
      const pulseHaloMat = new THREE.MeshBasicMaterial({
        color: 0xe879f9,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      function addFractalConduit(pA, pB, dist) {
        const boltPts = generateFractalBolt(pA, pB, 4, dist * 0.20);
        const boltGeom = new THREE.BufferGeometry().setFromPoints(boltPts);

        const coreLine = new THREE.Line(boltGeom, coreFilamentMat);
        coreLine.raycast = () => {};
        cosmicWebGroup.add(coreLine);

        const sheathPts = generateFractalBolt(pA, pB, 4, dist * 0.24);
        const sheathGeom = new THREE.BufferGeometry().setFromPoints(sheathPts);
        const sheathLine = new THREE.Line(sheathGeom, outerFilamentMat);
        sheathLine.raycast = () => {};
        cosmicWebGroup.add(sheathLine);

        const branchReach = Math.max(85, dist * 0.14);
        const branchCount = 1 + Math.floor(fRand() * 2);
        for (let b = 0; b < branchCount; b++) {
          const pickIdx = 3 + Math.floor(fRand() * (boltPts.length - 6));
          const branchOrigin = boltPts[pickIdx];
          const branchDir = new THREE.Vector3(
            (fRand() - 0.5) * branchReach,
            (fRand() - 0.5) * (branchReach * 0.75),
            (fRand() - 0.5) * branchReach
          );
          const branchTarget = branchOrigin.clone().add(branchDir);
          const subPts = generateFractalBolt(branchOrigin, branchTarget, 3, branchReach * 0.28);
          const subGeom = new THREE.BufferGeometry().setFromPoints(subPts);
          const subLine = new THREE.Line(subGeom, branchFilamentMat);
          subLine.raycast = () => {};
          cosmicWebGroup.add(subLine);
        }

        if (fRand() > 0.48) {
          const boltCurve = new THREE.CatmullRomCurve3(boltPts);
          const pulseGroup = new THREE.Group();
          const sparkPts = [
            new THREE.Vector3(0, 0, -4.5),
            new THREE.Vector3(1.0, 0.8, -2.0),
            new THREE.Vector3(-0.8, -0.7, 0.0),
            new THREE.Vector3(0.6, 0.5, 2.0),
            new THREE.Vector3(0, 0, 4.5)
          ];
          const sparkGeo = new THREE.BufferGeometry().setFromPoints(sparkPts);
          const sparkMat = new THREE.LineBasicMaterial({
            color: 0xff33bb,
            transparent: true,
            opacity: 0.325,
            blending: THREE.AdditiveBlending
          });
          const sparkLine = new THREE.Line(sparkGeo, sparkMat);
          sparkLine.raycast = () => {};
          pulseGroup.add(sparkLine);

          const pHalo = new THREE.Mesh(pulseHaloGeo, pulseHaloMat);
          pHalo.raycast = () => {};
          pulseGroup.add(pHalo);
          cosmicWebGroup.add(pulseGroup);

          const pulseItem = {
            mesh: pulseGroup,
            curve: boltCurve,
            progress: fRand(),
            speed: 0.0014 + fRand() * 0.0022,
            sparkMat: sparkMat,
            haloMat: pulseHaloMat
          };
          filamentFlowParticles.push(pulseItem);
          window._filamentPulses.push(pulseItem);
        }
      }

      // 4. Connect Supercluster Nodes with Adaptive Radial Thresholds across Inner, Mid, and Deep Horizon Shells
      const connectedPairs = new Set();
      for (let i = 0; i < nodes.length; i++) {
        const rA = nodes[i].length();
        for (let j = i + 1; j < nodes.length; j++) {
          const rB = nodes[j].length();
          const maxR = Math.max(rA, rB);
          const dist = nodes[i].distanceTo(nodes[j]);

          // Scale connection span with radial depth so both inner and deep-horizon shells form a continuous web
          const minSpan = maxR < 2200 ? 240 : (maxR < 5200 ? 480 : 650);
          const maxSpan = maxR < 2200 ? 640 : (maxR < 5200 ? 1580 : 2250);

          if (dist > minSpan && dist < maxSpan) {
            connectedPairs.add(`${i}-${j}`);
            addFractalConduit(nodes[i], nodes[j], dist);
          }
        }
      }

      // Ensure every deep catalog anchor (GN-z11, Earendel, TON 618, SMACS 0723, El Gordo, Shapley, etc.)
      // has at least 3 direct cosmic web filament conduits connecting it into the broader network
      anchorVectors.forEach(anchorPt => {
        const anchorIdx = nodes.indexOf(anchorPt);
        const candidates = [];
        for (let k = 0; k < nodes.length; k++) {
          if (k === anchorIdx) continue;
          const d = anchorPt.distanceTo(nodes[k]);
          if (d > 180) candidates.push({ idx: k, dist: d });
        }
        candidates.sort((a, b) => a.dist - b.dist);
        for (let c = 0; c < Math.min(3, candidates.length); c++) {
          const otherIdx = candidates[c].idx;
          const key = anchorIdx < otherIdx ? `${anchorIdx}-${otherIdx}` : `${otherIdx}-${anchorIdx}`;
          if (!connectedPairs.has(key)) {
            connectedPairs.add(key);
            addFractalConduit(anchorPt, nodes[otherIdx], candidates[c].dist);
          }
        }
      });

      function makeSubtleNodeSprite(rgbaColor, scaleSize) {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0.0, rgbaColor);
        grad.addColorStop(0.4, rgbaColor);
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(scaleSize, scaleSize, 1.0);
        return sprite;
      }

      // 5. Subtle Supercluster Intersection Nodes (scaled gently for deep-horizon visibility)
      nodes.forEach(pt => {
        const rScale = pt.length() > 2500 ? 2.2 : 1.0;
        const outerAura = makeSubtleNodeSprite('rgba(232, 121, 249, 0.18)', 9.0 * rScale);
        outerAura.position.copy(pt);
        outerAura.raycast = () => {};
        cosmicWebGroup.add(outerAura);

        const hotCore = makeSubtleNodeSprite('rgba(253, 242, 248, 0.32)', 3.8 * rScale);
        hotCore.position.copy(pt);
        hotCore.raycast = () => {};
        cosmicWebGroup.add(hotCore);
      });

      cosmicWebGroup.visible = typeof isCosmicWebVisible !== 'undefined' ? isCosmicWebVisible : true;
      scene.add(cosmicWebGroup);
    }

    function buildDelicateAuroraCMB() {
      // Expanded from 2,150 to 8,650 so all celestial objects (furthest at ~7,744 units) dwell within the Observable Universe border
      const radius = 8650;
      const geometry = new THREE.SphereGeometry(radius, 128, 96);
      const count = geometry.attributes.position.count;
      const colors = new Float32Array(count * 3);

      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      cmbColorsAttribute = geometry.attributes.color;

      cmbMaterial = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.BackSide,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,

      cmbSphere = new THREE.Mesh(geometry, cmbMaterial);
      cmbSphere.raycast = () => {};
      cmbSphere.visible = true;
      scene.add(cmbSphere);
    }

    function updateCMBThermalAcoustics(timeSec) {
      if (!cmbSphere || cmbMaterial.opacity <= 0.002 || !cmbColorsAttribute) return;

      const pos = cmbSphere.geometry.attributes.position;
      const colors = cmbColorsAttribute.array;
      const count = pos.count;
      const t = timeSec * 0.30;

      for (let i = 0; i < count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        // Scaled spatial frequencies for the 8,650-unit Observable Universe border sphere
        const w1 = Math.sin(x * 0.0025 + t) * Math.cos(y * 0.0025);
        const w2 = Math.sin(y * 0.0035 - t * 0.75) * Math.cos(z * 0.0035);
        const w3 = Math.cos(z * 0.0050 + t * 0.4) * Math.sin(x * 0.0050);
        const anisotropy = (w1 + w2 + w3) / 3.0;

        const i3 = i * 3;
        if (anisotropy > 0.12) {
          const factor = (anisotropy - 0.12) * 1.8;
          colors[i3] = 0.0;
          colors[i3 + 1] = 0.55 * factor;
          colors[i3 + 2] = 0.75 * factor;
        } else if (anisotropy < -0.12) {
          const factor = (-anisotropy - 0.12) * 1.6;
          colors[i3] = 0.32 * factor;
          colors[i3 + 1] = 0.10 * factor;
          colors[i3 + 2] = 0.60 * factor;
        } else {
          colors[i3] = 0.0;
          colors[i3 + 1] = 0.0;
          colors[i3 + 2] = 0.0;
        }
      }

      cmbColorsAttribute.needsUpdate = true;
    }

    function getOumuamuaPosition(t) {
      const x = 6.8 * Math.sinh(t);
      const z = 9.2 * Math.cosh(t) - 1.2;
      const y = x * 0.65 + Math.sin(t) * 2.8;
      return new THREE.Vector3(x, y, z);
    }

    function renderCatalogNodes() {

        } else if (item.id === "jupiter") {

        } else if (item.id === "mars") {

        } else if (item.id === "uranus") {

        } else if (item.id === "neptune") {
          material = new THREE.MeshBasicMaterial({ map: createProceduralTexture('neptune') });
        } else if (item.id === "ceres") {
          material = new THREE.MeshBasicMaterial({ color: 0xd1d5db });
        } else if (item.id === "oumuamua") {
          geometry = new THREE.SphereGeometry(1.0, 96, 64);
          const posAttr = geometry.attributes.position;
          const S = item.size; // 0.28
          for (let i = 0; i < posAttr.count; i++) {
            const ux = posAttr.getX(i);
            const uy = posAttr.getY(i);
            const uz = posAttr.getZ(i);

            // Azimuth around the horizontal XZ perimeter for scalloped lobes (Screenshot 6.17.13 PM)
            const az = Math.atan2(uz, ux);
            const rHoriz = Math.sqrt(ux * ux + uz * uz);

            // 7 deep V-shaped radial clefts carving rounded lobes around the perimeter (Screenshot 6.17.13 PM)
            const lobeWave = Math.abs(Math.sin(az * 3.5 + 0.35 * Math.sin(az * 2.0)));
            const cleftGroove = (1.0 - Math.pow(lobeWave, 0.48)) * 0.22 * Math.pow(rHoriz, 0.75);

            // Asymmetric tapering along major X axis: chiseled prow (-X) & terraced tail (+X) (Screenshot 6.17.48 PM)
            const prowTaper = (ux < 0)
              ? (1.0 - 0.32 * Math.pow(-ux, 1.65))
              : (1.0 - 0.24 * Math.pow(ux, 1.35) - 0.06 * Math.floor(ux * 3.5));

            // Longitudinal striated ridges & diagonal side crevasses (Screenshot 6.17.48 PM)
            const striations = Math.sin(uz * 22.0 + ux * 6.0 + Math.sin(ux * 10.0) * 1.4) * 0.048;
            const crag1 = Math.sin(ux * 9.5 + uy * 7.2) * Math.cos(uz * 11.0 - ux * 5.4) * 0.065;
            const crag2 = Math.sin(ux * 21.0 - uz * 19.0 + uy * 15.0) * 0.028;
            const diagCrevasse = Math.exp(-Math.pow((ux * 0.85 + uy * 0.55 + 0.18) * 9.5, 2.0)) * 0.11
                               + Math.exp(-Math.pow((ux * 0.75 - uy * 0.60 - 0.22) * 10.5, 2.0)) * 0.09;

            // Prominent dorsal impact crater basin with raised rim on upper +Y surface (both screenshots)
            let craterDisp = 0.0;
            if (uy > 0.05) {
              const dxC = (ux + 0.12) / 0.28;
              const dzC = (uz - 0.03) / 0.24;
              const dC = Math.sqrt(dxC * dxC + dzC * dzC);
              if (dC < 0.88) {
                const nC = dC / 0.88;
                craterDisp = -(1.0 - nC * nC) * 0.38;
              } else if (dC < 1.32) {
                const rimPhase = ((dC - 0.88) / 0.44) * Math.PI;
                craterDisp = Math.sin(rimPhase) * 0.11;
              }
            }

            const radialMod = Math.max(0.42, 1.0 - cleftGroove + striations + crag1 + crag2 - diagCrevasse);
            const px = ux * S * 3.35 * (0.88 + 0.12 * radialMod);
            const pz = uz * S * 1.52 * prowTaper * radialMod;
            const py = (uy * (0.82 + 0.24 * radialMod) + craterDisp) * S * 0.54 * prowTaper;

            posAttr.setXYZ(i, px, py, pz);
          }
          geometry.computeVertexNormals();
          material = new THREE.MeshBasicMaterial({ color: 0xb93822 });
        } else if (item.id === "eagle-nebula") {
          material = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.85 });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData = item;

        if (item.id === "sun") {
          sunMeshRef = mesh;
        }

        if (item.id === "uranus") {
          mesh.rotation.z = (97.77 * Math.PI) / 180;
          const uranusRingGeo = new THREE.RingGeometry(item.size * 1.5, item.size * 1.9, 32);
          const uranusRingMat = new THREE.MeshBasicMaterial({
            color: 0x93c5fd,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.35
          });
          const uranusRing = new THREE.Mesh(uranusRingGeo, uranusRingMat);
          uranusRing.rotation.x = Math.PI / 2;
          uranusRing.raycast = () => {};
          mesh.add(uranusRing);
        }

        if (item.id === "sun") {
          const glow = makeFractalNodeSprite('rgba(251, 191, 36, 0.85)', item.size * 4.5);
          mesh.add(glow);
        } else if (item.id === "oumuamua") {
          // Faint ice-blue sublimating volatile / nitrogen outgassing mist (Screenshot 6.17.13 PM)
          const outgasTex = createProceduralCloudTexture((ctx, s) => {
            const cx = s * 0.5, cy = s * 0.5;
            const g = ctx.createRadialGradient(cx, cy, s * 0.04, cx, cy, s * 0.48);
            g.addColorStop(0.0, "rgba(186, 230, 253, 0.42)");
            g.addColorStop(0.38, "rgba(125, 211, 252, 0.22)");
            g.addColorStop(0.72, "rgba(56, 189, 248, 0.08)");
            g.addColorStop(1.0, "rgba(0, 0, 0, 0.0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, s * 0.48, 0, Math.PI * 2);

          }, 128);
          const outgasSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: outgasTex,

          outgasSprite.scale.set(item.size * 6.2, item.size * 7.5, 1);
          outgasSprite.raycast = () => {};

        } else if (item.id === "stephenson-2-18") {

          // 4. Volumetric White-Blue & Golden Magnetic Reconnection Plasma Flares on Inner Disk (SS4)
          const flareCloudTex = createProceduralCloudTexture((ctx, s) => {

            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 0.48);
            grad.addColorStop(0.0, "rgba(255, 255, 255, 1.0)");

            }));

            sagAPlasmaFlares.push({

          scene.add(sagAGroup);
          celestialObjects.push(shadowMesh);
          rotatableObjects.push(shadowMesh);

        }

        const isPlanetaryOrbiter = item.tier === 1 && !["sun", "moon", "sedna", "halley-comet", "oumuamua"].includes(item.id);

        if (isPlanetaryOrbiter) {
          const orbitRadius = Math.sqrt(item.position[0]**2 + item.position[2]**2);
          const nov2026HeliocentricDeg = {

          const eclipDeg = (nov2026HeliocentricDeg[item.id] !== undefined)

            : (index * 137.5) % 360;
          const startAngle = ((195.0 - eclipDeg) * Math.PI) / 180.0;

                                    (item.id === "uranus") ? -0.006 :
                                    (item.id === "jupiter" || item.id === "saturn") ? 0.009 : 0.005;

          const orbitalSpeed = (0.04 / Math.pow(orbitRadius, 0.7));
          orbitingPlanets.push({

          const orbitCurve = new THREE.EllipseCurve(0, 0, orbitRadius, orbitRadius);

          const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints.map(p => new THREE.Vector3(p.x, p.y * 0.0, p.y)));
          const orbitMat = new THREE.LineBasicMaterial({

        } else {
          applyCosmicDepthProportions(item);
        mesh.position.set(item.position[0], item.position[1], item.position[2]);

          if (item.id === "halley-comet") {

            const cometMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 });
            const cometLine = new THREE.Line(cometGeo, cometMat);

          } else if (item.id === "oumuamua") {

            for (let t = -2.2; t <= 2.2; t += 0.05) {

    // === NASA EYES MINIMALIST PRIMARY NAME LABELS & ORBITAL TRACKING ===
    function getPrimaryCelestialName(data) {
      if (!data) return "";
      const id = (data.id || "").toLowerCase();
      if (PRIMARY_CELESTIAL_NAMES[id]) return PRIMARY_CELESTIAL_NAMES[id];
      const raw = data.name || data.title || "";
      return raw
        .replace(/\s*\([^)]*\)/g, "")
        .replace(/\s*&\s*Pulsar/gi, "")
        .replace(/^(?:The\s+|\d+\s+|\d+[A-Z]\/)/i, "")
        .trim()
        .toUpperCase();
    }

    function buildCelestialObjectLabels() {
      const layer = document.getElementById("celestial-labels-layer");
      if (!layer) return;
      layer.innerHTML = "";
      celestialLabelEntries = [];
      celestialLabelById.clear();

      celestialObjects.forEach((mesh) => {
        if (!mesh || !mesh.userData) return;
        const data = mesh.userData;
        const primaryName = getPrimaryCelestialName(data);
        if (!primaryName) return;

        const id = (data.id || "").toLowerCase();
        const el = document.createElement("div");
        el.className = MINOR_CELESTIAL_LABEL_IDS.has(id)
          ? "celestial-label celestial-label--minor"
          : "celestial-label";
        el.style.display = "none";
        el.textContent = primaryName;
        el.dataset.objectId = id;

        el.addEventListener("pointerenter", () => {
          hoveredCelestialMesh = mesh;
        });
        el.addEventListener("pointerleave", () => {
          if (hoveredCelestialMesh === mesh) hoveredCelestialMesh = null;
        });
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          activeTargetMesh = mesh;
          openInspector(data);
          smoothFlyToTarget();
        });

        layer.appendChild(el);
        const entry = {
          mesh: mesh,
          data: data,
          id: id,
          tier: Number(data.tier) || 1,
          el: el,
          visible: false,
          sx: 0,
          sy: 0,
          offsetX: 10,
          alpha: 1
        };
        celestialLabelEntries.push(entry);
        celestialLabelById.set(id, entry);
      });
    }

    function updateCelestialLabels(camDist) {
      if (!areLabelsVisible || !celestialLabelEntries.length) return;
      scene.updateMatrixWorld();

      const halfW = window.innerWidth * 0.5;
      const halfH = window.innerHeight * 0.5;
      const fovTan = Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5);

      for (let i = 0; i < celestialLabelEntries.length; i++) {
        const entry = celestialLabelEntries[i];
        const mesh = entry.mesh;

        if (!isNodeVisible(mesh)) {
          if (entry.visible) {
            entry.el.style.display = "none";
            entry.visible = false;
          }
          continue;
        }

        mesh.getWorldPosition(_labelWorldPos);
        _labelProjVec.copy(_labelWorldPos).project(camera);

        // Hide if behind the camera or outside screen bounds
        if (
          _labelProjVec.z > 1.0 ||
          _labelProjVec.z < -1.0 ||
          _labelProjVec.x < -1.06 ||
          _labelProjVec.x > 1.06 ||
          _labelProjVec.y < -1.06 ||
          _labelProjVec.y > 1.06
        ) {
          if (entry.visible) {
            entry.el.style.display = "none";
            entry.visible = false;
          }
          continue;
        }

        const distToCam = camera.position.distanceTo(_labelWorldPos);
        const isFocusedOrHovered = (activeTargetMesh === mesh || hoveredCelestialMesh === mesh);

        // Compute scale-aware opacity so labels remain clean and uncluttered across zoom regimes
        let alpha = 0.9;
        if (manualTierLock !== 0) {
          alpha = 0.92;
        } else if (entry.tier === 1) {
          if (entry.id === "sun") {
            alpha = camDist > 420 ? Math.max(0.45, 1.0 - (camDist - 420) / 900) : 0.95;
          } else if (camDist <= 145) {
            alpha = 0.9;
          } else if (camDist < 235) {
            alpha = 0.9 * (1.0 - (camDist - 145) / 90.0);
          } else {
            alpha = 0.0;
          }
        } else if (entry.id === "toliman" || entry.id === "proxima-centauri" || entry.id === "sirius-b") {
          if (distToCam <= 230) {
            alpha = 0.85;
          } else if (distToCam < 340) {
            alpha = 0.85 * (1.0 - (distToCam - 230) / 110.0);
          } else {
            alpha = 0.0;
          }
        } else {
          // Tier 2, 3, 4 primary objects: completely hidden when camera is inside inner Solar System, softly fading in when zooming out to stellar/galactic tiers
          if (camDist < 130) {
            alpha = 0.0;
          } else if (camDist < 360) {
            alpha = entry.tier === 2 ? 0.85 : 0.0;
          } else {
            alpha = 0.88;
          }
        }

        if (isFocusedOrHovered) {
          alpha = 1.0;
        }

        if (alpha <= 0.02) {
          if (entry.visible) {
            entry.el.style.display = "none";
            entry.visible = false;
          }
          continue;
        }

        const pxPerUnit = halfH / Math.max(0.1, fovTan * distToCam);
        const apparentRadiusPx = (entry.data.size || 0.5) * pxPerUnit;
        entry.offsetX = Math.max(8, Math.min(34, apparentRadiusPx + 7));
        entry.sx = (_labelProjVec.x * 0.5 + 0.5) * window.innerWidth;
        entry.sy = (-_labelProjVec.y * 0.5 + 0.5) * window.innerHeight;
        entry.alpha = alpha;

        if (!entry.visible) {
          entry.el.style.display = "block";
          entry.visible = true;
        }
        entry.el.classList.toggle("celestial-label--active", isFocusedOrHovered);
      }

      // Smoothly separate close orbital companion pairs (Earth/Moon, Alpha Centauri A/B, Sirius A/B) when passing at the same screen Y
      const companionPairs = [
        ["earth", "moon"],
        ["rigil-kentaurus", "toliman"],
        ["sirius", "sirius-b"]
      ];
      for (let p = 0; p < companionPairs.length; p++) {
        const primary = celestialLabelById.get(companionPairs[p][0]);
        const companion = celestialLabelById.get(companionPairs[p][1]);
        if (primary && companion && primary.visible && companion.visible) {
          const dx = Math.abs((companion.sx + companion.offsetX) - (primary.sx + primary.offsetX));
          const dy = Math.abs(companion.sy - primary.sy);
          if (dx < 76 && dy < 15) {
            const overlap = (1.0 - dx / 76.0) * (1.0 - dy / 15.0);
            primary.sy -= 5.5 * overlap;
            companion.sy += 6.5 * overlap;
          }
        }
      }

      for (let i = 0; i < celestialLabelEntries.length; i++) {
        const entry = celestialLabelEntries[i];
        if (!entry.visible) continue;
        const finalX = entry.sx + entry.offsetX;
        const finalY = entry.sy;
        entry.el.style.transform = `translate3d(${finalX.toFixed(1)}px, ${finalY.toFixed(1)}px, 0) translateY(-50%)`;
        entry.el.style.opacity = entry.alpha.toFixed(3);
      }
    }

    function isNodeVisible(obj) {
      let cur = obj;
      while (cur) {
        if (cur.visible === false) return false;
        cur = cur.parent;
      }
      return true;
    }

    function resolveTargetData(obj) {
      let cur = obj;
      while (cur) {
        if (cur.userData && cur.userData.id) {
          return { data: cur.userData, rootMesh: cur };
        }
        cur = cur.parent;
      }
      return null;
    }

    function onPointerMove(event) {
      const bootOverlay = document.getElementById('nova-boot-overlay');
      if (document.documentElement.classList.contains('is-booting') || (bootOverlay && !bootOverlay.classList.contains('boot-completed') && bootOverlay.style.display !== 'none')) {
        hoveredCelestialMesh = null;
        return;
      }
      // Do not strip hover if pointer is directly over a celestial label or interactive HUD element
      const overLabelOrHud = event.target && event.target.closest && event.target.closest('.celestial-label, button, a, input, select, [role="button"], .interactive, #nova-portal-o');
      if (overLabelOrHud) {
        document.body.classList.add('nova-cursor-hover');
        return;
      }

      const inspectorEl = document.getElementById('inspector');
      const isSidebarOpen = inspectorEl && !inspectorEl.classList.contains('translate-x-[430px]');
      const rightLimit = isSidebarOpen ? window.innerWidth - 410 : window.innerWidth;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const visibleCandidates = celestialObjects.filter(obj => isNodeVisible(obj));
      const intersects = raycaster.intersectObjects(visibleCandidates, true);

      if (event.clientX < rightLimit) {
        for (let i = 0; i < intersects.length; i++) {
          const resolved = resolveTargetData(intersects[i].object);
          if (resolved && resolved.data && resolved.data.name) {
            hoveredCelestialMesh = resolved.rootMesh;
            document.body.classList.add('nova-cursor-hover');
            return;
          }
        }

        // Screen-space proximity fallback so small/distant 3D bodies (Mercury, Ceres, Oumuamua, Uranus, stars) always highlight reliably
        let closestMesh = null;
        let closestDist = 18; // 18px screen hit radius around any visible object center
        const projVec = new THREE.Vector3();
        for (let i = 0; i < visibleCandidates.length; i++) {
          const obj = visibleCandidates[i];
          const resolved = resolveTargetData(obj);
          if (!resolved || !resolved.data || !resolved.data.name) continue;
          obj.getWorldPosition(projVec);
          projVec.project(camera);
          if (projVec.z > -1 && projVec.z < 1) {
            const sx = (projVec.x * 0.5 + 0.5) * window.innerWidth;
            const sy = (-projVec.y * 0.5 + 0.5) * window.innerHeight;
            const d = Math.hypot(event.clientX - sx, event.clientY - sy);
            if (d < closestDist) {
              closestDist = d;
              closestMesh = resolved.rootMesh;
            }
          }
        }
        if (closestMesh) {
          hoveredCelestialMesh = closestMesh;
          document.body.classList.add('nova-cursor-hover');
          return;
        }
      }

      hoveredCelestialMesh = null;
      document.body.classList.remove('nova-cursor-hover');
    }

    function onPointerDown(event) {
      const bootOverlay = document.getElementById('nova-boot-overlay');
      if (document.documentElement.classList.contains('is-booting') || (bootOverlay && !bootOverlay.classList.contains('boot-completed') && bootOverlay.style.display !== 'none')) return;
      if (event.target && event.target.closest && event.target.closest('#nova-boot-overlay, #nova-portal-o, header, footer, aside, #cosmic-tour-hud, button, input, .celestial-label')) return;
      const inspectorEl = document.getElementById('inspector');
      const isSidebarOpen = inspectorEl && !inspectorEl.classList.contains('translate-x-[430px]');
      if (event.clientY < 60 || (isSidebarOpen && event.clientX > window.innerWidth - 410)) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const visibleCandidates = celestialObjects.filter(obj => isNodeVisible(obj));
      const intersects = raycaster.intersectObjects(visibleCandidates, true);

      for (let i = 0; i < intersects.length; i++) {
        const resolved = resolveTargetData(intersects[i].object);
        if (resolved && resolved.data && resolved.data.id) {
          activeTargetMesh = resolved.rootMesh;
          openInspector(resolved.data);
          smoothFlyToTarget();
          return;
        }
      }

      if (hoveredCelestialMesh) {
        const resolved = resolveTargetData(hoveredCelestialMesh);
        if (resolved && resolved.data && resolved.data.id) {
          activeTargetMesh = resolved.rootMesh;
          openInspector(resolved.data);
          smoothFlyToTarget();
        }
      }
    }

    window.smoothFlyToTarget = function(durationMs = 2600) {
      if (!activeTargetMesh) return;

      TWEEN.removeAll();
      isFlyingToTarget = true;

      const startCamPos = camera.position.clone();
      const startTargetPos = controls.target.clone();

      
      const objRadius = (activeTarget && activeTarget.size) ? activeTarget.size : 1.0;
      const targetId = (activeTarget && activeTarget.id) ? activeTarget.id.toLowerCase() : '';
      const targetType = (activeTarget && activeTarget.type) ? activeTarget.type.toLowerCase() : '';
      const targetTier = (activeTarget && activeTarget.tier) ? activeTarget.tier : 1;

      // Keep planets, moons, and compact stars at 3.2x, but pull back for large structures
      let multiplier = 3.2;

      if (targetId === 'sagittarius-a-star') {
        multiplier = 6.2;
      } else if (['milky-way', 'andromeda', 'sombrero-galaxy', 'ton-618', 'messier-87'].includes(targetId)) {
        // Massive spiral disks, quasars & galactic cores (matches your 9.44.52 PM target screenshot)
        multiplier = 13.5;
      } else if (['eagle-nebula', 'orion-nebula', 'el-gordo', 'shapley-supercluster', 'great-attractor', 'bootes-void'].includes(targetId)) {
        // Expansive volumetric nebulae & superclusters
        multiplier = 9.5;
      } else if (['centaurus-a', 'crab-nebula', 'lmc', 'smc', 'smacs-0723', 'gn-z11', 'triangulum', 'pillars-of-creation'].includes(targetId)) {
        // Medium-large galaxies & supernova remnants
        multiplier = 7.5;
      } else if (targetType.includes('galaxy') || targetType.includes('cluster') || targetType.includes('nebula') || targetType.includes('quasar') || targetType.includes('void') || targetTier >= 3) {
        // Catch-all for any other deep-space galaxy/cluster/nebula
        multiplier = 9.0;
      } else if (objRadius >= 3.0 && targetId !== 'sun') {
        // Large supergiant stars or oversized bodies
        multiplier = 6.0;
      }

      const baseDist = Math.max(objRadius * multiplier, 4.2);
      const offsetDist = baseDist;



      const viewDir = startCamPos.clone().sub(startTargetPos);
      if (viewDir.lengthSq() < 0.001) viewDir.set(0.6, 0.3, 0.8);
      viewDir.normalize();

      // Balanced close-up elevation (head-on relativistic framing for Sagittarius A*)
      const offsetVec = (targetId === 'sagittarius-a-star')
        ? new THREE.Vector3(0, offsetDist * 0.08, offsetDist)
        : new THREE.Vector3(
            viewDir.x * offsetDist,
            Math.max(offsetDist * 0.28, 1.4),
            viewDir.z * offsetDist
          );

      const tweenObj = { t: 0 };
      new TWEEN.Tween(tweenObj)
        .to({ t: 1 }, durationMs)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => {
          if (!activeTargetMesh) return;
          const currentWorldPos = new THREE.Vector3();
          activeTargetMesh.getWorldPosition(currentWorldPos);

          const desiredEndCam = currentWorldPos.clone().add(offsetVec);
          camera.position.lerpVectors(startCamPos, desiredEndCam, tweenObj.t);
          controls.target.lerpVectors(startTargetPos, currentWorldPos, tweenObj.t);
          lastTrackedTargetPos.copy(currentWorldPos);
        })
        .onComplete(() => {
          isFlyingToTarget = false;
          if (activeTargetMesh) {
            activeTargetMesh.getWorldPosition(lastTrackedTargetPos);
          }
        })
        .start();
    };
