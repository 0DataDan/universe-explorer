    function splitMetricValue(rawVal, label) {
      const str = String(rawVal || "").trim();
      const parenMatch = str.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
      if (parenMatch) {
        return {
          primary: parenMatch[1].trim(),
          relative: parenMatch[2].trim()

      // If no parenthetical exists, provide intelligent astronomical context where possible
      return {

        if (!window._isTourActiveCached) return 1.0;
        if (window._isZoomingSurfaceAnim) return 1.0;
        const elapsedSinceStep = (origPerfNow() - (window._tourBeatState.stepStartTime || 0)) / 1000.0;
        if (elapsedSinceStep < 2.3) return 1.0; // Allow camera fly-to animation to run at full speed
        return 0.0; // Freeze orbital motion once camera arrives at the tour stop so planet & camera stay 100% still!
      }

      Date.now = function() {
        const real = origDateNow();
        const dt = real - lastRealDate;
        lastRealDate = real;
        virtualDate += dt * getSimTimeScale();
        return Math.round(virtualDate);
      };

      // Prevent clicking on the 3D canvas object during the Guided Tour from triggering a new camera fly-to / orbit spin!
      window.addEventListener("pointerdown", function(e) {
        if (!window._isTourActiveCached) return;
        const t = e.target;
        if (t && t.tagName && t.tagName.toLowerCase() === "canvas") {
          window._canvasDownPos = { x: e.clientX, y: e.clientY };
        }
      }, true);

      window.addEventListener("click", function(e) {
        if (!window._isTourActiveCached) return;
        const t = e.target;
        if (t && t.tagName && t.tagName.toLowerCase() === "canvas") {
          const down = window._canvasDownPos || { x: e.clientX, y: e.clientY };
          const moveDist = Math.hypot(e.clientX - down.x, e.clientY - down.y);
          // If it was a click (not a drag), block the raycaster click handler so the camera doesn't zoom/spin around the object!
          if (moveDist < 8) {
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }
      }, true);

      window.addEventListener("mouseup", function(e) {
        if (!window._isTourActiveCached) return;
        const t = e.target;
        if (t && t.tagName && t.tagName.toLowerCase() === "canvas") {
          const down = window._canvasDownPos || { x: e.clientX, y: e.clientY };
          const moveDist = Math.hypot(e.clientX - down.x, e.clientY - down.y);
          if (moveDist < 6) {
            // Prevent mouseup raycast re-focus during tour while keeping OrbitControls state clean
            e.stopPropagation();
          }
        }
      }, true);
    })();

    function nowMs() {
      return window._realNow ? window._realNow() : performance.now();
    }

    function isGuidedTourCurrentlyActive() {
      const card = document.getElementById("spatial-callout-card");
      if (!card) {
        window._isTourActiveCached = false;
        return false;
      }
      const cardRect = card.getBoundingClientRect();
      if (cardRect.width < 50 || cardRect.height < 40) {
        window._isTourActiveCached = false;
        return false;
      }

      const allEls = card.querySelectorAll("div, span");
      for (let i = 0; i < allEls.length; i++) {
        const txt = (allEls[i].textContent || "").trim();
        if (/^\d+\s*\/\s*\d{2}$/.test(txt)) {
          const r = allEls[i].getBoundingClientRect();
          if (r.width > 5 && r.height > 5) {
            window._isTourActiveCached = true;
            return true;
          }
        }
      }
      window._isTourActiveCached = false;
      return false;
    }

    function isOverviewHudEnabled() {
      if (window.inspectorVisible === false || window.hudVisible === false || window._overviewHudHidden === true) {
        return false;
      }
      const mainLayer = document.getElementById("spatial-telemetry-layer");
      const mainCard = document.getElementById("spatial-callout-card");
      if (!mainLayer || !mainCard) return false;
      if (mainLayer.classList.contains("hidden") || mainCard.classList.contains("hidden")) return false;

      const lStyle = window.getComputedStyle(mainLayer);
      const cStyle = window.getComputedStyle(mainCard);
      if (lStyle.display === "none" || cStyle.display === "none" || lStyle.visibility === "hidden" || cStyle.visibility === "hidden") {
        return false;
      }
      return true;
    }

    // ============================================================================
    // NOVA 3D SCENE DEPTH ENGINE + CORONA-AWARE PRE-RENDER OCCLUSION
    // ============================================================================
    window._novaDepthEngineInitialized = false;
    window._novaAsteroidBelts = [];
    window._novaOrbitShaderLines = [];
    window._hiddenForThisFrame = [];
    window._activeScreenOccluders = [];

    function hideObjectAndAssociatedVisuals(obj) {
      if (!obj || !obj.visible) return;
      window._hiddenForThisFrame.push(obj);
      obj.visible = false;
    }

    function removeOldBeltMeshes(sc) {
      const toRemove = [];
      sc.traverse(function(o) {
        if (o.name === "nova-instanced-belt" || o.name === "nova-belt-dust-glow") {
          toRemove.push(o);
        }
      });
      for (let i = 0; i < toRemove.length; i++) {
        if (toRemove[i].parent) toRemove[i].parent.remove(toRemove[i]);
      }
    }

    function getPlanetAtmosphericColor(id) {
      const k = String(id || "").toLowerCase();
      if (k.indexOf("earth") !== -1) return new THREE.Color(0x38bdf8);
      if (k.indexOf("venus") !== -1) return new THREE.Color(0xfbbf24);
      if (k.indexOf("mars") !== -1) return new THREE.Color(0xf97316);
      if (k.indexOf("jupiter") !== -1) return new THREE.Color(0xfde68a);
      if (k.indexOf("saturn") !== -1) return new THREE.Color(0xfef08a);
      if (k.indexOf("uranus") !== -1) return new THREE.Color(0x67e8f9);
      if (k.indexOf("neptune") !== -1) return new THREE.Color(0x3b82f6);
      return new THREE.Color(0xcbd5e1);
    }

    function buildSunlitAsteroidBelt(sc, count, innerRad, outerRad, thicknessY, coreColorHex, highlightColorHex, opacityScale) {
      const positions = new Float32Array(count * 3);
      const aOrbitParams = new Float32Array(count * 4);
      const aVisualParams = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const u = (Math.random() + Math.random() + Math.random()) / 3.0;
        const r = innerRad + u * (outerRad - innerRad);
        const theta = Math.random() * Math.PI * 2.0;
        const speed = (0.24 / Math.pow(Math.max(1.0, r * 0.1), 1.35)) * (0.85 + Math.random() * 0.3);
        const yOff = (Math.random() - 0.5) * 2.0 * thicknessY * (0.35 + 0.65 * Math.random());

        positions[i * 3 + 0] = Math.cos(theta) * r;
        positions[i * 3 + 1] = yOff;
        positions[i * 3 + 2] = Math.sin(theta) * r;

        aOrbitParams[i * 4 + 0] = r;
        aOrbitParams[i * 4 + 1] = theta;
        aOrbitParams[i * 4 + 2] = speed;
        aOrbitParams[i * 4 + 3] = yOff;

        const sizeRoll = Math.pow(Math.random(), 4.0);
        aVisualParams[i * 3 + 0] = 1.15 + sizeRoll * 3.6;
        aVisualParams[i * 3 + 1] = 0.55 + Math.random() * 0.65;
        aVisualParams[i * 3 + 2] = Math.random() * 6.283;
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geom.setAttribute("aOrbitParams", new THREE.BufferAttribute(aOrbitParams, 4));
      geom.setAttribute("aVisualParams", new THREE.BufferAttribute(aVisualParams, 3));

      const vShader = [
        "attribute vec4 aOrbitParams;",
        "attribute vec3 aVisualParams;",
        "uniform float uTime;",
        "varying vec3 vWorldPos;",
        "varying float vAlbedo;",
        "void main() {",
        "  float r = aOrbitParams.x;",
        "  float ang = aOrbitParams.y + uTime * aOrbitParams.z;",
        "  float yOff = aOrbitParams.w;",
        "  vec3 localPos = vec3(",
        "    cos(ang) * r,",
        "    yOff + sin(ang * 2.0 + aVisualParams.z) * (yOff * 0.2),",
        "    sin(ang) * r",
        "  );",
        "  vec4 wp = modelMatrix * vec4(localPos, 1.0);",
        "  vWorldPos = wp.xyz;",
        "  vAlbedo = aVisualParams.y;",
        "  vec4 mvPos = viewMatrix * wp;",
        "  gl_Position = projectionMatrix * mvPos;",
        "  float dist = max(1.0, -mvPos.z);",
        "  gl_PointSize = clamp(aVisualParams.x * (42.0 / dist), 1.0, 5.5);",
        "}"
      ].join("\n");

      const fShader = [
        "uniform vec3 uCoreColor;",
        "uniform vec3 uHighlightColor;",
        "uniform float uOpacity;",
        "varying vec3 vWorldPos;",
        "varying float vAlbedo;",
        "void main() {",
        "  vec2 uv = gl_PointCoord * 2.0 - 1.0;",
        "  float r2 = dot(uv, uv);",
        "  if (r2 > 1.0) discard;",
        "  vec3 localNorm = normalize(vec3(uv.x, -uv.y, sqrt(max(0.0, 1.0 - r2))));",
        "  vec3 sunDir = normalize(-vWorldPos);",
        "  vec3 viewDir = normalize(cameraPosition - vWorldPos);",
        "  float phaseCos = dot(sunDir, viewDir) * 0.5 + 0.5;",
        "  float rockLight = clamp(0.35 + 0.65 * localNorm.z + 0.35 * localNorm.x, 0.2, 1.35);",
        "  float camDist = length(cameraPosition - vWorldPos);",
        "  float sunCamDist = length(cameraPosition);",
        "  float depthAtten = clamp(1.22 - (camDist / max(8.0, sunCamDist * 1.45)) * 0.52, 0.32, 1.18);",
        "  float macroFade = 1.0 - smoothstep(130.0, 250.0, camDist);",
        "  float closeupBoost = mix(2.1, 1.0, smoothstep(6.0, 22.0, camDist));",
        "  vec3 col = mix(uCoreColor, uHighlightColor, clamp(rockLight * 0.65 + phaseCos * 0.25, 0.0, 1.0));",
        "  col *= vAlbedo * depthAtten * (0.75 + 0.45 * rockLight);",
        "  float edgeSoft = smoothstep(1.0, 0.35, r2);",
        "  float alpha = clamp(uOpacity * closeupBoost * edgeSoft * macroFade * depthAtten, 0.0, 0.92);",
        "  if (alpha <= 0.01) discard;",
        "  gl_FragColor = vec4(col, alpha);",
        "}"
      ].join("\n");

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest: true,
        uniforms: {
          uTime: { value: 0.0 },
          uCoreColor: { value: new THREE.Color(coreColorHex) },
          uHighlightColor: { value: new THREE.Color(highlightColorHex) },
          uOpacity: { value: opacityScale }
        },
        vertexShader: vShader,
        fragmentShader: fShader
      });

      const pointsObj = new THREE.Points(geom, mat);
      pointsObj.frustumCulled = false;
      pointsObj.name = "nova-instanced-belt";
      sc.add(pointsObj);
      window._novaAsteroidBelts.push(pointsObj);

      const midRad = (innerRad + outerRad) * 0.5;
      const tubeRad = (outerRad - innerRad) * 0.48;
      const dustGeom = new THREE.TorusGeometry(midRad, tubeRad, 14, 96);
      dustGeom.rotateX(Math.PI * 0.5);
      dustGeom.scale(1.0, (thicknessY * 1.2) / Math.max(0.1, tubeRad), 1.0);
      const dustMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uDustColor: { value: new THREE.Color(highlightColorHex) },
          uBaseAlpha: { value: opacityScale * 0.045 }
        },
        vertexShader: [
          "varying vec3 vWPos;",
          "varying vec3 vWNorm;",
          "void main() {",
          "  vec4 wp = modelMatrix * vec4(position, 1.0);",
          "  vWPos = wp.xyz;",
          "  vWNorm = normalize(mat3(modelMatrix) * normal);",
          "  gl_Position = projectionMatrix * viewMatrix * wp;",
          "}"
        ].join("\n"),
        fragmentShader: [
          "uniform vec3 uDustColor;",
          "uniform float uBaseAlpha;",
          "varying vec3 vWPos;",
          "varying vec3 vWNorm;",
          "void main() {",
          "  vec3 viewDir = normalize(cameraPosition - vWPos);",
          "  float softEdge = pow(abs(dot(vWNorm, viewDir)), 1.75);",
          "  float camDist = length(cameraPosition - vWPos);",
          "  float fade = (1.0 - smoothstep(125.0, 240.0, camDist)) * smoothstep(5.0, 16.0, camDist);",
          "  gl_FragColor = vec4(uDustColor, uBaseAlpha * softEdge * fade);",
          "}"
        ].join("\n")
      });
      const dustMesh = new THREE.Mesh(dustGeom, dustMat);
      dustMesh.name = "nova-belt-dust-glow";
      sc.add(dustMesh);
      window._novaAsteroidBelts.push(dustMesh);
    }

    function upgradeOrbitLinesAndTerminators(sc, celObjs) {
      const planetByRadius = [];
      const tempP = new THREE.Vector3();

      for (let i = 0; i < celObjs.length; i++) {
        const m = celObjs[i];
        if (!m || !m.userData) continue;
        const id = String(m.userData.id || m.userData.name || m.name || "").toLowerCase();
        m.getWorldPosition(tempP);
        const r = Math.hypot(tempP.x, tempP.z);
        if (r > 1.2 && r < 140.0 && id !== "sun" && id !== "moon") {
          planetByRadius.push({ mesh: m, id: id, radius: r });
        }

        if (id !== "sun" && m.isMesh && m.material && m.userData._nasaTextured && !m.userData._terminatorEnhancedV2) {
          m.userData._terminatorEnhancedV2 = true;
          const atmoCol = getPlanetAtmosphericColor(id);
          const mats = Array.isArray(m.material) ? m.material : [m.material];
          mats.forEach(function(mat) {
            if (!mat || mat.isShaderMaterial) return;
            if (mat.emissiveIntensity !== undefined) {
              mat.emissiveIntensity = 0.04;
            }
            mat.onBeforeCompile = function(shader) {
              shader.uniforms.uSunPosition = { value: new THREE.Vector3(0, 0, 0) };
              shader.uniforms.uAtmoRimColor = { value: atmoCol };
              shader.vertexShader = "varying vec3 vNovaWorldPos;\nvarying vec3 vNovaWorldNormal;\n" + shader.vertexShader;
              shader.vertexShader = shader.vertexShader.replace(
                "#include <worldpos_vertex>",
                "#include <worldpos_vertex>\n  vNovaWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\n  vNovaWorldNormal = normalize(mat3(modelMatrix) * objectNormal);"
              );
              shader.fragmentShader = "uniform vec3 uSunPosition;\nuniform vec3 uAtmoRimColor;\nvarying vec3 vNovaWorldPos;\nvarying vec3 vNovaWorldNormal;\n" + shader.fragmentShader;
              shader.fragmentShader = shader.fragmentShader.replace(
                "#include <dithering_fragment>",
                [
                  "#include <dithering_fragment>",
                  "vec3 nSunDir = normalize(uSunPosition - vNovaWorldPos);",
                  "vec3 nViewDir = normalize(cameraPosition - vNovaWorldPos);",
                  "vec3 nNorm = normalize(vNovaWorldNormal);",
                  "float nSunDot = dot(nNorm, nSunDir);",
                  "float dayFactor = smoothstep(-0.16, 0.26, nSunDot);",
                  "gl_FragColor.rgb *= (0.10 + 0.98 * dayFactor);",
                  "float fresnel = pow(1.0 - max(0.0, dot(nNorm, nViewDir)), 2.9);",
                  "float sunlitCrescent = smoothstep(-0.10, 0.42, nSunDot);",
                  "gl_FragColor.rgb += uAtmoRimColor * fresnel * sunlitCrescent * 0.72;"
                ].join("\n")
              );
            };
            mat.needsUpdate = true;
          });
        }
      }

      sc.traverse(function(obj) {
        if ((obj.isLine || obj.isLineLoop) && obj.geometry && !obj.userData._orbitDepthUpgradedV2) {
          if (obj.geometry.boundingSphere === null) obj.geometry.computeBoundingSphere();
          const bRad = (obj.geometry.boundingSphere && obj.geometry.boundingSphere.radius) ? obj.geometry.boundingSphere.radius : 0;
          if (bRad < 2.0 || bRad > 135.0) return;

          obj.userData._orbitDepthUpgradedV2 = true;

          let matchedPlanet = null;
          let bestDiff = 999999;
          for (let p = 0; p < planetByRadius.length; p++) {
            const diff = Math.abs(planetByRadius[p].radius - bRad);
            if (diff < bestDiff && diff < 3.5) {
              bestDiff = diff;
              matchedPlanet = planetByRadius[p];
            }
          }

          const baseLineCol = matchedPlanet ? getPlanetAtmosphericColor(matchedPlanet.id) : new THREE.Color(0x94a3b8);
          const orbitMat = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            depthTest: true,
            uniforms: {
              uLineColor: { value: baseLineCol },
              uPlanetPos: { value: new THREE.Vector3(bRad, 0, 0) },
              uHasPlanet: { value: matchedPlanet ? 1.0 : 0.0 }
            },
            vertexShader: [
              "#include <common>",
              "#include <logdepthbuf_pars_vertex>",
              "varying vec3 vWorldPos;",
              "void main() {",
              "  vec4 wp = modelMatrix * vec4(position, 1.0);",
              "  vWorldPos = wp.xyz;",
              "  gl_Position = projectionMatrix * viewMatrix * wp;",
              "  #include <logdepthbuf_vertex>",
              "}"
            ].join("\n"),
            fragmentShader: [
              "#include <common>",
              "#include <logdepthbuf_pars_fragment>",
              "uniform vec3 uLineColor;",
              "uniform vec3 uPlanetPos;",
              "uniform float uHasPlanet;",
              "varying vec3 vWorldPos;",
              "void main() {",
              "  #include <logdepthbuf_fragment>",
              "  float distToCam = length(cameraPosition - vWorldPos);",
              "  float sunToCam = length(cameraPosition);",
              "  float depthRatio = clamp((sunToCam * 1.38 - distToCam) / max(8.0, sunToCam * 0.95), 0.0, 1.0);",
              "  float baseAlpha = mix(0.08, 0.44, depthRatio);",
              "  float trailBoost = 0.0;",
              "  if (uHasPlanet > 0.5) {",
              "    float angFragment = atan(vWorldPos.z, vWorldPos.x);",
              "    float angPlanet = atan(uPlanetPos.z, uPlanetPos.x);",
              "    float dAng = mod(angPlanet - angFragment + 6.2831853, 6.2831853);",
              "    if (dAng < 0.72) {",
              "      trailBoost = pow(1.0 - (dAng / 0.72), 1.75) * 0.62;",
              "    }",
              "  }",
              "  float macroFade = 1.0 - smoothstep(145.0, 270.0, distToCam);",
              "  vec3 finalCol = mix(vec3(0.75, 0.82, 0.92), uLineColor, 0.45 + trailBoost * 0.55);",
              "  float finalAlpha = (baseAlpha + trailBoost) * macroFade;",
              "  if (finalAlpha <= 0.01) discard;",
              "  gl_FragColor = vec4(finalCol, finalAlpha);",
              "}"
            ].join("\n")
          });

          obj.material = orbitMat;
          window._novaOrbitShaderLines.push({
            line: obj,
            planetMesh: matchedPlanet ? matchedPlanet.mesh : null
          });
        }
      });
    }

    function initAndStepNovaDepthEngine(sc, cam, celObjs, isSunFocusedOrZoomed) {
      if (!sc || !cam || !celObjs || celObjs.length < 8) return;
      if (!window._texturesInitialized) return;

      if (!window._novaDepthEngineInitialized) {
        let rMars = 0, rJupiter = 0, rNeptune = 0;
        const pVec = new THREE.Vector3();
        for (let i = 0; i < celObjs.length; i++) {
          const m = celObjs[i];
          if (!m || !m.userData) continue;
          const id = String(m.userData.id || m.userData.name || m.name || "").toLowerCase();
          m.getWorldPosition(pVec);
          const r = Math.hypot(pVec.x, pVec.z);
          if (id === "mars") rMars = r;
          else if (id === "jupiter") rJupiter = r;
          else if (id === "neptune") rNeptune = r;
        }

        if (rMars > 1.0 && rJupiter > rMars) {
          window._novaDepthEngineInitialized = true;
          removeOldBeltMeshes(sc);

          const beltInner = rMars + (rJupiter - rMars) * 0.22;
          const beltOuter = rMars + (rJupiter - rMars) * 0.78;
          const beltThick = (beltOuter - beltInner) * 0.14;
          buildSunlitAsteroidBelt(sc, 4500, beltInner, beltOuter, beltThick, 0x8c6d46, 0xfcd34d, 0.32);

          if (rNeptune > rJupiter) {
            const kInner = rNeptune * 1.05;
            const kOuter = rNeptune * 1.28;
            const kThick = (kOuter - kInner) * 0.16;
            buildSunlitAsteroidBelt(sc, 2800, kInner, kOuter, kThick, 0x475569, 0x7dd3fc, 0.50);
          }

          upgradeOrbitLinesAndTerminators(sc, celObjs);
        }
      }

      const simTimeSec = Date.now() * 0.001;
      for (let i = 0; i < window._novaAsteroidBelts.length; i++) {
        const beltObj = window._novaAsteroidBelts[i];
        if (!beltObj) continue;
        if (isSunFocusedOrZoomed) {
          window._hiddenForThisFrame.push(beltObj);
          beltObj.visible = false;
        } else if (beltObj.material && beltObj.material.uniforms && beltObj.material.uniforms.uTime) {
          beltObj.material.uniforms.uTime.value = simTimeSec;
        }
      }

      const pWorld = new THREE.Vector3();
      for (let i = 0; i < window._novaOrbitShaderLines.length; i++) {
        const item = window._novaOrbitShaderLines[i];
        if (item.line && item.planetMesh && item.line.material && item.line.material.uniforms) {
          item.planetMesh.getWorldPosition(pWorld);
          item.line.material.uniforms.uPlanetPos.value.copy(pWorld);
        }
      }
    }

    window._novaBeforeRender = function(sc, cam, celObjs, labelEntries, currentActiveTarget) {
      try {
        window._novaSceneRef = sc;
        window._novaCamRef = cam;
        window._hiddenForThisFrame = [];
        window._activeScreenOccluders = [];

        if (!sc || !cam || !celObjs || !celObjs.length) return;

        sc.updateMatrixWorld();

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const halfH = vh * 0.5;
        const fovTan = Math.tan(THREE.MathUtils.degToRad(cam.fov) * 0.5);
        const camPos = cam.position;

        const bodyRecords = [];
        const tempPos = new THREE.Vector3();
        const tempScale = new THREE.Vector3();

        for (let i = 0; i < celObjs.length; i++) {
          const mesh = celObjs[i];
          if (!mesh || !mesh.visible || !mesh.userData) continue;

          const id = String(mesh.userData.id || mesh.userData.name || mesh.name || "").toLowerCase();
          mesh.getWorldPosition(tempPos);
          mesh.getWorldScale(tempScale);
          const distToCam = camPos.distanceTo(tempPos);

          const proj = tempPos.clone().project(cam);
          if (proj.z <= 0 || proj.z >= 1.0) continue;

          const sx = (proj.x * 0.5 + 0.5) * vw;
          const sy = (-proj.y * 0.5 + 0.5) * vh;

          const baseSize = Number(mesh.userData.size) || 0.5;
          const scaleFactor = Math.max(tempScale.x, tempScale.y, tempScale.z);
          const worldRadius = baseSize * scaleFactor;

          const pxPerUnit = halfH / Math.max(0.1, fovTan * distToCam);
          const screenRadPx = worldRadius * pxPerUnit * (id === "sun" ? 1.02 : 1.04);

          bodyRecords.push({
            mesh: mesh,
            id: id,
            isSun: (id === "sun"),
            isFocused: (mesh === currentActiveTarget || mesh === window._spatialTargetMesh),
            worldPos: tempPos.clone(),
            worldRadius: worldRadius,
            distToCam: distToCam,
            sx: sx,
            sy: sy,
            screenRadPx: screenRadPx
          });
        }

        if (bodyRecords.length === 0) return;

        bodyRecords.sort(function(a, b) { return a.distToCam - b.distToCam; });

        for (let i = 0; i < bodyRecords.length; i++) {
          if (bodyRecords[i].screenRadPx > 8) {
            window._activeScreenOccluders.push(bodyRecords[i]);
          }
        }

        const sunRec = bodyRecords.find(function(b) { return b.isSun; });
     const isSunFocusedOrZoomed = Boolean(
       sunRec && (sunRec.screenRadPx > 130 || sunRec.distToCam < 18.0)
     );

     initAndStepNovaDepthEngine(sc, cam, celObjs, isSunFocusedOrZoomed);

     sc.traverse(function(obj) {
       if (!obj.visible || obj.isScene || obj.isCamera || obj.isLight || obj.isPoints) return;

       // Never hide Cosmic Web filaments during pre-render occlusion
       if (typeof cosmicWebGroup !== "undefined" && cosmicWebGroup) {
         let pCheck = obj;
         while (pCheck) {
           if (pCheck === cosmicWebGroup) return;
           pCheck = pCheck.parent;
         }
       }

       if ((obj.isLine || obj.isLineLoop || obj.isLineSegments) && isSunFocusedOrZoomed) {
         hideObjectAndAssociatedVisuals(obj);
         return;
       }

          if (obj.isMesh && !celObjs.includes(obj)) {
            if (obj.name === "nova-belt-dust-glow") return;
            let p = obj.parent;
            while (p && p !== sc) {
              if (celObjs.includes(p)) {

              }
              p = p.parent;

    window._getScreenPointOcclusionFactor = function(planetSx, planetSy, labelX, labelY, entryId, entryMesh) {
      if (!entryMesh || !entryMesh.visible) return 0.0;
      const occluders = window._activeScreenOccluders || [];
      if (occluders.length === 0) return 1.0;

      const cam = window._novaCamRef;
      if (!cam) return 1.0;
      const pos = new THREE.Vector3();
      entryMesh.getWorldPosition(pos);
      const candDist = cam.position.distanceTo(pos);
      const lowerId = String(entryId || "").toLowerCase();

      let visibility = 1.0;

      for (let i = 0; i < occluders.length; i++) {
        const occ = occluders[i];
        if (occ.mesh === entryMesh || occ.id === lowerId) {
          if (occ.isSun && (occ.isFocused || occ.screenRadPx > 130)) return 0.0;
          continue;
        }

        if (candDist > occ.distToCam + occ.worldRadius * 0.25) {
          const dPlanet = Math.hypot(planetSx - occ.sx, planetSy - occ.sy);
          const innerLimb = occ.screenRadPx * 0.92;
          const outerLimb = occ.screenRadPx * 1.32 + 8.0;

          if (dPlanet <= innerLimb) {
            return 0.0;
          } else if (dPlanet < outerLimb) {
            const t = (dPlanet - innerLimb) / Math.max(1.0, outerLimb - innerLimb);
            const smoothFade = t * t * (3.0 - 2.0 * t);
            visibility = Math.min(visibility, smoothFade);
          }
        }
      }
      return visibility;
    };

    function computeScriptTimedMetric(planetName, metricsList, scriptText) {
      if (!planetName || !metricsList || !metricsList.length || !scriptText) return null;
      if (planetName.toUpperCase().indexOf("SOLAR SYSTEM") !== -1) return null;

      const lowerScript = String(scriptText).toLowerCase();
      let bestMatch = null;
      let bestCharPos = 999999;

      for (let i = 0; i < metricsList.length; i++) {
        const label = String(metricsList[i][0] || "");
        const rawVal = String(metricsList[i][1] || "");
        const l = label.toLowerCase();
        const v = rawVal.toLowerCase();

        if (l.indexOf("object") !== -1 || v.indexOf("objects") !== -1) continue;

        const str = rawVal.trim();
        const parenMatch = str.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
        const primary = parenMatch ? parenMatch[1].trim() : str;
        const relative = parenMatch ? parenMatch[2].trim() : str;

        for (let r = 0; r < COURSE_METRIC_DECODER.length; r++) {
          const rule = COURSE_METRIC_DECODER[r];
          const matchesMetric = rule.match.some(function(m) { return l.indexOf(m) !== -1 || v.indexOf(m) !== -1; });
          if (!matchesMetric) continue;

          for (let p = 0; p < rule.scriptPhrases.length; p++) {
            const phrase = rule.scriptPhrases[p];
            const pos = lowerScript.indexOf(phrase);
            if (pos !== -1 && pos < bestCharPos) {
              bestCharPos = pos;
              bestMatch = {
                plainTitle: rule.getTitle(planetName, rawVal),
                courseTag: rule.getCourseTag(planetName, rawVal),
                primaryVal: primary,
                relativeVal: relative,
                explanation: rule.explain(rawVal, planetName),
                matchedPhrase: phrase,
                charIndex: pos
              };
            }
          }
        }
      }
      return bestMatch;
    }

    function computeScriptTimedSurfaceFeature(rawName, scriptText) {
      if (!rawName || !scriptText) return null;
      if (rawName.toUpperCase().indexOf("SOLAR SYSTEM") !== -1) return null;
      const lowerName = rawName.toLowerCase();
      const lowerScript = String(scriptText).toLowerCase();

      let candidates = [];
      for (const key in SURFACE_FEATURE_REGISTRY) {
        if (lowerName.indexOf(key.toLowerCase()) !== -1) {
          candidates = SURFACE_FEATURE_REGISTRY[key];
          break;
        }
      }
      for (let i = 0; i < candidates.length; i++) {
        const f = candidates[i];
        const kws = f.keywords || [];
        for (let j = 0; j < kws.length; j++) {
          const pos = lowerScript.indexOf(kws[j].toLowerCase());
          if (pos !== -1) {
            return {
              feature: f,
              matchedKeyword: kws[j],
              charIndex: pos
            };
          }
        }
      }
      // Universal fallback for any other celestial object (Moon, Uranus, Neptune, Pluto, Exoplanets, Black Holes)
      // so the Surface Zoom / Inspection feature works on 100% of objects in the tour!
      if ( scriptText.length > 20 ) {
        const firstClause = scriptText.split(/[.,;]/)[0] || rawName;
        return {
          feature: {
            id: "universal-site",
            name: rawName + " — Primary Feature",
            keywords: [firstClause.trim().split(" ").slice(-1)[0] || rawName],
            lat: 8.0, lon: -12.0, zoomRatio: 0.46,
            courseNote: "Observational Telemetry: Close-approach inspection of " + rawName + "'s primary structural envelope."
          },
          matchedKeyword: firstClause.trim().split(" ").slice(-1)[0] || rawName,
          charIndex: 25
        };
      }
      return null;
    }

    // Issue 3 Fix: Persistent, Frame-Locked Surface Zoom that overrides OrbitControls.minDistance and works on ALL objects!
    window.zoomToSurfaceFeature = function(siteId, e) {
      try {
        if (e && e.stopPropagation) e.stopPropagation();
        const rawName = getActivePlanetNameFromDOM();
        const state = window._tourBeatState;
        let found = null;
        for (const key in SURFACE_FEATURE_REGISTRY) {
          if (rawName.toLowerCase().indexOf(key.toLowerCase()) !== -1) {
            found = SURFACE_FEATURE_REGISTRY[key].find(function(f) { return f.id === siteId; });
            if (found) break;
          }
        }
        if (!found && state.matchedFeature && state.matchedFeature.id === siteId) {
          found = state.matchedFeature;
        }
        if (!found) return;

        window._activeSurfaceSite = found;

        const cam = window._novaCamRef || window.camera;
        const ctrl = window._novaCtrlRef || window.controls;
        const zState = window._surfaceZoomState;
        if (cam && ctrl) {
          if (zState.savedMinDistance === null) {
            zState.savedMinDistance = ctrl.minDistance || 0.1;
          }
          // Allow close-up surface inspection even on large bodies like the Sun!
          ctrl.minDistance = 0.05;
          if (!zState.lockedCamOffset) {
            zState.lockedCamOffset = cam.position.clone().sub(ctrl.target);
          }
          zState.active = true;
          zState.targetRatio = found.zoomRatio || 0.45;

      const targetId = (activeTargetMesh && activeTargetMesh.userData && activeTargetMesh.userData.id)
        ? String(activeTargetMesh.userData.id).toLowerCase()
        : '';

      if (!activeTarget || isFullSidebarOpen) {
        window._isSpatialCalloutVisible = false;
        layer.classList.add('opacity-0');
        card.style.pointerEvents = 'none';
        return;
      }

      // Handle tier-intro stops in Cosmic Tour where activeTargetMesh is null
      if (!activeTargetMesh) {
        if (!isTourActive) {
          window._isSpatialCalloutVisible = false;
          layer.classList.add('opacity-0');

          return;

        card.classList.remove('callout-flipped-left');
        line.style.opacity = '0';
        dot.style.opacity = '0';
        ring.style.opacity = '0';

        const cardW = 312;
        const cardH = card.offsetHeight || 182;
        const cardX = Math.max(24, Math.min(window.innerWidth - cardW - 24, 36));
        const cardY = Math.max(70, Math.min(window.innerHeight - cardH - 88, 110));
        card.style.transform = `translate3d(${cardX.toFixed(1)}px, ${cardY.toFixed(1)}px, 0)`;
        return;
      }

      line.style.opacity = '1';
      dot.style.opacity = '1';
      ring.style.opacity = '1';

      if (
        window._spatialCalloutDismissedForMesh === activeTargetMesh ||
        !isNodeVisible(activeTargetMesh)
      ) {
        window._isSpatialCalloutVisible = false;
        layer.classList.add('opacity-0');
        card.style.pointerEvents = 'none';
        return;
      }

      if (targetId === 'sun' && !isTourActive && camera.position.length() > 14.5 && !window._userClickedSunExplicitly) {
        window._isSpatialCalloutVisible = false;
        layer.classList.add('opacity-0');
        card.style.pointerEvents = 'none';
        return;
      }

      activeTargetMesh.getWorldPosition(_spatialWorldPos);
      _spatialProjVec.copy(_spatialWorldPos).project(camera);

      if (_spatialProjVec.z > 1.0) {
        window._isSpatialCalloutVisible = false;
        layer.classList.add('opacity-0');
        card.style.pointerEvents = 'none';
        return;
      }

      const sx = (_spatialProjVec.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-_spatialProjVec.y * 0.5 + 0.5) * window.innerHeight;

      if (sx < 20 || sx > window.innerWidth - 20 || sy < 20 || sy > window.innerHeight - 20) {
        window._isSpatialCalloutVisible = false;
        layer.classList.add('opacity-0');
        card.style.pointerEvents = 'none';
        return;
      }

      window._isSpatialCalloutVisible = true;
      layer.classList.remove('opacity-0');
      card.style.pointerEvents = 'auto';

      // Compute Apparent Screen Radius in Pixels so the leader line anchors on the outer limb and NEVER covers the object or accretion disk
      const distToCam = Math.max(0.1, camera.position.distanceTo(_spatialWorldPos));
      const fovRad = (camera.fov * Math.PI) / 180.0;
      const pxPerUnit = (window.innerHeight * 0.5) / Math.max(0.05, Math.tan(fovRad * 0.5) * distToCam);
      const baseSize = (activeTarget && activeTarget.size) ? Number(activeTarget.size) : 1.0;

      // Account for rings / relativistic accretion disks on Saturn, Uranus, Sagittarius A*, M87*, TON 618
      let haloMultiplier = 1.15;
      if (targetId === 'saturn' || targetId === 'uranus') haloMultiplier = 2.15;
      else if (targetId === 'sagittarius-a' || targetId === 'm87-star' || targetId === 'ton-618') haloMultiplier = 2.35;

      const apparentRadiusPx = Math.max(14, Math.min(185, baseSize * haloMultiplier * pxPerUnit));

      const cardW = 312;
      const cardH = card.offsetHeight || 182;
      const flipLeft = sx > window.innerWidth * 0.56;
      const dir = flipLeft ? -1 : 1;

      card.classList.toggle('callout-flipped-left', flipLeft);

      // Anchor reticle on the 35-degree upper outer limb of the object's visual perimeter
      const limbAngle = 0.48; // ~27.5 deg above horizontal
      const anchorX = sx + dir * Math.cos(limbAngle) * (apparentRadiusPx * 0.88);
      const anchorY = sy - Math.sin(limbAngle) * (apparentRadiusPx * 0.88);

      const elbowX = anchorX + dir * 32;
      const elbowY = anchorY - 22;
      const endX = elbowX + dir * 22;

      let cardX = flipLeft ? (endX - cardW) : endX;
      let cardY = elbowY - 26;

      // Clamp safely inside viewport away from top header and bottom HUD
      cardX = Math.max(18, Math.min(window.innerWidth - cardW - 24, cardX));
      cardY = Math.max(62, Math.min(window.innerHeight - cardH - 88, cardY));

      const attachX = flipLeft ? (cardX + cardW) : cardX;
      const attachY = Math.max(cardY + 16, Math.min(cardY + cardH - 16, elbowY));

      card.style.transform = `translate3d(${cardX.toFixed(1)}px, ${cardY.toFixed(1)}px, 0)`;
      dot.setAttribute('cx', anchorX.toFixed(1));
      dot.setAttribute('cy', anchorY.toFixed(1));
      ring.setAttribute('cx', anchorX.toFixed(1));
      ring.setAttribute('cy', anchorY.toFixed(1));
      line.setAttribute('points', `${anchorX.toFixed(1)},${anchorY.toFixed(1)} ${elbowX.toFixed(1)},${attachY.toFixed(1)} ${attachX.toFixed(1)},${attachY.toFixed(1)}`);
    };

    window.smoothFlyToTarget = function(durationMs = 2600) {
      if (!activeTargetMesh) return;

      TWEEN.removeAll();
      isFlyingToTarget = true;

      const startCamPos = camera.position.clone();
      const startTargetPos = controls.target.clone();

      
      const objRadius = (activeTarget && activeTarget.size) ? activeTarget.size : 1.0;
      const targetId = (activeTarget && activeTarget.id) ? activeTarget.id.toLowerCase() : '';
      const targetType = (activeTarget && activeTarget.type) ? activeTarget.type.toLowerCase() : '';
      const targetTier = (activeTarget && activeTarget.tier) ? activeTarget.tier : 1;

      // Keep planets, moons, and compact stars at 3.2x, but pull back for large structures
      let multiplier = 3.2;

      if (targetId === 'sagittarius-a-star') {
        multiplier = 6.2;
      } else if (['milky-way', 'andromeda', 'sombrero-galaxy', 'ton-618', 'messier-87'].includes(targetId)) {
        // Massive spiral disks, quasars & galactic cores (matches your 9.44.52 PM target screenshot)
        multiplier = 13.5;
      } else if (['eagle-nebula', 'orion-nebula', 'el-gordo', 'shapley-supercluster', 'great-attractor', 'bootes-void'].includes(targetId)) {
        // Expansive volumetric nebulae & superclusters
        multiplier = 9.5;
      } else if (['centaurus-a', 'crab-nebula', 'lmc', 'smc', 'smacs-0723', 'gn-z11', 'triangulum', 'pillars-of-creation'].includes(targetId)) {
        // Medium-large galaxies & supernova remnants
        multiplier = 7.5;
      } else if (targetType.includes('galaxy') || targetType.includes('cluster') || targetType.includes('nebula') || targetType.includes('quasar') || targetType.includes('void') || targetTier >= 3) {
        // Catch-all for any other deep-space galaxy/cluster/nebula
        multiplier = 9.0;
      } else if (objRadius >= 3.0 && targetId !== 'sun') {
        // Large supergiant stars or oversized bodies
        multiplier = 6.0;
      }

      const baseDist = Math.max(objRadius * multiplier, 4.2);
      const offsetDist = baseDist;



      const viewDir = startCamPos.clone().sub(startTargetPos);
      if (viewDir.lengthSq() < 0.001) viewDir.set(0.6, 0.3, 0.8);
      viewDir.normalize();

      // Balanced close-up elevation (head-on relativistic framing for Sagittarius A*)
      const offsetVec = (targetId === 'sagittarius-a-star')
        ? new THREE.Vector3(0, offsetDist * 0.08, offsetDist)
        : new THREE.Vector3(
            viewDir.x * offsetDist,
            Math.max(offsetDist * 0.28, 1.4),
            viewDir.z * offsetDist
          );

      const tweenObj = { t: 0 };
      new TWEEN.Tween(tweenObj)
        .to({ t: 1 }, durationMs)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => {
          if (!activeTargetMesh) return;
          const currentWorldPos = new THREE.Vector3();
          activeTargetMesh.getWorldPosition(currentWorldPos);

          const desiredEndCam = currentWorldPos.clone().add(offsetVec);
          camera.position.lerpVectors(startCamPos, desiredEndCam, tweenObj.t);
          controls.target.lerpVectors(startTargetPos, currentWorldPos, tweenObj.t);
          lastTrackedTargetPos.copy(currentWorldPos);
        })
        .onComplete(() => {
          isFlyingToTarget = false;
          if (activeTargetMesh) {
            activeTargetMesh.getWorldPosition(lastTrackedTargetPos);
          }
        })
        .start();
    };

      const t = (4.0 - sliderVal) / 3.0;
      const targetDist = minZoomDist * Math.pow(maxZoomDist / minZoomDist, t);

      const diff = camera.position.clone().sub(controls.target);
      if (diff.lengthSq() < 0.001) diff.set(0, 1, 1);
      const dir = diff.normalize();

      camera.position.copy(controls.target.clone().add(dir.multiplyScalar(targetDist)));

    function synthesizeDirectAstrophysicalAnswer(target, rawQuery) {
      const q = (rawQuery || "").toLowerCase().trim();
      const id = target.id;
      const arch = ASTROPHYSICAL_ARCHIVE[id] || {};
      const metricsMap = {};
      (arch.metrics || []).forEach(([k, v]) => { metricsMap[k.toLowerCase()] = `${k}: ${v}`; });
      const facts = arch.facts || [];

      // Topic-specific deep Q&A dictionary for natural, accurate answers
      const TOPIC_QA = {
        "saturn": {
          "ring": "Saturn's main ring system spans 282,000 km across (divided into the D, C, B, Cassini Division, A, F, G, and E rings) yet is only 10 to 30 meters thick. It is composed of 99.9% pure water-ice particles ranging in size from microscopic frost grains to house-sized boulders, likely formed from a tidally shattered icy moon or comet within Saturn's Roche limit.",
          "moon": "Saturn has 146 confirmed moons. Its largest moon, Titan (5,149 km diameter), possesses a dense nitrogen-rich atmosphere and liquid methane/ethane seas, while Enceladus vents hydrothermal water-ice plumes from a global subsurface ocean at its south pole.",
          "hex": "Saturn's north pole hosts a persistent 29,000-km-wide hexagonal standing wave in its atmospheric jet stream, driven by steep latitudinal wind-shear gradients Rotating with a period of 10h 39m."
        },
        "uranus": {
          "ring": "Uranus possesses 13 narrow, remarkably dark rings (albedo < 5%) composed of radiation-darkened organic ice boulders and dust, discovered in 1977 during a stellar occultation and flanked by small shepherd moons like Cordelia and Ophelia."
        },
        "jupiter": {
          "ring": "Jupiter has a faint, dusty 4-part ring system (halo, main ring, and two gossamer rings) discovered by Voyager 1 in 1979, continuously replenished by micrometeoroid impacts blasting dust off its inner moons Metis, Adrastea, Amalthea, and Thebe.",
          "spot": "The Great Red Spot is a high-pressure anticyclonic storm in Jupiter's southern hemisphere spanning ~16,350 km across (wider than Earth), featuring 430–680 km/h peripheral winds and persisting for over 300 years."
        },
        "neptune": {
          "ring": "Neptune is encircled by five faint, dusty rings (Galle, Le Verrier, Lassell, Arago, and Adams) featuring bright clumpy arcs ('Fraternité', 'Égalité', 'Liberté') stabilized by the gravitational resonance of its inner moon Galatea."
        }
      };

      if (TOPIC_QA[id]) {
        for (const [kw, ans] of Object.entries(TOPIC_QA[id])) {
          if (q.includes(kw)) return ans;
        }
      }

      // Match query keywords against the object's facts and metrics
      const keywords = q.replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w.length > 2 && !["what", "are", "the", "how", "why", "does", "for", "about", "tell", "with", "from", "that", "this"].includes(w));

      const matchedFacts = facts.filter(f => keywords.some(kw => f.toLowerCase().includes(kw)));
      const matchedMetrics = (arch.metrics || []).filter(([k, v]) => keywords.some(kw => k.toLowerCase().includes(kw) || v.toLowerCase().includes(kw)));

      if (q.includes("ring")) {
        const ringFact = facts.find(f => f.toLowerCase().includes("ring"));
        if (ringFact) return ringFact;
        return `${target.name} does not possess a prominent planetary ring system; in our Solar System, only the four giant planets (Jupiter, Saturn, Uranus, and Neptune) and minor bodies like Chariklo and Haumea maintain ring systems.`;
      }
      if (q.includes("moon") || q.includes("satellite")) {
        const moonFact = facts.find(f => /moon|satellite|titan|enceladus|triton|ganymede|europa|phobos|theia/i.test(f));
        if (moonFact) return moonFact;
      }
      if (q.includes("temp") || q.includes("hot") || q.includes("cold") || q.includes("heat")) {
        const tempMetric = (arch.metrics || []).find(([k]) => /temp|heat/i.test(k));
        const tempFact = facts.find(f => /temp|kelvin|°c|greenhouse|cold|hot|thermal/i.test(f));
        if (tempMetric && tempFact) return `${tempMetric[0]} is ${tempMetric[1]}. ${tempFact}`;
        if (tempMetric) return `${target.name}'s ${tempMetric[0].toLowerCase()} is ${tempMetric[1]}.`;
      }
      if (q.includes("mass") || q.includes("size") || q.includes("big") || q.includes("radius") || q.includes("large") || q.includes("heavy") || q.includes("dens")) {
        const sizeMetrics = (arch.metrics || []).filter(([k]) => /mass|radius|diameter|span|size|density|volume/i.test(k)).map(([k, v]) => `${k}: ${v}`).join(" • ");
        const sizeFact = facts.find(f => /mass|radius|size|largest|diameter|volume|dense/i.test(f));
        return [sizeMetrics, sizeFact].filter(Boolean).join(" — ") || target.summary;
      }
      if (q.includes("dist") || q.includes("far") || q.includes("where") || q.includes("locat") || q.includes("light")) {
        return `${target.name} is located at a distance of ${target.distance} (scale regime ${target.scale_order}). ${facts[0] || target.summary}`;
      }
      if (q.includes("orbit") || q.includes("year") || q.includes("rotat") || q.includes("spin") || q.includes("day") || q.includes("speed") || q.includes("vel")) {
        const kinMetrics = (arch.metrics || []).filter(([k]) => /orbit|period|rotat|spin|vel|day|reson/i.test(k)).map(([k, v]) => `${k}: ${v}`).join(" • ");
        const kinFact = facts.find(f => /orbit|rotat|spin|year|day|perihelion|velocity|km\/s/i.test(f));
        return [kinMetrics, kinFact].filter(Boolean).join(" — ") || target.summary;
      }
      if (q.includes("comp") || q.includes("made") || q.includes("atmos") || q.includes("gas") || q.includes("core") || q.includes("surface") || q.includes("water") || q.includes("ice")) {
        const compFact = facts.find(f => /hydrogen|helium|iron|silicate|water|ice|co₂|atmosphere|methane|crust|core|plasma|dust/i.test(f));
        if (compFact) return compFact;
      }

      if (matchedFacts.length > 0 || matchedMetrics.length > 0) {
        const mText = matchedMetrics.map(([k, v]) => `${k}: ${v}`).join(" • ");
        return [mText, ...matchedFacts].filter(Boolean).join(" ");
      }

      return `${target.summary} ${facts.join(" ")}`.trim();
    }

    // === PHOTOREALISTIC 3D SPHERICAL FBM NOISE & PBR TEXTURE/BUMP ENGINE ===
    const nasaTexCache = {};
    const nasaBumpCache = {};

    // Fast deterministic 3D spatial hash & gradient/value noise for seamless spherical mapping
    const _perm = new Uint8Array(512);
    (function initPerm() {
      let s = 1337;
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        s = (s * 16807) % 2147483647;
        const j = s % (i + 1);
        const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
      }
      for (let i = 0; i < 512; i++) _perm[i] = p[i & 255];
    })();

    function _fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function _lerp(a, b, t) { return a + t * (b - a); }

    function noise3D(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = _fade(x), v = _fade(y), w = _fade(z);
      const A = _perm[X] + Y, AA = _perm[A] + Z, AB = _perm[A + 1] + Z;
      const B = _perm[X + 1] + Y, BA = _perm[B] + Z, BB = _perm[B + 1] + Z;
      const h = (n) => (_perm[n & 511] / 127.5) - 1.0;
      return _lerp(
        _lerp(_lerp(h(AA), h(BA), u), _lerp(h(AB), h(BB), u), v),
        _lerp(_lerp(h(AA + 1), h(BA + 1), u), _lerp(h(AB + 1), h(BB + 1), u), v),
        w
      );
    }

    function fbm3D(x, y, z, octaves = 5, lacunarity = 2.05, gain = 0.5) {
      let sum = 0, amp = 0.5, freq = 1.0, norm = 0;
      for (let i = 0; i < octaves; i++) {
        sum += amp * noise3D(x * freq, y * freq, z * freq);
        norm += amp;
        freq *= lacunarity;
        amp *= gain;
      }
      return (sum / norm) * 0.5 + 0.5; // normalized [0, 1]
    }

    function ridgedFbm3D(x, y, z, octaves = 4) {
      let sum = 0, amp = 0.5, freq = 1.0, norm = 0;
      for (let i = 0; i < octaves; i++) {
        let n = 1.0 - Math.abs(noise3D(x * freq, y * freq, z * freq));
        n *= n;
        sum += n * amp;
        norm += amp;
        freq *= 2.1;
        amp *= 0.5;
      }
      return sum / norm;
    }

    function colorRamp(t, stops) {
      const c = Math.max(0, Math.min(1, t));
      for (let i = 0; i < stops.length - 1; i++) {
        const [t0, r0, g0, b0] = stops[i];
        const [t1, r1, g1, b1] = stops[i + 1];
        if (c >= t0 && c <= t1) {
          const f = (c - t0) / Math.max(0.0001, t1 - t0);
          return [
            r0 + (r1 - r0) * f,
            g0 + (g1 - g0) * f,
            b0 + (b1 - b0) * f
          ];
        }
      }
      const last = stops[stops.length - 1];
      return [last[1], last[2], last[3]];
    }

    function buildNASACanvasTexture(kind) {
      if (nasaTexCache[kind]) return nasaTexCache[kind];

      const w = 512, h = 256;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bumpCtx = bumpCanvas.getContext('2d');
      const bumpImg = bumpCtx.createImageData(w, h);
      const bData = bumpImg.data;

      let seedOffset = 0;
      for (let i = 0; i < kind.length; i++) seedOffset = (seedOffset * 31 + kind.charCodeAt(i)) % 997;
      const sxOff = (seedOffset % 17) * 3.7;
      const syOff = ((seedOffset >> 2) % 19) * 4.3;
      const szOff = ((seedOffset >> 4) % 23) * 2.9;

      // Pre-generate 3D crater centers for rocky/cratered bodies
      const craters = [];
      if (['moon', 'mercury', 'ceres', 'mars', 'sedna', 'oumuamua', 'comet'].includes(kind)) {
        let s = seedOffset + 101;
        const rand = () => { s = (s * 16807) % 2147483647; return (s & 0x7fffffff) / 2147483647; };
        const count = (kind === 'moon' || kind === 'mercury') ? 95 : 48;
        for (let i = 0; i < count; i++) {
          const z = rand() * 2 - 1;
          const a = rand() * Math.PI * 2;
          const rProj = Math.sqrt(Math.max(0, 1 - z * z));
          craters.push({
            cx: rProj * Math.cos(a),
            cy: z,
            cz: rProj * Math.sin(a),
            rad: 0.04 + Math.pow(rand(), 2.6) * 0.24,
            depth: 0.35 + rand() * 0.55
          });
        }
      }

      for (let py = 0; py < h; py++) {
        const v = py / (h - 1);
        const phi = v * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);
        const lat = Math.abs(v - 0.5) * 2.0; // 0 at equator, 1 at poles

        for (let px = 0; px < w; px++) {
          const u = px / w;
          const theta = u * Math.PI * 2.0;
          const nx = sinPhi * Math.cos(theta);
          const ny = cosPhi;
          const nz = sinPhi * Math.sin(theta);

          const X = nx + sxOff, Y = ny + syOff, Z = nz + szOff;
          let r = 128, g = 128, b = 128, bump = 0.5;

          if (kind === 'sun' || kind.startsWith('star-') || kind === 'stephenson') {
            // Domain-warped solar magnetohydrodynamic plasma granulation
            const qx = fbm3D(X * 3.8, Y * 3.8, Z * 3.8, 4);
            const qy = fbm3D(X * 3.8 + 5.2, Y * 3.8 + 1.3, Z * 3.8 + 2.8, 4);
            const gran = fbm3D(X * 6.5 + qx * 2.2, Y * 6.5 + qy * 2.2, Z * 6.5 + qx * 1.8, 5);
            const filaments = ridgedFbm3D(X * 4.5 + qy * 1.5, Y * 4.5 - qx * 1.5, Z * 4.5, 4);
            const spotMask = fbm3D(X * 2.1, Y * 2.1, Z * 2.1, 3);
            let t = gran * 0.65 + filaments * 0.35;
            if (spotMask < 0.27) {
              const sm = Math.pow((0.27 - spotMask) / 0.27, 1.5);
              t = Math.max(0.02, t - sm * 0.65);
            }

            let ramp;
            if (kind === 'star-m' || kind === 'stephenson') {
              ramp = [[0.0, 45, 5, 5], [0.35, 155, 22, 12], [0.65, 235, 75, 25], [0.88, 254, 175, 110], [1.0, 255, 240, 215]];
            } else if (kind === 'star-a') {
              ramp = [[0.0, 20, 55, 150], [0.4, 65, 135, 245], [0.72, 175, 215, 255], [1.0, 255, 255, 255]];
            } else if (kind === 'star-wd') {
              ramp = [[0.0, 55, 110, 220], [0.45, 165, 210, 255], [0.78, 235, 248, 255], [1.0, 255, 255, 255]];
            } else if (kind === 'star-k') {
              ramp = [[0.0, 75, 20, 5], [0.38, 195, 72, 14], [0.7, 248, 150, 45], [0.92, 255, 225, 155], [1.0, 255, 250, 225]];
            } else if (kind === 'star-f') {
              ramp = [[0.0, 140, 95, 20], [0.4, 230, 185, 65], [0.72, 254, 240, 175], [1.0, 255, 255, 255]];
            } else {
              // G-type / Sun
              ramp = [[0.0, 85, 22, 4], [0.32, 195, 72, 8], [0.58, 245, 145, 18], [0.82, 254, 218, 95], [1.0, 255, 252, 230]];
            }
            [r, g, b] = colorRamp(t, ramp);
            bump = t;
          }
          else if (kind === 'earth') {
            const warp = fbm3D(X * 2.2, Y * 2.2, Z * 2.2, 3) * 0.55;
            const elev = fbm3D(X * 1.85 + warp, Y * 1.85 - warp, Z * 1.85 + warp, 6);
            const detail = fbm3D(X * 9.0, Y * 9.0, Z * 9.0, 4);
            const moisture = fbm3D(X * 2.6 + 9.1, Y * 2.6 + 3.4, Z * 2.6, 4);
            const seaLevel = 0.515;

            if (lat + (detail - 0.5) * 0.14 > 0.84) {
              // Polar ice caps
              [r, g, b] = [242, 248, 255];
              bump = 0.62;
            } else if (elev < seaLevel) {
              // Deep ocean to turquoise continental shelf
              const depth = elev / seaLevel;
              const oRamp = [
                [0.0, 4, 18, 48],
                [0.65, 8, 45, 98],
                [0.90, 14, 88, 152],
                [1.0, 28, 138, 178]
              ];
              [r, g, b] = colorRamp(Math.pow(depth, 1.3), oRamp);
              bump = 0.15;
            } else {
              // Landmasses: beaches, forests, savannas, deserts, alpine peaks
              const landH = (elev - seaLevel) / (1.0 - seaLevel);
              const arid = Math.max(0, 1.0 - Math.abs(lat - 0.26) * 3.5) * (1.0 - moisture);
              if (landH > 0.62) {
                const mRamp = [[0.62, 92, 82, 68], [0.82, 135, 128, 120], [1.0, 245, 248, 252]];
                [r, g, b] = colorRamp(landH, mRamp);
              } else if (arid > 0.42) {
                const dRamp = [[0.0, 168, 135, 78], [0.5, 204, 158, 92], [1.0, 218, 178, 118]];
                [r, g, b] = colorRamp(detail, dRamp);
              } else {
                const vRamp = [[0.0, 22, 72, 34], [0.45, 38, 108, 46], [0.8, 74, 128, 56], [1.0, 112, 118, 68]];
                [r, g, b] = colorRamp(landH * 0.7 + detail * 0.3, vRamp);
              }
              bump = 0.35 + landH * 0.65;
            }

            // Swirling atmospheric clouds
            const cWarp = fbm3D(X * 3.2 + 4.1, Y * 3.2, Z * 3.2, 4);
            const clouds = fbm3D(X * 4.5 + cWarp * 1.6, Y * 4.5 + cWarp, Z * 4.5 - cWarp * 1.4, 5);
            if (clouds > 0.54) {
              const cAlpha = Math.min(0.88, Math.pow((clouds - 0.54) / 0.42, 1.15));
              r = _lerp(r, 250, cAlpha);
              g = _lerp(g, 252, cAlpha);
              b = _lerp(b, 255, cAlpha);
              bump = Math.max(bump, 0.55 + cAlpha * 0.25);
            }
          }
          else if (kind === 'moon' || kind === 'mercury' || kind === 'ceres' || kind === 'comet' || kind === 'oumuamua' || kind === 'sedna') {
            const baseFbm = fbm3D(X * 2.4, Y * 2.4, Z * 2.4, 5);
            const fine = fbm3D(X * 14.0, Y * 14.0, Z * 14.0, 4);
            const mariaNoise = fbm3D(X * 1.35, Y * 1.35, Z * 1.35, 4);

            let cShift = 0;
            for (let i = 0; i < craters.length; i++) {
              const c = craters[i];
              const dx = nx - c.cx, dy = ny - c.cy, dz = nz - c.cz;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist < c.rad * 1.45) {
                const x = dist / c.rad;
                if (x < 0.82) {
                  // Bowl floor
                  cShift -= (1.0 - (x / 0.82) * (x / 0.82)) * c.depth * 0.38;
                } else if (x < 1.15) {
                  // Raised impact rim
                  const rim = Math.sin(((x - 0.82) / 0.33) * Math.PI);
                  cShift += rim * c.depth * 0.32;
                } else {
                  // Ejecta blanket decay
                  const ej = 1.0 - (x - 1.15) / 0.30;
                  cShift += ej * c.depth * 0.08;
                }
              }
            }

            let hVal = baseFbm * 0.65 + fine * 0.35 + cShift;
            if (kind === 'moon' && mariaNoise < 0.46) {
              // Dark basaltic lunar maria plains
              const mFactor = Math.min(1, (0.46 - mariaNoise) * 4.5);
              hVal = _lerp(hVal, 0.26 + fine * 0.12 + cShift * 0.5, mFactor);
            }
            hVal = Math.max(0, Math.min(1, hVal));
            bump = hVal;

            let ramp;
            if (kind === 'moon') {
              ramp = [[0.0, 48, 52, 58], [0.32, 86, 90, 98], [0.58, 148, 152, 160], [0.82, 196, 200, 208], [1.0, 238, 240, 245]];
            } else if (kind === 'mercury') {
              ramp = [[0.0, 58, 53, 48], [0.38, 108, 100, 92], [0.68, 158, 148, 138], [0.9, 198, 188, 176], [1.0, 228, 220, 210]];
            } else if (kind === 'sedna') {
              ramp = [[0.0, 52, 10, 12], [0.4, 125, 26, 22], [0.75, 185, 52, 38], [1.0, 232, 125, 95]];
            } else if (kind === 'oumuamua') {
              ramp = [[0.0, 42, 14, 12], [0.5, 112, 36, 28], [0.85, 168, 68, 52], [1.0, 208, 112, 88]];
            } else if (kind === 'comet') {
              ramp = [[0.0, 22, 30, 42], [0.45, 58, 72, 92], [0.78, 125, 155, 185], [1.0, 215, 242, 255]];
            } else {
              // Ceres
              ramp = [[0.0, 52, 56, 62], [0.45, 112, 116, 124], [0.82, 168, 172, 180], [1.0, 248, 252, 255]];
            }
            [r, g, b] = colorRamp(hVal, ramp);
          }
          else if (kind === 'mars') {
            const warp = fbm3D(X * 2.5, Y * 2.5, Z * 2.5, 4) * 0.45;
            const terrain = fbm3D(X * 2.2 + warp, Y * 2.2 - warp, Z * 2.2, 6);
            const ridges = ridgedFbm3D(X * 5.0, Y * 5.0, Z * 5.0, 4);
            let hVal = terrain * 0.72 + ridges * 0.28;

            // Valles Marineris equatorial canyon scar
            if (Math.abs(ny + 0.08 * Math.sin(theta * 2.0)) < 0.055 && Math.cos(theta - 1.2) > 0.55) {
              hVal *= 0.35;
            }

            if (lat + (terrain - 0.5) * 0.12 > 0.89) {
              [r, g, b] = [248, 240, 232];
              bump = 0.78;
            } else {
              const mRamp = [
                [0.0, 62, 22, 12],
                [0.32, 118, 42, 18],
                [0.55, 178, 72, 28],
                [0.78, 218, 108, 48],
                [1.0, 242, 162, 104]
              ];
              [r, g, b] = colorRamp(hVal, mRamp);
              bump = hVal;
            }
          }
          else if (kind === 'venus') {
            const swirl = fbm3D(X * 2.6, Y * 4.2, Z * 2.6, 5);
            const chevron = Math.sin(ny * 10.0 + swirl * 5.5 + Math.cos(theta) * 1.4) * 0.5 + 0.5;
            const t = swirl * 0.62 + chevron * 0.38;
            const vRamp = [
              [0.0, 115, 52, 12],
              [0.35, 178, 98, 24],
              [0.68, 228, 168, 64],
              [0.9, 250, 222, 138],
              [1.0, 255, 245, 200]
            ];
            [r, g, b] = colorRamp(t, vRamp);
            bump = 0.4 + t * 0.2;
          }
          else if (kind === 'jupiter' || kind === 'saturn' || kind === 'uranus' || kind === 'neptune') {
            // Zonal atmospheric fluid bands + Kelvin-Helmholtz turbulence eddies
            const eddy = fbm3D(X * 4.2, Y * 8.5, Z * 4.2, 5);
            const fineTurb = fbm3D(X * 10.0 + eddy * 2.0, Y * 16.0, Z * 10.0 - eddy * 2.0, 4);
            const bandFreq = kind === 'jupiter' ? 18.0 : kind === 'saturn' ? 14.0 : 8.0;
            const warpedLat = ny + (eddy - 0.5) * (kind === 'jupiter' ? 0.16 : 0.08) + (fineTurb - 0.5) * 0.04;
            const bandWave = Math.sin(warpedLat * bandFreq) * 0.5 + 0.5;
            let t = bandWave * 0.65 + fineTurb * 0.35;

            if (kind === 'jupiter') {
              const jRamp = [
                [0.0, 92, 48, 28],
                [0.22, 158, 82, 42],
                [0.45, 212, 148, 96],
                [0.68, 238, 206, 168],
                [0.88, 248, 235, 215],
                [1.0, 182, 108, 62]
              ];
              [r, g, b] = colorRamp(t, jRamp);

              // Great Red Spot anticyclonic vortex in southern hemisphere
              const dLat = (ny - 0.36) / 0.11;
              let dLon = Math.atan2(nz, nx) - 0.8;
              if (dLon > Math.PI) dLon -= Math.PI * 2;
              if (dLon < -Math.PI) dLon += Math.PI * 2;
              dLon /= 0.22;
              const spotDist = Math.sqrt(dLat * dLat + dLon * dLon);
              if (spotDist < 1.25) {
                const swirlAng = Math.atan2(dLat, dLon) + (1.25 - spotDist) * 4.5;
                const sNoise = fbm3D(Math.cos(swirlAng) * 3, Math.sin(swirlAng) * 3, spotDist * 4, 3);
                const sFactor = Math.pow(Math.max(0, 1.0 - spotDist / 1.25), 1.4);
                const spotCol = colorRamp(sNoise, [[0.0, 135, 24, 18], [0.5, 205, 58, 32], [1.0, 245, 145, 105]]);
                r = _lerp(r, spotCol[0], sFactor);
                g = _lerp(g, spotCol[1], sFactor);
                b = _lerp(b, spotCol[2], sFactor);
              }
            } else if (kind === 'saturn') {
              const sRamp = [
                [0.0, 128, 98, 58],
                [0.3, 186, 152, 98],
                [0.6, 226, 198, 142],
                [0.85, 246, 228, 186],
                [1.0, 208, 178, 122]
              ];
              [r, g, b] = colorRamp(t, sRamp);
            } else if (kind === 'uranus') {
              const uRamp = [
                [0.0, 42, 148, 188],
                [0.45, 92, 198, 228],
                [0.8, 156, 230, 248],
                [1.0, 212, 246, 255]
              ];
              [r, g, b] = colorRamp(t * 0.55 + (1.0 - lat) * 0.45, uRamp);
            } else {
              // Neptune
              const nRamp = [
                [0.0, 16, 42, 128],
                [0.4, 32, 82, 196],
                [0.75, 68, 138, 238],
                [0.95, 168, 218, 255],
                [1.0, 235, 248, 255]
              ];
              [r, g, b] = colorRamp(t, nRamp);
            }
            bump = 0.45 + t * 0.18;
          }
          else {
            // Nebulae & Deep-Space Galaxies: volumetric filamentary emission clouds
            const w1 = fbm3D(X * 2.5, Y * 2.5, Z * 2.5, 4);
            const fil = ridgedFbm3D(X * 3.8 + w1 * 1.8, Y * 3.8 - w1 * 1.5, Z * 3.8, 5);
            const glow = fbm3D(X * 5.5, Y * 5.5, Z * 5.5, 4);
            const t = fil * 0.65 + glow * 0.35;
            let ramp;
            if (kind === 'nebula-orion') {
              ramp = [[0.0, 12, 4, 24], [0.38, 98, 18, 88], [0.68, 218, 58, 132], [0.9, 125, 205, 252], [1.0, 255, 245, 255]];
            } else if (kind === 'nebula-eagle') {
              // SHO Hubble Palette: Oxygen blue top, Sulfur red/gold base, dark pillar silhouettes
              const dustPillar = Math.exp(-Math.pow((nx * 1.5 + (w1 - 0.5) * 0.3) * 5.0, 2.0)) * Math.max(0, ny + 0.3);
              const sho = Math.max(0, 1.0 - dustPillar * 0.95) * t;
              ramp = [[0.0, 8, 12, 24], [0.35, 2, 132, 199], [0.65, 202, 138, 4], [0.85, 239, 68, 68], [1.0, 255, 248, 220]];
              [r, g, b] = colorRamp(sho, ramp);
              bump = sho;
            } else if (kind === 'nebula-crab') {
              // Synchrotron blue core + orange/green filamentary cage
              const coreBlue = Math.max(0, 1.0 - t * 1.2);
              ramp = [[0.0, 56, 189, 248], [0.4, 249, 115, 22], [0.75, 74, 222, 128], [1.0, 254, 240, 138]];
              [r, g, b] = colorRamp(t, ramp);
              bump = t;
            } else if (kind === 'galaxy-el-gordo') {
              // Chandra X-ray teardrop blue shock wake + red/yellow background galaxies
              const xrayWake = Math.max(0, 1.0 - Math.abs(nx - ny) * 1.5) * t;
              ramp = [[0.0, 10, 25, 60], [0.35, 29, 78, 216], [0.7, 96, 165, 250], [1.0, 255, 255, 255]];
              [r, g, b] = colorRamp(xrayWake, ramp);
              bump = xrayWake;
            } else if (kind === 'galaxy-cen-a') {
              const dust = Math.exp(-Math.pow((ny + (w1 - 0.5) * 0.18) * 9.0, 2.0));
              const core = Math.max(0, 1.0 - dust * 0.88) * t;
              ramp = [[0.0, 14, 10, 12], [0.35, 138, 72, 22], [0.7, 238, 178, 72], [1.0, 255, 248, 215]];
              [r, g, b] = colorRamp(core, ramp);
              bump = core;
            } else {
              ramp = [[0.0, 8, 14, 34], [0.4, 38, 78, 168], [0.72, 218, 158, 62], [1.0, 255, 245, 220]];
            }
            if (kind !== 'galaxy-cen-a') {
              [r, g, b] = colorRamp(t, ramp);
              bump = t;
            }
          }

          const idx = (py * w + px) * 4;
          data[idx] = Math.max(0, Math.min(255, r | 0));
          data[idx + 1] = Math.max(0, Math.min(255, g | 0));
          data[idx + 2] = Math.max(0, Math.min(255, b | 0));
          data[idx + 3] = 255;

          const bVal = Math.max(0, Math.min(255, (bump * 255) | 0));
          bData[idx] = bVal;
          bData[idx + 1] = bVal;
          bData[idx + 2] = bVal;
          bData[idx + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      bumpCtx.putImageData(bumpImg, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.needsUpdate = true;

      const bTex = new THREE.CanvasTexture(bumpCanvas);
      bTex.wrapS = THREE.RepeatWrapping;
      bTex.wrapT = THREE.ClampToEdgeWrapping;
      bTex.needsUpdate = true;

      nasaTexCache[kind] = tex;
      nasaBumpCache[kind] = bTex;
      return tex;
    }

    function classifyMeshTextureKind(name, typeStr) {
      const n = (name || '').toLowerCase();
      const t = (typeStr || '').toLowerCase();
      if (n.includes('moon') || n.includes('luna')) return 'moon';
      if (n.includes('mercury')) return 'mercury';
      if (n.includes('venus')) return 'venus';
      if (n.includes('earth') || n.includes('terra')) return 'earth';
      if (n.includes('mars')) return 'mars';
      if (n.includes('ceres')) return 'ceres';
      if (n.includes('jupiter')) return 'jupiter';
      if (n.includes('saturn')) return 'saturn';
      if (n.includes('uranus')) return 'uranus';
      if (n.includes('neptune')) return 'neptune';
      if (n.includes('sedna')) return 'sedna';
      if (n.includes('oumuamua')) return 'oumuamua';
      if (n.includes('halley') || t.includes('comet')) return 'comet';
      if (n.includes('orion nebula')) return 'nebula-orion';
      if (n.includes('eagle nebula')) return 'nebula-eagle';
      if (n.includes('crab nebula')) return 'nebula-crab';
      if (n.includes('centaurus a')) return 'galaxy-cen-a';
      if (n.includes('stephenson')) return 'stephenson';
      if (n.includes('polaris')) return 'star-f';
      if (n.includes('proxima') || n.includes('barnard') || n.includes('trappist') || n.includes('betelgeuse') || t.includes('red dwarf')) return 'star-m';
      if (n.includes('sirius b') || t.includes('white dwarf')) return 'star-wd';
      if (n.includes('sirius') || n.includes('earendel')) return 'star-a';
      if (n.includes('centauri b') || n.includes('toliman')) return 'star-k';
      if (n.includes('sun') || n.includes('sol') || n.includes('centauri a') || n.includes('rigil')) return 'sun';
      if (n.includes('el gordo')) return 'galaxy-el-gordo';
      if (n.includes('centaurus a') || n.includes('caldwell 77')) return 'galaxy-cen-a';
      if (n.includes('magellanic') || n.includes('attractor') || n.includes('shapley') || n.includes('smacs') || n.includes('gn-z11')) return 'galaxy-cluster';
      return null;
    }

    function ensurePhotorealisticLighting() {
      if (window._photorealLightsAdded) return;
      window._photorealLightsAdded = true;

      // Solar PointLight at origin (0,0,0) with infinite range and zero distance decay for consistent lighting across scales
      const solarLight = new THREE.PointLight(0xfffbeb, 2.6, 0, 0);
      solarLight.position.set(0, 0, 0);
      scene.add(solarLight);

      // Soft galactic hemisphere fill light so night-sides of planets have subtle deep-space visibility
      const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e1b4b, 0.65);
      scene.add(hemiLight);
    }

    
    // === 3D VOLUMETRIC NEBULA, DUST LANE & GALAXY CLUSTER ENGINE ===
    function createProceduralCloudTexture(drawFn, size = 256) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      drawFn(ctx, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    // Per-pixel 2D fBm + ridged multifractal noise with radial edge feathering (ZERO square borders!)
    function createFbmNebulaTexture(configFn, size = 384) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;

      for (let py = 0; py < size; py++) {
        const ny = (py / (size - 1)) * 2.0 - 1.0; // -1 to +1
        for (let px = 0; px < size; px++) {
          const nx = (px / (size - 1)) * 2.0 - 1.0; // -1 to +1
          const r2 = nx * nx + ny * ny;
          if (r2 >= 1.0) continue; // Strictly zero alpha outside unit circle -> impossible to have square edges

          const r = Math.sqrt(r2);
          // Smooth quintic radial falloff so edges melt imperceptibly into the starry background
          const radialMask = Math.pow(Math.max(0, 1.0 - r), 2.2);

          const rgba = configFn(nx, ny, r, radialMask);
          const idx = (py * size + px) * 4;
          data[idx]     = Math.max(0, Math.min(255, rgba[0] | 0));
          data[idx + 1] = Math.max(0, Math.min(255, rgba[1] | 0));
          data[idx + 2] = Math.max(0, Math.min(255, rgba[2] | 0));
          data[idx + 3] = Math.max(0, Math.min(255, (rgba[3] * radialMask) | 0));
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function buildVolumetricCelestialStructures() {
      // Pinpoint star & distant galaxy sprite with tight core and ultra-soft exponential halo
      const pinpointStarTex = createProceduralCloudTexture((ctx, s) => {
        const cx = s / 2, cy = s / 2;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 0.48);
        grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
        grad.addColorStop(0.08, 'rgba(255, 252, 240, 0.85)');
        grad.addColorStop(0.22, 'rgba(255, 240, 200, 0.25)');
        grad.addColorStop(0.55, 'rgba(200, 220, 255, 0.04)');
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.48, 0, Math.PI * 2);
        ctx.fill();
      }, 128);

      // JWST / Hubble 6- and 4-point diffraction spike star sprite for bright embedded OB stars
      const diffractionStarTex = createProceduralCloudTexture((ctx, s) => {
        const cx = s / 2, cy = s / 2;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 0.45);
        grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
        grad.addColorStop(0.12, 'rgba(224, 242, 254, 0.75)');
        grad.addColorStop(0.35, 'rgba(56, 189, 248, 0.15)');
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.45, 0, Math.PI * 2);
        ctx.fill();

        // Crisp diffraction spikes
        ctx.save();
        ctx.translate(cx, cy);
        for (let a of [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4]) {
          ctx.save();
          ctx.rotate(a);
          const len = (a === 0 || a === Math.PI / 2) ? s * 0.48 : s * 0.26;
          const spk = ctx.createLinearGradient(-len, 0, len, 0);
          spk.addColorStop(0.0, 'rgba(255,255,255,0)');
          spk.addColorStop(0.45, 'rgba(224,242,254,0.45)');
          spk.addColorStop(0.5, 'rgba(255,255,255,0.95)');
          spk.addColorStop(0.55, 'rgba(224,242,254,0.45)');
          spk.addColorStop(1.0, 'rgba(255,255,255,0)');
          ctx.fillStyle = spk;
          ctx.fillRect(-len, -1.1, len * 2, 2.2);
          ctx.restore();
        }
        ctx.restore();
      }, 128);

      // Soft fBm organic gas puff texture (zero geometric circles, pure turbulent cloud)
      const fbmGasPuffTex = createFbmNebulaTexture((nx, ny, r) => {
        const w = fbm3D(nx * 2.2, ny * 2.2, 0.5, 4);
        const density = fbm3D(nx * 3.4 + w * 0.8, ny * 3.4 - w * 0.8, 1.2, 5);
        const alpha = Math.max(0, (density - 0.22) * 1.35) * 190;
        return [255, 255, 255, alpha];
      }, 256);

      // Helper: creates a 3-tier multi-brightness star/galaxy field (faint dust stars, medium stars, bright beacons)
      function addMultiMagnitudeStarField(parentGroup, radiusSpan, totalCount, paletteHex, flattenY = 1.0) {
        const tiers = [
          { ratio: 0.68, sizeMult: 0.055, opacity: 0.42, tex: pinpointStarTex },     // Barely visible background stars/galaxies
          { ratio: 0.25, sizeMult: 0.105, opacity: 0.78, tex: pinpointStarTex },     // Medium cluster stars/galaxies
          { ratio: 0.07, sizeMult: 0.220, opacity: 0.96, tex: diffractionStarTex }   // Bright foreground/embedded OB stars with spikes
        ];
        const colors = paletteHex.map(h => new THREE.Color(h));

        tiers.forEach((tier, tIdx) => {
          const count = Math.max(8, Math.floor(totalCount * tier.ratio));
          const geo = new THREE.BufferGeometry();
          const pos = new Float32Array(count * 3);
          const col = new Float32Array(count * 3);

          for (let i = 0; i < count; i++) {
            // Gaussian-like radial concentration with wide outer halo blending into background
            const u = Math.random() * Math.PI * 2;
            const v = Math.acos(2 * Math.random() - 1);
            const dist = radiusSpan * Math.pow(Math.random(), 0.65);
            pos[i * 3]     = dist * Math.sin(v) * Math.cos(u);
            pos[i * 3 + 1] = dist * Math.sin(v) * Math.sin(u) * flattenY;
            pos[i * 3 + 2] = dist * Math.cos(v);

            const baseCol = colors[(i + tIdx) % colors.length];
            const dimFactor = (tIdx === 0) ? (0.45 + Math.random() * 0.45) : (0.8 + Math.random() * 0.2);
            col[i * 3]     = baseCol.r * dimFactor;
            col[i * 3 + 1] = baseCol.g * dimFactor;
            col[i * 3 + 2] = baseCol.b * dimFactor;
          }
          geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
          geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

          const pts = new THREE.Points(geo, new THREE.PointsMaterial({
            size: radiusSpan * tier.sizeMult,
            map: tier.tex,
            vertexColors: true,
            transparent: true,
            opacity: tier.opacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          }));
          pts.raycast = () => {};
          parentGroup.add(pts);
        });
      }

      const volumetricIds = [
        'andromeda', 'triangulum', 'sombrero-galaxy', 'messier-87', 'bootes-void',
        'el-gordo', 'centaurus-a', 'crab-nebula', 'eagle-nebula',
        'orion-nebula', 'lmc', 'smc', 'great-attractor',
        'shapley-supercluster', 'smacs-0723', 'gn-z11'
      ];

      
    // Time-sliced volumetric builder so each 512x512 fBm nebula yields to the browser cursor loop
    const volQueue = celestialObjects.filter((mesh) => {
      if (!mesh || !mesh.userData || !mesh.userData.id) return false;
      return volumetricIds.includes(mesh.userData.id) && !mesh.userData._volumetricBuilt;
    });
    let vIdx = 0;
    function buildOneVolumetric(mesh) {
      if (!mesh || !mesh.userData || !mesh.userData.id) return;
      const id = mesh.userData.id;
      if (!volumetricIds.includes(id)) return;
      if (mesh.userData._volumetricBuilt) return;

        // 0A. ANDROMEDA GALAXY (M31): NASA Spitzer/GALEX/Hubble Multi-Wavelength Spiral

        if (id === 'andromeda') {

            const rx = nx * Math.cos(ang) - ny * Math.sin(ang);
            const ry = nx * Math.sin(ang) + ny * Math.cos(ang);

            // Foreshortened inclined spiral disk plane (aspect ratio ~2.65 : 1)
            const dx = rx * 1.05;
            const dy = ry * 2.65;
            const rDisk = Math.sqrt(dx * dx + dy * dy);
            const theta = Math.atan2(dy, dx);

            // 1. Blazing white-pink-gold stellar bulge
            const bulgeR = Math.sqrt(rx * rx * 1.2 + ry * ry * 3.8);
            const coreWhite = Math.exp(-bulgeR * bulgeR * 28.0);

          function evalVoidSilhouette(nx, ny) {

        else if (id === 'centaurus-a') {

            const distToLane = Math.abs(ry + warp);

            const laneEnvelope = Math.exp(-Math.pow(distToLane / 0.17, 2.0)) * Math.exp(-rx * rx * 2.2);

            const edgeGlow = Math.exp(-Math.pow((distToLane - 0.06) / 0.09, 2.0)) * Math.exp(-rx * rx * 2.6) * fbmDust;
            const pinkKnots = Math.pow(Math.max(0, ridgedFbm3D(rx * 14.0, ry * 14.0, 3.3, 4) - 0.62), 2.0) * laneEnvelope * 6.5;

            const litCore = bulge * (1.0 - dustAbsorption * 0.92);

            const alpha = Math.min(255, (bulge * 235 + laneEnvelope * 210 + edgeGlow * 140));
